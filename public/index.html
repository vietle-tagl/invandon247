<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247 - Công cụ tra cứu và tạo phiếu vận đơn A4</title>
    
    <!-- CSS chính của dự án -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Thư viện hỗ trợ tạo PDF (Đã có trong libs của bạn) -->
    <script src="libs/html2canvas.min.js"></script>
    <script src="libs/jspdf.umd.min.js"></script>
    <script src="libs/html2pdf.bundle.min.js"></script> <!-- Nếu bạn có file này trong libs, nếu không dùng html2pdf.bundle thì dùng 2 file trên kết hợp -->
</head>
<body>

    <!-- HEADER (Điều hướng) -->
    <header class="navbar no-print">
        <div class="container">
            <div class="logo">📦 InVanDon247</div>
            <nav>
                <a href="#">Trang chủ</a>
                <a href="#">Tra cứu</a>
                <a href="#">Bảng kê</a>
                <a href="#">Giới thiệu</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        
        <!-- KHU VỰC TÌM KIẾM (Ẩn khi in) -->
        <section class="search-section no-print">
            <h2>Tra cứu vận đơn</h2>
            <div class="input-group">
                <input type="text" id="search-input" placeholder="Nhập mã vận đơn...">
                <button id="search-btn">Tra cứu</button>
            </div>

            <!-- Nút HÀNH ĐỘNG: In và Tải PDF (Thuộc lớp no-print để không in ra) -->
            <div class="action-buttons" id="action-buttons" style="display: none;">
                <button onclick="printPage()" class="btn btn-primary">🖨️ In A4</button>
                <button onclick="downloadPDF()" class="btn btn-secondary">⬇️ Tải Xuống PDF</button>
            </div>
        </section>

        <!-- KHU VỰC KẾT QUẢ (Sẽ được in và xuất PDF) -->
        <!-- ID="print-area" quan trọng để JS biết phần nào cần in -->
        <section id="print-area" class="result-section">
            <!-- Dữ liệu sẽ được JS render vào đây -->
            <!-- Ví dụ: <div class="timeline">...</div> -->
        </section>

    </main>

    <!-- FOOTER (CHỈ CÓ 1 LẦN DUY NHẤT, NẰM NGOÀI VÙNG IN ẤN) -->
    <!-- Nhưng để nó hiện trong bản in, ta dùng CSS in ép nó hiển thị -->
    <footer class="site-footer">
        <div class="container">
            © 2026 InVanDon247. All rights reserved. Dữ liệu được truy xuất từ hệ thống VNPost.
        </div>
    </footer>

    <!-- CÁC FILE JS CỦA DỰ ÁN -->
    <!-- File xử lý API và logic tra cứu -->
    <script src="js/api.js"></script>
    <!-- File xử lý xuất PDF -->
    <script src="js/pdf.js"></script>
    <!-- File xử lý nhập Excel (nếu có) -->
    <script src="js/excel.js"></script>

    <!-- SCRIPT NỘI BỘ XỬ LÝ SỰ KIỆN IN VÀ TẢI PDF -->
    <script>
        // 1. Hàm In A4
        function printPage() {
            // Gọi hàm in của trình duyệt
            window.print();
        }

        // 2. Hàm Tải PDF (Sử dụng thư viện html2pdf.js)
        function downloadPDF() {
            // Lấy đối tượng phần tử chứa kết quả cần xuất PDF
            const element = document.getElementById('print-area');
            
            // Kiểm tra xem có dữ liệu để xuất không
            if (!element || element.innerHTML.trim() === '') {
                alert('Vui lòng tra cứu trước khi tải PDF!');
                return;
            }

            // Cấu hình xuất file PDF khổ A4
            const opt = {
                margin:       10, // margin (mm)
                filename:     'ket-qua-tra-cuu-InVanDon247.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true }, // useCORS: true để tải được ảnh bản đồ Google Maps
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                // Ngắt trang thông minh để không bị cắt chữ/khung
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
            };

            // Thực hiện xuất PDF
            html2pdf().set(opt).from(element).save();
        }

        // Giả lập sự kiện khi bấm nút tra cứu (Để hiện nút In/PDF)
        document.getElementById('search-btn').addEventListener('click', function() {
            // ... Code gọi API lấy dữ liệu ...
            
            // Sau khi lấy được dữ liệu và render xong:
            document.getElementById('action-buttons').style.display = 'block';
            
            // Giả lập render dữ liệu vào #print-area
            document.getElementById('print-area').innerHTML = `
                <h3>Kết quả tra cứu</h3>
                <p>Mã đơn: 591520</p>
                <p>Trạng thái: Đã phát thành công</p>
                <div class="map-placeholder">(Vị trí bản đồ Google Maps...)</div>
            `;
        });
    </script>

</body>
</html>
