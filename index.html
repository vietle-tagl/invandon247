<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InVanDon247 - Tra cứu VNPost</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --blue-primary:#0a4b88;
  --blue-dark:#06325d;
  --blue-light:#eef5fc;
  --orange:#f58220;
  --green:#059669;
  --green-bg:#ecfdf5;
  --bg-main:#f1f5f9;
  --card-bg:#ffffff;
  --text-main:#0f172a;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --shadow-sm:0 2px 4px rgba(0,0,0,0.02);
  --shadow-md:0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-lg:0 20px 30px -10px rgba(10, 75, 136, 0.12);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:var(--bg-main);
  color:var(--text-main);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}


/* =========================================================
   HEADER (TẠO HIỆU ỨNG NỔI KHỐI KÍNH MỜ)
========================================================= */

.topbar{
  height:76px;
  background:rgba(255, 255, 255, 0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-color);
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 20px rgba(0,0,0,0.04);
}

.topbar-inner{
  max-width:1140px;
  margin:0 auto;
  padding:0 20px;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
}

.brand-logo{
  width:80px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 80px;
}

.brand-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.06));
}

.brand strong{
  font-size:20px;
  font-weight:800;
  color:var(--blue-primary);
  letter-spacing:-0.3px;
}

.brand small{
  display:block;
  color:var(--text-muted);
  font-size:11px;
  font-weight:500;
  margin-top:1px;
}

.nav{
  display:flex;
  gap:28px;
  font-size:13px;
  font-weight:600;
}

.nav a{
  color:var(--text-muted);
  text-decoration:none;
  transition:all 0.2s ease;
  padding:6px 12px;
  border-radius:6px;
}

.nav a:hover{
  color:var(--blue-primary);
  background:var(--blue-light);
}


/* =========================================================
   PAGE CONTAINER
========================================================= */

.page{
  max-width:1140px;
  margin:32px auto 60px;
  padding:0 20px;
}


/* =========================================================
   SEARCH CARD (NỔI KHỐI CAO CẤP)
========================================================= */

.search-card{
  background:var(--card-bg);
  border:1px solid rgba(226, 232, 240, 0.8);
  border-radius:16px;
  padding:32px 36px;
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
}

.search-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg, var(--blue-primary), var(--orange));
}

.search-title{
  text-align:center;
  color:var(--blue-dark);
  font-size:22px;
  font-weight:800;
  margin:0;
  letter-spacing:-0.5px;
}

.search-sub{
  text-align:center;
  color:var(--text-muted);
  font-size:12.5px;
  margin:6px 0 24px;
}

.form-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:20px;
}

.field label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--text-main);
  margin-bottom:8px;
}

.field input{
  width:100%;
  height:44px;
  border:1.5px solid var(--border-color);
  border-radius:8px;
  padding:0 14px;
  font-size:14px;
  font-weight:500;
  color:var(--text-main);
  background:#fafafa;
  outline:none;
  transition:all 0.2s ease;
}

.field input:focus{
  border-color:var(--blue-primary);
  background:#fff;
  box-shadow:0 0 0 4px rgba(10, 75, 136, 0.1);
}


/* CAPTCHA */

.captcha-line{
  display:flex;
  gap:8px;
}

.captcha-line input{
  flex:1;
}

.captcha-slot{
  width:110px;
  height:44px;
  flex:0 0 110px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1.5px solid var(--border-color);
  border-radius:8px;
  overflow:hidden;
}

.captcha-img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
}

.captcha-img.loaded{
  display:block;
}

.reload{
  border:1.5px solid var(--border-color);
  background:#f8fafc;
  color:var(--text-main);
  border-radius:8px;
  padding:0 14px;
  cursor:pointer;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:all 0.2s ease;
}

.reload:hover{
  background:var(--blue-light);
  border-color:var(--blue-primary);
  color:var(--blue-primary);
}

.reload:disabled{
  opacity:.6;
  cursor:wait;
}


/* BUTTON TRA CỨU */

.submit{
  width:100%;
  height:46px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
  color:#fff;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.3px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(10, 75, 136, 0.25);
  transition:all 0.25s ease;
}

.submit:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(10, 75, 136, 0.35);
}

.submit:disabled{
  opacity:.6;
  transform:none;
  cursor:wait;
}


/* MESSAGE */

.msg{
  margin-top:16px;
  padding:12px 16px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  display:none;
}

.msg.error{
  display:block;
  background:#fef2f2;
  color:#dc2626;
  border:1px solid #fecaca;
}

.msg.ok{
  display:block;
  background:var(--green-bg);
  color:var(--green);
  border:1px solid #a7f3d0;
}

.msg.wait{
  display:block;
  background:var(--blue-light);
  color:var(--blue-primary);
  border:1px solid #bfdbfe;
}


/* =========================================================
   RESULT BUTTONS
========================================================= */

.result-head{
  display:none;
  justify-content:flex-end;
  gap:10px;
  margin:24px 0 14px;
}

.action{
  border:0;
  border-radius:8px;
  padding:10px 18px;
  color:#fff;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  transition:all 0.2s ease;
  box-shadow:var(--shadow-sm);
}

.action:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
}

.print-btn{
  background:linear-gradient(135deg, #10b981, #047857);
}

.pdf-btn{
  background:linear-gradient(135deg, #0284c7, #0369a1);
}


/* =========================================================
   RESULT CARD
========================================================= */

.result-card{
  background:var(--card-bg);
  border:1px solid rgba(226, 232, 240, 0.9);
  border-radius:16px;
  padding:28px 32px;
  box-shadow:var(--shadow-md);
  display:none;
}

/* KHUNG CHI TIẾT BƯU GỬI NỔI BẬT */
.detail-box{
  background:linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  border:1px solid var(--border-color);
  border-radius:12px;
  padding:20px 24px;
  margin-bottom:28px;
  box-shadow:inset 0 1px 2px rgba(255,255,255,0.8);
}

.detail-title{
  color:var(--blue-primary);
  font-size:13.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1.2fr;
  row-gap:14px;
  column-gap:20px;
  font-size:13px;
  color:var(--text-main);
}

.detail-item{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.detail-item .icon{
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;
  height:20px;
  flex:0 0 20px;
}

.status-pin-icon{
  width:16px;
  height:18px;
  fill:#ef4444;
  display:block;
}

.pin-icon{
  width:16px;
  height:18px;
  fill:var(--blue-primary);
  display:block;
}

.detail-item b{
  color:var(--text-main);
  font-weight:700;
}

.detail-item .status-text{
  color:#2563eb;
  font-weight:800;
}

.detail-item .receiver-text{
  color:#059669;
  font-weight:800;
}

.section-title{
  font-size:13px;
  font-weight:800;
  color:var(--text-muted);
  margin:28px 0 16px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}


/* =========================================================
   TIMELINE (DÒNG THỜI GIAN SẮC NÉT)
========================================================= */

.timeline{
  position:relative;
  margin:0;
}

.timeline:before{
  content:"";
  position:absolute;
  left:8px;
  top:8px;
  bottom:8px;
  width:2px;
  background:#cbd5e1;
}

.event{
  position:relative;
  display:grid;
  grid-template-columns:150px minmax(0,1.4fr) minmax(200px,1fr) 36px;
  gap:14px;
  padding:0 0 16px 0;
  min-height:52px;
}

.event-dot{
  position:absolute;
  left:3px;
  top:5px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#94a3b8;
  border:2px solid #fff;
  box-shadow:0 0 0 2px #e2e8f0;
}

.event.latest .event-dot{
  background:#10b981;
  box-shadow:0 0 0 3px rgba(16, 185, 129, 0.25);
}

.event-time{
  padding-left:26px;
  font-size:12px;
  font-weight:600;
  color:var(--text-muted);
}

.event-status{
  font-size:12.5px;
  line-height:1.4;
  color:var(--text-main);
}

.event-status b{
  display:block;
  color:var(--text-muted);
  font-size:11px;
  font-weight:500;
  margin-top:2px;
}

.event.latest .event-status{
  color:#047857;
  font-weight:700;
}

.event.latest .event-status b{
  color:#047857;
  font-weight:700;
}

.event-location{
  font-size:12px;
  color:var(--text-muted);
  line-height:1.4;
}

.map-btn{
  width:28px;
  height:28px;
  border:0;
  border-radius:6px;
  background:var(--blue-light);
  color:var(--blue-primary);
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s ease;
}

.map-btn:hover{
  background:var(--blue-primary);
  color:#fff;
}


/* =========================================================
   MAP
========================================================= */

.map-panel{
  display:none;
  margin:20px 0;
  border:1px solid var(--border-color);
  border-radius:12px;
  overflow:hidden;
  box-shadow:var(--shadow-md);
}

.map-panel.show{
  display:block;
}

.map-toolbar{
  height:42px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-size:12px;
  border-bottom:1px solid var(--border-color);
}

.map-toolbar b{
  color:var(--text-main);
}

.map-toolbar a{
  color:var(--blue-primary);
  font-weight:600;
  text-decoration:none;
}

.map-frame{
  width:100%;
  height:320px;
  border:0;
  display:block;
}


/* =========================================================
   DELIVERY (3 CỘT GỘP BƯU TÁ)
========================================================= */

.delivery{
  margin-top:20px;
}

.delivery table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px;
  table-layout:fixed;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border-color);
}

.delivery th{
  background:#f8fafc;
  text-align:left;
  padding:10px 14px;
  color:var(--text-muted);
  font-weight:700;
  border-bottom:1px solid var(--border-color);
}

.delivery td{
  border-bottom:1px solid var(--border-color);
  padding:10px 14px;
  vertical-align:top;
  line-height:1.4;
  color:var(--text-main);
}

.delivery tr:last-child td{
  border-bottom:0;
}

.delivery th:nth-child(1),
.delivery td:nth-child(1){ width:20% }
.delivery th:nth-child(2),
.delivery td:nth-child(2){ width:38% }
.delivery th:nth-child(3),
.delivery td:nth-child(3){ width:42% }

.postman-info{
  margin-top:4px;
  color:var(--text-muted);
  font-size:11px;
}

.screen-footer{
  text-align:center;
  border-top:1px solid var(--border-color);
  margin-top:24px;
  padding-top:14px;
  color:var(--text-muted);
  font-size:10px;
}


/* =========================================================
   PRINT AREA & PAGE
========================================================= */

#print-area{ display:none }

@page{
  size:A4 portrait;
  margin:8mm
}

.print-page{
  width:194mm;
  min-height:281mm;
  position:relative;
  page-break-after:always;
  padding:0
}

.print-page:last-child{ page-break-after:auto }

.print-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:2px solid var(--blue-primary);
  padding-bottom:5px;
  margin-bottom:7px
}

.print-logo{
  width:62px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden
}

.print-logo img{
  width:62px;
  height:42px;
  object-fit:contain;
  display:block
}

.print-brand{
  font-size:13px;
  color:var(--blue-primary);
  font-weight:700
}

.print-brand small{
  display:block;
  font-size:7px;
  color:#777;
  font-weight:400
}

.print-meta{
  text-align:right;
  font-size:7px;
  color:#777;
  line-height:1.5
}

.print-title{
  text-align:center;
  border:1px solid #cfd5db;
  padding:5px;
  margin-bottom:7px
}

.print-title b{ font-size:11px }

.print-code{
  font-size:12px;
  font-weight:700;
  color:#a66c00;
  margin-top:1px
}

.print-summary{ margin-bottom:7px }

.pbox{
  border:1px solid #cdd3d8;
  padding:6px
}

.pbox h4{
  font-size:8px;
  color:var(--blue-primary);
  margin:0 0 4px;
  border-bottom:1px dashed #ddd;
  padding-bottom:2px
}

.pgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px
}

.prow{
  font-size:7.2px;
  line-height:1.45
}

.prow span{
  color:#777;
  display:inline-block;
  width:70px
}

.prow b{ color:#30353a }

.print-history-title{
  font-size:8px;
  font-weight:700;
  color:#333;
  border-left:3px solid var(--blue-primary);
  padding-left:4px;
  margin:4px 0
}

.print-columns{
  column-count:2;
  column-gap:7mm;
  column-rule:1px solid #ddd
}

.p-event{
  break-inside:avoid;
  page-break-inside:avoid;
  border-bottom:1px dashed #ddd;
  padding:0 0 4px;
  margin:0 0 4px;
  font-size:7.1px;
  line-height:1.25
}

.p-time{
  font-weight:700;
  color:#555
}

.p-event.latest .p-time,
.p-event.latest .p-status{ color:#087d42 }

.p-status{ margin-top:1px }
.p-meta, .p-address{ color:#555 }

.print-delivery{ margin-top:7px }
.print-delivery h4{ font-size:8px; margin:0 0 3px }

.print-delivery table{
  width:100%;
  border-collapse:collapse;
  font-size:7px;
  table-layout:fixed
}

.print-delivery th{
  background:#edf1f5;
  text-align:left;
  padding:3px
}

.print-delivery td{
  border:1px solid #d8dde2;
  padding:3px;
  vertical-align:top
}

.print-delivery th:nth-child(1), .print-delivery td:nth-child(1){ width:20% }
.print-delivery th:nth-child(2), .print-delivery td:nth-child(2){ width:38% }
.print-delivery th:nth-child(3), .print-delivery td:nth-child(3){ width:42% }

.print-footer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  border-top:1px solid #ddd;
  padding-top:3px;
  text-align:center;
  font-size:6.5px;
  color:#999
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){
  .brand-logo{
    width:68px;
    flex-basis:68px;
  }

  .nav{ display:none }

  .form-grid,
  .detail-grid{
    grid-template-columns:1fr;
  }

  .search-card, .result-card{
    padding:20px 18px;
  }

  .event{
    grid-template-columns:1fr 30px;
    gap:6px;
    padding-left:22px;
  }

  .event-time{ padding-left:0 }

  .event-status,
  .event-location{ grid-column:1 }

  .event-location{ padding-left:0 }

  .event-dot{ left:0 }

  .timeline:before{ left:5px }

  .result-head{ justify-content:stretch }

  .action{ flex:1 }

  .delivery{ overflow-x:auto }

  .delivery table{ min-width:580px }
}


/* =========================================================
   PRINT
========================================================= */

@media print{
  body{ background:#fff }

  .no-print,
  .topbar,
  .page>.search-card,
  .result-head,
  .result-card{
    display:none!important
  }

  #print-area{ display:block!important }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header class="topbar no-print">
  <div class="topbar-inner">

    <div class="brand">

      <div class="brand-logo" aria-label="Vietnam Post">

        <img
          src="https://cdn.haitrieu.com/wp-content/uploads/2022/01/Logo-VietNam-Post.png"
          alt="Vietnam Post"
          loading="eager"
          decoding="async"
          referrerpolicy="no-referrer"
        >

      </div>

      <div>
        <strong>InVanDon247</strong>
        <small>Công cụ tra cứu và tạo phiếu vận đơn A4</small>
      </div>

    </div>


    <nav class="nav">

      <a href="#">Trang chủ</a>
      <a href="#search">Tra cứu</a>
      <a href="#result">Hướng dẫn</a>
      <a href="#">Giới thiệu</a>

    </nav>

  </div>
</header>



<!-- =======================================================
     MAIN
======================================================== -->

<main class="page">


<!-- =======================================================
     SEARCH
======================================================== -->

<section class="search-card no-print" id="search">

  <h1 class="search-title">
    TRA CỨU VẬN ĐƠN
  </h1>

  <div class="search-sub">
    Nhập mã vận đơn và mã CAPTCHA để xem hành trình bưu gửi
  </div>


  <div class="form-grid">


    <!-- MÃ VẬN ĐƠN -->

    <div class="field">

      <label>
        1. Mã vận đơn VNPost
      </label>

      <input
        id="trackingCode"
        type="text"
        placeholder="Ví dụ: RB608708009VN"
        autocomplete="off"
      >

    </div>



    <!-- CAPTCHA -->

    <div class="field">

      <label>
        2. Mã xác thực (CAPTCHA)
      </label>

      <div class="captcha-line">

        <input
          id="captchaText"
          type="text"
          placeholder="Nhập mã CAPTCHA"
          autocomplete="off"
        >

        <div class="captcha-slot">

          <img
            id="captchaImg"
            class="captcha-img"
            alt="CAPTCHA"
          >

        </div>


        <button
          id="reloadCaptcha"
          class="reload"
          type="button"
          onclick="loadCaptcha()"
        >
          ↻ Đổi mã
        </button>

      </div>

    </div>

  </div>


  <button
    id="btnSubmit"
    class="submit"
    type="button"
    onclick="submitTracking()"
  >
    🔎 TRA CỨU VẬN ĐƠN
  </button>


  <div id="message" class="msg"></div>

</section>



<!-- =======================================================
     RESULT ACTIONS
======================================================== -->

<div id="result" class="result-head no-print">

  <button

<script>


/* =========================================================
   GLOBAL
========================================================= */

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;

let captchaRequestId = 0;



/* =========================================================
   ESC HTML
========================================================= */

const esc = s =>
  String(s ?? '-')
  .replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );



/* =========================================================
   CLEAN STATUS
========================================================= */

function cleanStatus(s){

  return String(s || '-')
    .replace(/\s*\(\d{4,7}\s*:[^)]+\)/g, '')
    .replace(/\s*[\.\,]\s*Người nhận\s*:.*$/gi, '')
    .replace(/\s*[\.\,]\s*Ghi chú\s*:.*$/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();

}



/* =========================================================
   ADDRESS
========================================================= */

function getAddress(item){

  return typeof item?.VI_TRI === 'string' &&
         item.VI_TRI.trim()
    ? item.VI_TRI.trim()
    : '-';

}



/* =========================================================
   COORDINATES
========================================================= */

function getCoords(item){

  let lat =
    item?.LAT ??
    item?.Lat ??
    item?.latitude ??
    item?.Latitude;

  let lng =
    item?.LNG ??
    item?.Lon ??
    item?.LONG ??
    item?.longitude ??
    item?.Longitude;

  return lat && lng
    ? {lat,lng}
    : null;

}



/* =========================================================
   OFFICE
========================================================= */

function getOffice(item){

  const text = String(
    item?.StatusText ||
    item?.STATUSTEXT ||
    ''
  );

  const m = text.match(
    /\((\d{4,7})\s*:\s*([^)]*)\)/
  );

  if(m){

    return {
      code:m[1],
      name:m[2].trim(),
      full:m[1]+' - '+m[2].trim()
    };

  }


  const code =
    item?.POSCode ??
    item?.POSCODE ??
    item?.ToPOSCode ??
    '';


  return {
    code:String(code || '-'),
    name:'',
    full:String(code || '-')
  };

}



/* =========================================================
   OFFICE FOR DELIVERY
========================================================= */

function getOfficeForDelivery(data,d){

  const direct = getOffice({
    StatusText:
      d?.STATUSTEXT ||
      d?.StatusText,

    POSCode:
      d?.POSCODE ||
      d?.POSCode ||
      d?.ToPOSCode
  });


  if(direct.name){
    return direct;
  }


  const code = String(
    d?.ToPOSCode ||
    d?.POSCode ||
    d?.POSCODE ||
    direct.code ||
    ''
  ).trim();


  if(code){

    const found =
      (data?.locate || [])
      .slice()
      .reverse()
      .find(
        x =>
          String(
            x?.POSCode ||
            x?.POSCODE ||
            ''
          ).trim() === code
      );


    if(found){
      return getOffice(found);
    }

  }


  return direct;

}



/* =========================================================
   DELIVERY RECORD
========================================================= */

function getDeliveryRecord(data){

  const list =
    Array.isArray(data?.delivery)
      ? data.delivery
      : [];


  if(!list.length){
    return null;
  }


  return list.find(
    d =>
      /phát thành công|delivered/i.test(
        String(
          d?.STATUSTEXT ||
          d?.StatusText ||
          ''
        )
      )
  ) || list[list.length - 1];

}



/* =========================================================
   DELIVERY TIME
========================================================= */

function getDeliveryTime(d){

  const value =
    d?.NGAY_PHAT ||
    d?.DATE ||
    d?.Date ||
    d?.TimeDetail ||
    d?.NGAY_NHAP ||
    '-';


  return String(value || '-').trim() || '-';

}



/* =========================================================
   DELIVERY PERSON & RECEIVER
========================================================= */

function getDeliveryPerson(data){

  const d = getDeliveryRecord(data);


  if(!d){

    return {
      route:'-',
      name:'-',
      phone:'-',
      receiver:'-',
      time:'-'
    };

  }


  const cn =
    String(d.NGAY_CN || '').trim();


  let route='-';
  let name='-';
  let phone='-';


  if(cn){

    const slashIndex =
      cn.indexOf('/');


    if(slashIndex >= 0){

      route =
        cn.slice(
          0,
          slashIndex
        ).trim() || '-';


      let right =
        cn.slice(
          slashIndex + 1
        ).trim();


      const pm =
        right.match(
          /(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*(\d[\d .-]{7,}\d)\s*$/iu
        ) ||
        right.match(
          /(\d[\d .-]{8,}\d)\s*$/
        );


      if(pm){

        phone =
          pm[1].replace(
            /\D/g,
            ''
          );

        right =
          right.slice(
            0,
            pm.index
          ).trim();

      }


      name =
        right
          .replace(
            /[.\s]*(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*$/iu,
            ''
          )
          .replace(/[.\s]+$/,'')
          .trim() || '-';

    }

  }


  const st =
    String(
      d.STATUSTEXT ||
      d.StatusText ||
      ''
    );


  let receiver='-';


  const rm = st.match(/Người nhận\s*:\s*(.*)$/i);


  if(rm){

    receiver =
      rm[1]
        .replace(/^\(\s*\)\s*/, '')
        .trim();

  }


  return {
    route,
    name,
    phone,
    receiver,
    time:getDeliveryTime(d)
  };

}



/* =========================================================
   LATEST STATUS
========================================================= */

function latestStatus(data){

  const d =
    getDeliveryRecord(data);


  if(d?.STATUSTEXT){

    return String(
      d.STATUSTEXT
    ).trim();

  }


  const loc =
    data.locate || [];


  return loc.length
    ? String(
        loc[loc.length - 1].StatusText ||
        '-'
      ).trim()
    : 'ĐANG VẬN CHUYỂN';

}



/* =========================================================
   MESSAGE
========================================================= */

function showMsg(
  text,
  type='error'
){

  const m =
    document.getElementById(
      'message'
    );

  m.className =
    'msg ' + type;

  m.textContent =
    text;

}



/* =========================================================
   FETCH TIMEOUT
========================================================= */

function fetchWithTimeout(
  url,
  options={},
  timeout=12000
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );


  return fetch(
    url,
    {
      ...options,
      signal:controller.signal,
      cache:'no-store'
    }
  ).finally(
    () => clearTimeout(timer)
  );

}



/* =========================================================
   LOAD CAPTCHA
========================================================= */

async function loadCaptcha(){

  const img =
    document.getElementById(
      'captchaImg'
    );

  const reload =
    document.getElementById(
      'reloadCaptcha'
    );


  const requestId =
    ++captchaRequestId;


  img.classList.remove(
    'loaded'
  );

  img.removeAttribute(
    'src'
  );


  currentCookie='';


  reload.disabled=true;


  for(
    let attempt=1;
    attempt<=3;
    attempt++
  ){

    if(
      requestId !==
      captchaRequestId
    ){
      return false;
    }


    try{

      const res =
        await fetchWithTimeout(
          '/api/proxy?action=get-captcha&_=' +
          Date.now(),
          {},
          10000
        );


      const data =
        await res.json();


      if(
        requestId !==
        captchaRequestId
      ){
        return false;
      }


      if(data?.captchaUrl){

        const src =
          String(
            data.captchaUrl
          );


        await new Promise(
          (resolve,reject) => {

            const test =
              new Image();


            test.onload =
              () => resolve();


            test.onerror =
              () =>
                reject(
                  new Error(
                    'captcha image error'
                  )
                );


            test.src=src;

          }
        );


        if(
          requestId !==
          captchaRequestId
        ){
          return false;
        }


        img.src=src;

        img.classList.add(
          'loaded'
        );


        currentCookie =
          data.cookie || '';


        reload.disabled=false;


        return true;

      }

    }catch(e){

    }


    if(attempt < 3){

      await new Promise(
        r => setTimeout(
          r,
          500
        )
      );

    }

  }


  reload.disabled=false;

  return false;

}



/* =========================================================
   SUBMIT TRACKING
========================================================= */

async function submitTracking(){

  const code =
    document
      .getElementById(
        'trackingCode'
      )
      .value
      .trim();


  const captcha =
    document
      .getElementById(
        'captchaText'
      )
      .value
      .trim();


  const btn =
    document.getElementById(
      'btnSubmit'
    );


  if(!code || !captcha){

    showMsg(
      'Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.'
    );

    return;

  }


  if(!currentCookie){

    showMsg(
      'CAPTCHA chưa sẵn sàng. Vui lòng chờ CAPTCHA hiện ra rồi thử lại.',
      'wait'
    );

    return;

  }


  btn.disabled=true;

  btn.textContent =
    '⏳ Đang tra cứu...';


  showMsg(
    'Đang kết nối hệ thống VNPost, vui lòng chờ...',
    'wait'
  );


  try{

    const res =
      await fetchWithTimeout(
        '/api/proxy?action=track',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            trackingCode:code,

            captchaText:captcha,

            cookie:currentCookie

          })

        },
        30000
      );


    let data=null;


    try{

      data =
        await res.json();

    }catch(_){

      throw new Error(
        'Máy chủ trả về dữ liệu không hợp lệ.'
      );

    }


    if(
      data?.info?.ID
    ){

      currentTrackingCode =
        data.info.ID;

      currentData =
        data;


      renderScreen(data);

      renderPrint(data);


      document
        .getElementById(
          'result-card'
        )
        .style.display='block';


      document
        .getElementById(
          'result'
        )
        .style.display='flex';


      showMsg(
        'Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.',
        'ok'
      );


      document
        .getElementById(
          'result-card'
        )
        .scrollIntoView({
          behavior:'smooth',
          block:'start'
        });

    }else{

      showMsg(
        data?.message ||
        'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.'
      );


      document
        .getElementById(
          'captchaText'
        )
        .value='';


      await loadCaptcha();

    }

  }catch(e){

    if(
      e?.name ===
      'AbortError'
    ){

      showMsg(
        'Tra cứu mất quá nhiều thời gian. Vui lòng thử lại sau vài giây.'
      );

    }else{

      showMsg(
        'Lỗi tra cứu: ' +
        (
          e?.message ||
          'Không xác định'
        )
      );

    }

  }finally{

    btn.disabled=false;

    btn.textContent =
      '🔎 TRA CỨU VẬN ĐƠN';

  }

}

/* =========================================================
   MAP
========================================================= */

function openMap(
  address,
  title,
  coords
){

  const panel =
    document.getElementById(
      'map-panel'
    );


  panel.classList.add(
    'show'
  );


  document
    .getElementById(
      'map-title'
    )
    .textContent =
      title +
      ' — ' +
      address;


  const q =
    coords
      ? `${coords.lat},${coords.lng}`
      : address;


  const maps =
    'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(q);


  document
    .getElementById(
      'map-link'
    )
    .href =
      maps;


  document
    .getElementById(
      'map-frame'
    )
    .src =
      'https://www.google.com/maps?q=' +
      encodeURIComponent(q) +
      '&output=embed';


  panel.scrollIntoView({
    behavior:'smooth',
    block:'nearest'
  });

}

/* =========================================================

                      <span>Bưu cục gửi:</span>

                      locate.length-1
                        ? 'latest'
                        : ''
                    }
                  "
                >

                  <div class="p-time">

                    ${esc(
                      (item.Date || '') +
                      ' ' +
                      (item.TimeDetail || '')
                    )}

                  </div>


                  <div class="p-status">

                    ${esc(
                      cleanStatus(
                        item.StatusText
                      )
                    )}

                  </div>


                  <div class="p-meta">

                    Bưu cục:

                    <b>
                      ${esc(
                        getOffice(item).full
                      )}
                    </b>

                  </div>


                  <div class="p-address">

                    ${esc(
                      getAddress(item)
                    )}

                  </div>

                </div>

                `
              ).join('')
            }


          </div>



          ${
            p === pages.length - 1

              ? `

              <div class="print-delivery">

                <h4>
                  THÔNG TIN PHÁT
                </h4>


                <table>

                  <thead>

                    <tr>

                      <th>
                        Ngày
                      </th>

                      <th>
                        Bưu cục / Bưu tá
                      </th>

                      <th>
                        Chi tiết
                      </th>

                    </tr>

                  </thead>


                  <tbody>


                    ${
                      delivery.map(
                        d => {

                          const o =
                            getOfficeForDelivery(
                              data,
                              d
                            );


                          const pi =
                            getDeliveryPerson({
                              delivery:[d]
                            });


                          const postmanText =
                            pi.name !== '-'
                              ? pi.name + (pi.phone !== '-' ? ' - ' + pi.phone : '')
                              : '';


                          return `

                          <tr>

                            <td>

                              ${esc(
                                getDeliveryTime(d)
                              )}

                            </td>


                            <td>

                              <b>${esc(o.full)}</b>

                              ${
                                postmanText
                                  ? `<br><span style="color:#666;">Bưu tá: ${esc(postmanText)}</span>`
                                  : ''
                              }

                            </td>


                            <td>

                              ${esc(
                                d.STATUSTEXT ||
                                d.StatusText ||
                                '-'
                              )}

                            </td>

                          </tr>

                          `;

                        }
                      ).join('')
                    }


                  </tbody>

                </table>

              </div>

              `

              : ''

          }



          <div class="print-footer">

            Dữ liệu được truy xuất từ hệ thống VNPost
            qua cổng kết nối InVanDon247

            • Trang
            ${p+1}/${pages.length}

          </div>


        </div>

        `;

      }
    ).join('');

}

function printA4(){

    );

    return;

  }


  window.print();

}



/* =========================================================
   DOWNLOAD PDF
========================================================= */

async function downloadPDF(){

  if(!currentData){

    alert(
      'Vui lòng tra cứu vận đơn trước.'
    );

    return;

  }


  if(
    typeof html2pdf ===
    'undefined'
  ){

    alert(
      'Thư viện tạo PDF chưa tải xong. Vui lòng thử lại.'
    );

    return;

  }


  const el =
    document.getElementById(
      'print-area'
    );


  const old =
    el.style.display;


  el.style.display='block';


  try{

    const opt={

      margin:0,

      filename:
        `VanDon_VNPost_${
          currentTrackingCode ||
          '247'
        }.pdf`,

      image:{
        type:'jpeg',
        quality:.78
      },

      html2canvas:{
        scale:1.25,
        useCORS:true,
        backgroundColor:'#fff',
        logging:false
      },

      jsPDF:{
        unit:'mm',
        format:'a4',
        orientation:'portrait'
      },

      pagebreak:{
        mode:[
          'css',
          'legacy'
        ],
        avoid:[
          '.p-event'
        ]
      }

    };


    await html2pdf()
      .set(opt)
      .from(el)
      .save();


  }finally{

    el.style.display =
      old;

  }

}

   ENTER KEY
========================================================= */

document
  .getElementById(
    'trackingCode'
  )
  .addEventListener(
    'keydown',
    e => {

      if(e.key === 'Enter'){

        document
          .getElementById(
            'captchaText'
          )
          .focus();

      }

    }
  );


document
  .getElementById(
    'captchaText'
  )
  .addEventListener(
    'keydown',
    e => {

      if(e.key === 'Enter'){

        submitTracking();

      }

    }
  );



/* =========================================================
   LOAD CAPTCHA WHEN PAGE LOADS
========================================================= */

window.addEventListener(
  'load',
  () => {

    loadCaptcha();

  }
);
