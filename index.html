<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tra cứu bưu gửi VNPost</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f7fb;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .search-box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .search-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
            height: 46px;
            border: 1px solid #d8dde7;
            border-radius: 6px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
        }

        .search-row input:focus {
            border-color: #5267ff;
        }

        .search-row button {
            width: 130px;
            border: none;
            border-radius: 6px;
            background: #5267ff;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-row button:hover {
            background: #4055e6;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 25px;
            color: #666;
        }

        .error {
            display: none;
            background: #fff0f0;
            color: #c62828;
            border: 1px solid #ffcaca;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .result {
            display: none;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8ebf0;
            font-size: 17px;
            font-weight: 700;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
        }

        .summary-item {
            padding: 18px 20px;
            border-right: 1px solid #e8ebf0;
        }

        .summary-item:last-child {
            border-right: none;
        }

        .summary-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .delivered {
            color: #009b55;
        }

        /* TIMELINE */

        .timeline {
            padding: 10px 20px 20px 20px;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 130px 20px 1fr 300px 30px;
            gap: 12px;
            min-height: 80px;
            position: relative;
            align-items: start;
        }

        .timeline-time {
            font-size: 12px;
            color: #555;
            padding-top: 5px;
            text-align: right;
            white-space: nowrap;
        }

        .timeline-line {
            position: relative;
            min-height: 80px;
        }

        .timeline-dot {
            width: 13px;
            height: 13px;
            border: 2px solid #9aa1ad;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 5px;
            left: 2px;
            z-index: 2;
        }

        .timeline-item:not(:last-child) .timeline-line::after {
            content: "";
            position: absolute;
            width: 2px;
            background: #dfe3ea;
            top: 18px;
            bottom: -15px;
            left: 7px;
        }

        .timeline-item.is-final .timeline-dot {
            border-color: #00a65a;
            background: #00a65a;
        }

        .timeline-content {
            padding-bottom: 18px;
        }

        .timeline-status {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 5px;
        }

        .timeline-status.final {
            color: #009b55;
            font-weight: 700;
        }

        .timeline-code {
            color: #777;
            font-size: 12px;
        }

        .timeline-location {
            color: #555;
            font-size: 12px;
            line-height: 1.5;
            padding-top: 5px;
        }

        .timeline-arrow {
            color: #5865f2;
            font-size: 24px;
            padding-top: 0;
        }

        /* DELIVERY INFO */

        .delivery-wrapper {
            padding: 0 10px 10px 10px;
            overflow-x: auto;
        }

        .delivery-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        .delivery-table th {
            background: #edf2f6;
            text-align: left;
            padding: 12px 10px;
            font-size: 12px;
            color: #555;
            border: 1px solid #dce2e8;
        }

        .delivery-table td {
            padding: 13px 10px;
            border: 1px solid #dce2e8;
            vertical-align: top;
            font-size: 13px;
        }

        .post-office-name {
            color: #0645ad;
            font-weight: 700;
        }

        .post-office-code {
            margin-top: 4px;
            font-size: 12px;
            color: #444;
        }

        .postman {
            color: #0645ad;
            font-weight: 600;
        }

        .phone {
            margin-top: 6px;
            display: inline-block;
            color: #0645ad;
            text-decoration: none;
            font-size: 12px;
        }

        .phone:hover {
            text-decoration: underline;
        }

        .detail {
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 11px;
            padding: 0 0 15px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        @media (max-width: 900px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary-item {
                border-bottom: 1px solid #e8ebf0;
            }

            .timeline-item {
                grid-template-columns: 90px 20px 1fr;
            }

            .timeline-location,
            .timeline-arrow {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 97%;
                margin: 15px auto;
            }

            .search-row {
                flex-direction: column;
            }

            .search-row button {
                width: 100%;
                height: 44px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .summary-item {
                border-right: none;
            }

            .timeline-item {
                grid-template-columns: 80px 18px 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SEARCH -->
    <div class="search-box">
        <div class="search-title">
            Tra cứu bưu gửi VNPost
        </div>

        <div class="search-row">
            <input
                type="text"
                id="trackingInput"
                placeholder="Nhập mã bưu gửi, ví dụ: RB609915722VN"
                autocomplete="off"
            >

            <button onclick="trackShipment()">
                Tra cứu
            </button>
        </div>
    </div>

    <!-- ERROR -->
    <div id="errorBox" class="error"></div>

    <!-- LOADING -->
    <div id="loading" class="loading">
        Đang tra cứu, vui lòng chờ...
    </div>

    <!-- RESULT -->
    <div id="result" class="result">

        <!-- SUMMARY -->
        <div class="card">
            <div class="card-header">
                Thông tin bưu gửi
            </div>

            <div class="summary">

                <div class="summary-item">
                    <div class="summary-label">
                        Mã bưu gửi
                    </div>

                    <div class="summary-value" id="summaryId">
                        -
                    </div>
                </div>

                <div class="summary-item">
                    <div class="summary-label">
                        Khối lượng
                    </div>

                    <div class="summary-value" id="summaryWeight">
                        -
                    </div>
                </div>

                <div class="summary-item">
                    <div class="summary-label">
                        Bưu cục gửi
                    </div>

                    <div class="summary-value" id="summaryFrom">
                        -
                    </div>
                </div>

                <div class="summary-item">
                    <div class="summary-label">
                        Trạng thái
                    </div>

                    <div class="summary-value" id="summaryStatus">
                        -
                    </div>
                </div>

            </div>
        </div>


        <!-- TIMELINE -->
        <div class="card">

            <div class="card-header">
                Hành trình bưu gửi
            </div>

            <div id="timeline" class="timeline"></div>

        </div>


        <!-- DELIVERY -->
        <div class="card">

            <div class="card-header">
                THÔNG TIN PHÁT
            </div>

            <div class="delivery-wrapper">

                <table class="delivery-table">

                    <thead>
                        <tr>
                            <th style="width: 18%;">
                                Ngày
                            </th>

                            <th style="width: 25%;">
                                Bưu cục
                            </th>

                            <th style="width: 20%;">
                                Bưu tá
                            </th>

                            <th>
                                Chi tiết
                            </th>
                        </tr>
                    </thead>

                    <tbody id="deliveryBody"></tbody>

                </table>

            </div>

            <div class="footer">
                Dữ liệu được trích xuất từ hệ thống VNPost qua cổng kết nối Invandon247
            </div>

        </div>

    </div>

</div>


<script>

/*
==========================================================
 CẤU HÌNH API
==========================================================

 QUAN TRỌNG:

 Thay URL dưới đây bằng API endpoint mà index cũ
 của bạn đang sử dụng.

 Ví dụ:

 const API_URL = "/api/track?code=";

 hoặc:

 const API_URL = "https://invandon247.com/api/track?code=";

 Nếu API hiện tại của bạn trả thẳng JSON mà bạn đã gửi
 trong tin nhắn thì phần xử lý bên dưới đã tương thích.
==========================================================
*/

const API_URL = "/api/track?code=";


/*
==========================================================
 TIỆN ÍCH
==========================================================
*/

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
==========================================================
 FORMAT NGÀY GIỜ
==========================================================
*/

function formatDateTime(value) {

    if (!value) {
        return "-";
    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
        return String(value);
    }

    const day = String(d.getDate()).padStart(2, "0");
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const year = d.getFullYear();

    const hour = String(d.getHours()).padStart(2, "0");
    const minute = String(d.getMinutes()).padStart(2, "0");
    const second = String(d.getSeconds()).padStart(2, "0");

    return `${day}/${month}/${year} ${hour}:${minute}:${second}`;
}


/*
==========================================================
 LẤY NGÀY TỪ DELIVERY
==========================================================
*/

function getDeliveryDate(item) {

    if (!item) {
        return null;
    }

    /*
     Ưu tiên NGAY_NHAP vì đây là thời điểm hệ thống
     ghi nhận kết quả phát.

     Tuy nhiên phần "THÔNG TIN PHÁT" có thể hiển thị
     NGAY_PHAT nếu cần nghiệp vụ.
    */

    return item.NGAY_NHAP ||
           item.NGAY_PHAT ||
           null;
}


/*
==========================================================
 TÌM EVENT PHÁT THÀNH CÔNG
==========================================================

 Đây là phần quan trọng nhất.

 Không dùng:

 info.BC_PHAT

 Không dùng:

 delivery.NGAY_PHAT

 để xác định thời điểm cuối cùng.

 Phải tìm KT5 trong locate.
==========================================================
*/

function findFinalDeliveryEvent(data) {

    if (!data || !Array.isArray(data.locate)) {
        return null;
    }

    const events = data.locate.filter(item => {

        if (!item) {
            return false;
        }

        return String(item.Status || "").toUpperCase() === "KT5";

    });

    if (events.length === 0) {
        return null;
    }

    /*
     Nếu có nhiều KT5 thì lấy KT5 có TraceDate mới nhất.
    */

    events.sort((a, b) => {

        const da = new Date(a.TraceDate || 0).getTime();
        const db = new Date(b.TraceDate || 0).getTime();

        return db - da;

    });

    return events[0];
}


/*
==========================================================
 TÌM EVENT CUỐI CÙNG
==========================================================
*/

function findLatestEvent(data) {

    if (!data || !Array.isArray(data.locate)) {
        return null;
    }

    const events = [...data.locate];

    events.sort((a, b) => {

        const da = new Date(a.TraceDate || 0).getTime();
        const db = new Date(b.TraceDate || 0).getTime();

        return db - da;

    });

    return events[0] || null;
}


/*
==========================================================
 TÌM DELIVERY PHÙ HỢP VỚI POSCODE
==========================================================

 API hiện tại:

 locate:
 POSCode = 823960

 delivery:
 ToPOSCode = 823960

 Do đó phải ghép hai dữ liệu này.
==========================================================
*/

function findDeliveryByPostOffice(data, posCode) {

    if (!data || !Array.isArray(data.delivery)) {
        return null;
    }

    if (!posCode) {
        return data.delivery[data.delivery.length - 1] || null;
    }

    const code = String(posCode);

    /*
     Ưu tiên ToPOSCode.
    */

    const matched = data.delivery.filter(item => {

        return item &&
               String(item.ToPOSCode || "") === code;

    });

    if (matched.length > 0) {

        /*
         Lấy bản ghi mới nhất.
        */

        matched.sort((a, b) => {

            const da = new Date(
                a.NGAY_NHAP ||
                a.NGAY_PHAT ||
                0
            ).getTime();

            const db = new Date(
                b.NGAY_NHAP ||
                b.NGAY_PHAT ||
                0
            ).getTime();

            return db - da;

        });

        return matched[0];
    }


    /*
     Nếu không có ToPOSCode thì thử VI_TRI.
    */

    const fallback = data.delivery.filter(item => {

        return item &&
               String(item.VI_TRI || "").includes(code);

    });

    return fallback[0] || null;
}


/*
==========================================================
 PARSE TÊN BƯU TÁ + SỐ ĐIỆN THOẠI
==========================================================

 Ví dụ:

 Lái Thiêu_01 / ĐẶNG VŨ BÌNH DU.ĐT B.Tá:0898688486

 Kết quả:

 tên:
 ĐẶNG VŨ BÌNH DU

 phone:
 0898688486
==========================================================
*/

function parsePostman(text) {

    const result = {
        name: "",
        phone: "",
        route: ""
    };

    if (!text) {
        return result;
    }

    let raw = String(text).trim();

    /*
     Tìm điện thoại sau "ĐT B.Tá:"
    */

    const phoneMatch = raw.match(
        /ĐT\s*B\.?\s*T[aá]\s*:\s*([0-9]{8,12})/i
    );

    if (phoneMatch) {

        result.phone = phoneMatch[1];

        raw = raw.replace(phoneMatch[0], "");
    }


    /*
     Có trường hợp dữ liệu không có dấu tiếng Việt
     hoặc API thay đổi cách ghi.
    */

    if (!result.phone) {

        const genericPhone = String(text).match(
            /(?:ĐT|DT)[^0-9]{0,15}([0-9]{8,12})/i
        );

        if (genericPhone) {
            result.phone = genericPhone[1];
        }
    }


    /*
     Tách tuyến/bộ phận trước dấu /
    */

    const slashIndex = raw.indexOf("/");

    if (slashIndex >= 0) {

        result.route = raw
            .substring(0, slashIndex)
            .trim();

        raw = raw
            .substring(slashIndex + 1)
            .trim();

    }


    /*
     Xóa các ký hiệu thừa.
    */

    raw = raw
        .replace(/\s+/g, " ")
        .replace(/\.$/, "")
        .trim();


    /*
     Tên bưu tá.
    */

    result.name = raw;

    return result;
}


/*
==========================================================
 LẤY TÊN BƯU CỤC
==========================================================
*/

function getPostOfficeName(event) {

    if (!event) {
        return "-";
    }

    /*
     StatusText thường có:

     (823960: BCP Thuận An - Hồ Chí Minh)
    */

    const text = String(event.StatusText || "");

    const match = text.match(
        /\((\d+)\s*:\s*([^)]+)\)/
    );

    if (match) {

        const code = match[1];
        const name = match[2].trim();

        return {
            code: code,
            name: name
        };
    }


    /*
     Fallback.
    */

    return {
        code: event.POSCode || "",
        name: event.POSCode || "-"
    };
}


/*
==========================================================
 LẤY THÔNG TIN NGƯỜI NHẬN
==========================================================
*/

function getReceiver(text) {

    if (!text) {
        return "";
    }

    const match = String(text).match(
        /Người\s*nhận\s*:\s*\(?\s*([^)\n]*)/i
    );

    if (match) {
        return match[1].trim();
    }

    return "";
}


/*
==========================================================
 HIỂN THỊ SUMMARY
==========================================================
*/

function renderSummary(data) {

    const info = data.info || {};

    document.getElementById("summaryId").textContent =
        info.ID || "-";

    document.getElementById("summaryWeight").textContent =
        info.Weight
            ? info.Weight + " g"
            : "-";

    document.getElementById("summaryFrom").textContent =
        info.BC_GUI || "-";


    const finalEvent = findFinalDeliveryEvent(data);
    const latestEvent = findLatestEvent(data);

    const statusEvent = finalEvent || latestEvent;

    let statusText = "-";

    if (statusEvent) {

        statusText =
            String(statusEvent.StatusText || "")
                .replace(/\([^)]*\)/g, "")
                .trim();

    }

    const statusEl =
        document.getElementById("summaryStatus");

    statusEl.textContent = statusText;

    if (
        finalEvent &&
        String(finalEvent.Status).toUpperCase() === "KT5"
    ) {

        statusEl.classList.add("delivered");

    } else {

        statusEl.classList.remove("delivered");
    }
}


/*
==========================================================
 RENDER TIMELINE
==========================================================
*/

function renderTimeline(data) {

    const container =
        document.getElementById("timeline");

    container.innerHTML = "";

    if (
        !data ||
        !Array.isArray(data.locate) ||
        data.locate.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">Không có dữ liệu hành trình.</div>';

        return;
    }


    /*
     Giữ đúng thứ tự API trả về.
    */

    const events = [...data.locate];


    /*
     Tìm event phát cuối cùng.
    */

    const finalEvent =
        findFinalDeliveryEvent(data);

    /*
     Nếu API có nhiều event KT5, đánh dấu event
     KT5 mới nhất.
    */

    events.forEach((event, index) => {

        const isFinal =
            finalEvent &&
            event === finalEvent;


        const div =
            document.createElement("div");

        div.className =
            "timeline-item" +
            (isFinal ? " is-final" : "");


        const time =
            formatDateTime(event.TraceDate);


        const statusText =
            event.StatusText || "-";


        const code =
            event.POSCode || "";


        const location =
            event.VI_TRI || "";


        div.innerHTML = `

            <div class="timeline-time">
                ${escapeHtml(time)}
            </div>

            <div class="timeline-line">
                <div class="timeline-dot"></div>
            </div>

            <div class="timeline-content">

                <div class="timeline-status ${isFinal ? "final" : ""}">
                    ${escapeHtml(statusText)}
                </div>

                ${
                    code
                    ? `
                        <div class="timeline-code">
                            Mã bưu cục: ${escapeHtml(code)}
                        </div>
                      `
                    : ""
                }

            </div>

            <div class="timeline-location">
                ${escapeHtml(location)}
            </div>

            <div class="timeline-arrow">
                ➤
            </div>

        `;

        container.appendChild(div);

    });
}


/*
==========================================================
 RENDER THÔNG TIN PHÁT
==========================================================
*/

function renderDelivery(data) {

    const tbody =
        document.getElementById("deliveryBody");

    tbody.innerHTML = "";


    if (
        !data ||
        !Array.isArray(data.delivery) ||
        data.delivery.length === 0
    ) {

        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    Không có thông tin phát.
                </td>
            </tr>
        `;

        return;
    }


    /*
     QUAN TRỌNG:

     Không lấy delivery cuối cùng một cách mù quáng.

     Phải lấy KT5 -> POSCode -> delivery.
    */

    const finalEvent =
        findFinalDeliveryEvent(data);


    let deliveryItem = null;


    if (finalEvent) {

        deliveryItem =
            findDeliveryByPostOffice(
                data,
                finalEvent.POSCode
            );

    }


    /*
     Nếu không có KT5 thì fallback delivery mới nhất.
    */

    if (!deliveryItem) {

        const list =
            [...data.delivery];

        list.sort((a, b) => {

            const da =
                new Date(
                    a.NGAY_NHAP ||
                    a.NGAY_PHAT ||
                    0
                ).getTime();

            const db =
                new Date(
                    b.NGAY_NHAP ||
                    b.NGAY_PHAT ||
                    0
                ).getTime();

            return db - da;

        });

        deliveryItem = list[0];

    }


    /*
     Nếu vẫn không có.
    */

    if (!deliveryItem) {

        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    Không có thông tin phát.
                </td>
            </tr>
        `;

        return;
    }


    /*
     Xác định POSCode.

     Ưu tiên KT5.
    */

    const posCode =
        finalEvent?.POSCode ||
        deliveryItem.ToPOSCode ||
        "";


    /*
     Lấy tên bưu cục từ KT5.
    */

    let postOffice = null;


    if (finalEvent) {

        postOffice =
            getPostOfficeName(finalEvent);

    }


    /*
     Fallback.
    */

    if (!postOffice) {

        postOffice = {
            code: deliveryItem.ToPOSCode || "",
            name: deliveryItem.VI_TRI || "-"
        };

    }


    /*
     Nếu getPostOfficeName trả tên kiểu:

     "BCP Thuận An - Hồ Chí Minh"

     thì vẫn giữ nguyên.

     Không dùng info.BC_PHAT.
    */


    /*
     BƯU TÁ
    */

    const postman =
        parsePostman(
            deliveryItem.NGAY_CN
        );


    /*
     NGƯỜI NHẬN
    */

    const receiver =
        getReceiver(
            deliveryItem.STATUSTEXT
        );


    /*
     THỜI GIAN:

     Nếu có KT5:
     lấy TraceDate của KT5.

     Đây là điểm đã sửa lỗi trước.
    */

    let finalDate = null;

    if (finalEvent) {

        finalDate =
            finalEvent.TraceDate;

    } else {

        finalDate =
            getDeliveryDate(deliveryItem);

    }


    /*
     Chi tiết.
    */

    let detail =
        deliveryItem.STATUSTEXT || "";


    /*
     Nếu có người nhận mà STATUSTEXT đã có,
     giữ nguyên nội dung API.
    */

    const tr =
        document.createElement("tr");


    tr.innerHTML = `

        <td>
            ${escapeHtml(
                formatDateTime(finalDate)
            )}
        </td>


        <td>

            <div class="post-office-name">
                ${escapeHtml(
                    postOffice.name
                )}
            </div>

            <div class="post-office-code">
                ${escapeHtml(
                    posCode
                        ? "Mã bưu cục: " + posCode
                        : ""
                )}
            </div>

        </td>


        <td>

            ${
                postman.name
                ? `
                    <div class="postman">
                        ${escapeHtml(postman.name)}
                    </div>
                  `
                : `
                    <div>
                        -
                    </div>
                  `
            }


            ${
                postman.phone
                ? `
                    <a
                        class="phone"
                        href="tel:${escapeHtml(postman.phone)}"
                    >
                        ☎ ${escapeHtml(postman.phone)}
                    </a>
                  `
                : ""
            }

        </td>


        <td>

            <div class="detail">
                ${escapeHtml(detail)}
            </div>

            ${
                receiver
                ? `
                    <div style="margin-top:5px;">
                        <strong>Người nhận:</strong>
                        ${escapeHtml(receiver)}
                    </div>
                  `
                : ""
            }

        </td>

    `;


    tbody.appendChild(tr);
}


/*
==========================================================
 RENDER TOÀN BỘ
==========================================================
*/

function renderResult(data) {

    if (!data) {
        throw new Error("API không trả về dữ liệu.");
    }

    renderSummary(data);

    renderTimeline(data);

    renderDelivery(data);

    document.getElementById("result").style.display =
        "block";
}


/*
==========================================================
 TRA CỨU API
==========================================================
*/

async function trackShipment() {

    const input =
        document.getElementById("trackingInput");

    const code =
        input.value.trim();


    if (!code) {

        showError(
            "Vui lòng nhập mã bưu gửi."
        );

        return;
    }


    hideError();

    document.getElementById("result").style.display =
        "none";

    document.getElementById("loading").style.display =
        "block";


    try {

        const url =
            API_URL +
            encodeURIComponent(code);


        const response =
            await fetch(url, {

                method: "GET",

                headers: {
                    "Accept": "application/json"
                }

            });


        if (!response.ok) {

            throw new Error(
                "API trả về HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         Kiểm tra dữ liệu.
        */

        if (
            !data ||
            (
                !data.info &&
                !data.locate &&
                !data.delivery
            )
        ) {

            throw new Error(
                "Dữ liệu API không đúng định dạng."
            );

        }


        renderResult(data);


    } catch (error) {

        console.error(
            "TRACK ERROR:",
            error
        );


        showError(
            "Không thể tra cứu bưu gửi. " +
            error.message
        );


    } finally {

        document.getElementById("loading").style.display =
            "none";

    }
}


/*
==========================================================
 ERROR
==========================================================
*/

function showError(message) {

    const box =
        document.getElementById("errorBox");

    box.textContent =
        message;

    box.style.display =
        "block";
}


function hideError() {

    document.getElementById("errorBox").style.display =
        "none";
}


/*
==========================================================
 ENTER ĐỂ TRA CỨU
==========================================================
*/

document
    .getElementById("trackingInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                trackShipment();

            }

        }
    );


/*
==========================================================
 TEST VỚI JSON BẠN ĐÃ GỬI
==========================================================

 Bạn có thể mở Console và chạy:

 testTracking(YOUR_JSON)

 để kiểm tra giao diện mà không cần API.
==========================================================
*/

window.testTracking = function(data) {

    hideError();

    document.getElementById("loading").style.display =
        "none";

    renderResult(data);

};

</script>
