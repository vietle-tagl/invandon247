<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247 - Tra Cứu & In Phiếu VNPost A4</title>
    <style>
        /* GIAO DIỆN TRÊN WEB */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .web-container { max-width: 480px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #0056b3; margin-top: 0; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: bold; color: #495057; display: block; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; outline: none; }
        input[type="text"]:focus { border-color: #0056b3; }
        .captcha-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .captcha-box { height: 42px; border: 1px solid #ced4da; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; min-width: 140px; overflow: hidden; }
        .captcha-box img { height: 100%; width: auto; object-fit: contain; }
        .btn-reload { background: #6c757d; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-submit { background-color: #0056b3; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background-color: #004085; }

        /* GIAO DIỆN PHIẾU IN A4 */
        #print-area { display: none; background: #fff; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; }
            @page { size: A4 portrait; margin: 10mm 12mm; }
            body { background: #fff; padding: 0; margin: 0; font-size: 9.5pt; color: #1a202c; }
            
            .header-table { width: 100%; border-collapse: collapse; border-bottom: 2px solid #0056b3; padding-bottom: 8px; margin-bottom: 12px; }
            .brand-title { font-size: 16pt; font-weight: bold; color: #0056b3; margin: 0; }
            .brand-subtitle { font-size: 8pt; color: #4a5568; margin-top: 2px; }
            .header-meta { text-align: right; font-size: 8pt; color: #718096; }

            .doc-title-box { text-align: center; background-color: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; margin-bottom: 12px; }
            .doc-title { font-size: 12pt; font-weight: bold; color: #2d3748; text-transform: uppercase; margin: 0; }
            .tracking-number { font-size: 14pt; font-weight: bold; color: #d69e2e; letter-spacing: 1px; margin-top: 2px; }

            .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
            .card { border: 1px solid #cbd5e0; border-radius: 5px; padding: 8px 10px; }
            .card-header { font-size: 8.5pt; font-weight: bold; color: #0056b3; text-transform: uppercase; border-bottom: 1px dashed #cbd5e0; padding-bottom: 4px; margin-bottom: 6px; }
            .data-row { margin-bottom: 4px; font-size: 9pt; }
            .label { color: #718096; font-size: 8pt; display: inline-block; width: 85px; }
            .value { color: #2d3748; font-weight: bold; }
            .status-badge { display: inline-block; background-color: #c6f6d5; color: #22543d; font-size: 8.5pt; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

            .section-heading { font-size: 9.5pt; font-weight: bold; color: #2d3748; margin-bottom: 6px; padding-left: 6px; border-left: 3px solid #0056b3; }
            .history-table { width: 100%; border-collapse: collapse; font-size: 8pt; }
            .history-table th { background-color: #ebf8ff; color: #2c5282; text-align: left; padding: 5px 6px; font-weight: bold; border-top: 1px solid #bee3f8; border-bottom: 2px solid #90cdf4; }
            .history-table td { padding: 5px 6px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
            .history-table tr:nth-child(even) { background-color: #f7fafc; }
            .history-table tr.latest-status { background-color: #f0fff4; font-weight: bold; color: #22543d; }
            
            .footer { margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 6px; text-align: center; font-size: 7.5pt; color: #a0aec0; }
        }
    </style>
</head>
<body>

    <!-- KHU VỰC TRANG WEB -->
    <div class="web-container no-print">
        <h2>InVanDon247 - Tra Cứu VNPost</h2>
        
        <div class="form-group">
            <label>1. Mã vận đơn VNPost:</label>
            <input type="text" id="trackingCode" placeholder="Ví dụ: RB608631891VN" value="RB608631891VN">
        </div>

        <div class="form-group">
            <label>2. Mã xác thực (CAPTCHA):</label>
            <input type="text" id="captchaText" placeholder="Nhập chữ trong hình dưới">
            <div class="captcha-row">
                <div class="captcha-box">
                    <img id="captchaImg" src="" alt="Đang tải...">
                </div>
                <button class="btn-reload" onclick="loadCaptcha()">🔄 Đổi mã</button>
            </div>
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="submitTracking()">🚀 Tra Cứu & In A4 Ngay</button>
    </div>

    <!-- KHU VỰC HIỂN THỊ PHIẾU IN A4 -->
    <div id="print-area"></div>

    <script>
        let currentCookie = '';

        // 1. Tải CAPTCHA từ Proxy Vercel
        async function loadCaptcha() {
            const img = document.getElementById('captchaImg');
            img.src = '';
            img.alt = "Đang tải...";

            try {
                const res = await fetch('/api/proxy?action=get-captcha');
                const data = await res.json();
                
                if (data.captchaUrl) {
                    img.src = data.captchaUrl;
                    currentCookie = data.cookie || '';
                } else {
                    img.alt = "Lỗi tải CAPTCHA";
                }
            } catch (e) {
                img.alt = "Lỗi kết nối";
            }
        }

        // 2. Tra cứu dữ liệu từ Proxy
        async function submitTracking() {
            const code = document.getElementById('trackingCode').value.trim();
            const captcha = document.getElementById('captchaText').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!code || !captcha) {
                alert('Vui lòng nhập đầy đủ Mã vận đơn và CAPTCHA!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Đang tra cứu dữ liệu...";

            try {
                const res = await fetch('/api/proxy?action=track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        trackingCode: code,
                        captchaText: captcha,
                        cookie: currentCookie
                    })
                });

                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "🚀 Tra Cứu & In A4 Ngay";

                // Kiểm tra xem phản hồi có hợp lệ không
                if (data && data.info && data.info.ID) {
                    renderA4Form(data);
                    window.print(); // Mở cửa sổ in ấn A4 lập tức
                } else {
                    alert('Mã CAPTCHA không đúng hoặc không tìm thấy dữ liệu vận đơn. Vui lòng thử lại!');
                    document.getElementById('captchaText').value = '';
                    loadCaptcha();
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "🚀 Tra Cứu & In A4 Ngay";
                alert('Lỗi tra cứu: ' + e.message);
            }
        }

        // 3. Đổ dữ liệu JSON vào Template A4 chuẩn
        function renderA4Form(data) {
            const info = data.info || {};
            const locate = data.locate || [];
            const delivery = (data.delivery && data.delivery.length > 0) ? data.delivery[0] : null;

            // Xác định trạng thái phát thành công
            let statusBadge = "ĐANG VẬN CHUYỂN";
            if (delivery && delivery.STATUSTEXT) {
                statusBadge = delivery.STATUSTEXT;
            } else if (locate.length > 0) {
                statusBadge = locate[locate.length - 1].StatusText;
            }

            // Sắp xếp lịch sử mới nhất lên đầu
            const sortedLocate = [...locate].reverse();

            const html = `
                <table class="header-table">
                    <tr>
                        <td>
                            <div class="brand-title">InVanDon247</div>
                            <div class="brand-subtitle">Hệ thống chuyển đổi & In phiếu bưu gửi A4 tự động</div>
                        </td>
                        <td class="header-meta">
                            <div>Ngày in: ${new Date().toLocaleString('vi-VN')}</div>
                            <div>Đơn vị: <strong>VNPOST (Bưu điện Việt Nam)</strong></div>
                        </td>
                    </tr>
                </table>

                <div class="doc-title-box">
                    <div class="doc-title">XÁC NHẬN HÀNH TRÌNH BƯU GỬI</div>
                    <div class="tracking-number">${info.ID || ''}</div>
                </div>

                <div class="info-grid">
                    <div class="card">
                        <div class="card-header">Thông tin tổng quan</div>
                        <div class="data-row"><span class="label">Mã bưu gửi:</span> <span class="value">${info.ID || '-'}</span></div>
                        <div class="data-row"><span class="label">Khối lượng:</span> <span class="value">${info.Weight || '0'} g</span></div>
                        <div class="data-row"><span class="label">Trạng thái:</span> <span class="status-badge">${statusBadge}</span></div>
                    </div>
                    <div class="card">
                        <div class="card-header">Tuyến vận chuyển</div>
                        <div class="data-row"><span class="label">Bưu cục gửi:</span> <span class="value">${info.BC_GUI || '-'}</span></div>
                        <div class="data-row"><span class="label">Bưu cục phát:</span> <span class="value">${info.BC_PHAT || '-'}</span></div>
                        <div class="data-row"><span class="label">Nước gửi/nhận:</span> <span class="value">${info.Nuoc_Chapnhan || 'VN'} ➔ ${info.Nuoc_Phat || 'VN'}</span></div>
                    </div>
                </div>

                <div class="section-heading">Chi tiết lịch sử hành trình (${locate.length} công đoạn)</div>
                
                <table class="history-table">
                    <thead>
                        <tr>
                            <th style="width: 110px;">Thời gian</th>
                            <th>Nội dung trạng thái</th>
                            <th style="width: 60px;">Mã BC</th>
                            <th>Vị trí thực tế</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedLocate.map((item, index) => `
                            <tr class="${index === 0 ? 'latest-status' : ''}">
                                <td>${item.Date} ${item.TimeDetail}</td>
                                <td>${item.StatusText}</td>
                                <td>${item.POSCode || '-'}</td>
                                <td>${typeof item.VI_TRI === 'string' ? item.VI_TRI : '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <div class="footer">
                    Dữ liệu được truy xuất trực tiếp từ hệ thống VNPost qua cổng kết nối InVanDon247 • Trang 1/1
                </div>
            `;

            document.getElementById('print-area').innerHTML = html;
        }

        // Tự động lấy CAPTCHA ngay khi mở trang
        window.onload = loadCaptcha;
    </script>
</body>
</html>
