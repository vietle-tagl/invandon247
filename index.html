<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247.com - In vận đơn A4 siêu tốc</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .web-container { max-width: 550px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003b7a; margin-top: 0; text-align: center; font-size: 20px; }
        
        .step-box { background: #fff8e1; border: 1px solid #ffe082; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #5d4037; }
        
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; outline: none; text-transform: uppercase; font-weight: bold; }
        
        .captcha-frame-wrapper { border: 1px solid #ccc; border-radius: 6px; overflow: hidden; height: 160px; margin-bottom: 15px; background: #fff; }
        iframe { width: 100%; height: 500px; border: none; margin-top: -140px; margin-left: -10px; }

        textarea { width: 100%; height: 120px; padding: 10px; border: 2px dashed #28a745; border-radius: 4px; box-sizing: border-box; font-size: 13px; margin-bottom: 10px; outline: none; }
        textarea:focus { border-color: #1e7e34; background-color: #f9fff9; }

        .btn-print { background-color: #003b7a; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-print:hover { background-color: #002855; }
        
        #print-area { display: none; background: #fff; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; }
            @page { size: A4 portrait; margin: 6mm 8mm 12mm 8mm; }
            body { background: #fff; padding: 0; margin: 0; }
        }

        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .header-title { font-size: 14px; font-weight: bold; color: #003b7a; text-transform: uppercase; margin: 0; }
        .box-section { border: 1px solid #333; padding: 4px 8px; margin-bottom: 6px; background: #fff; }
        .box-title { font-weight: bold; font-size: 10px; color: #003b7a; margin-bottom: 3px; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 1px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 8px; }
        .info-item { line-height: 1.2; font-size: 9.5px; }
        .info-item strong { color: #444; }
        .timeline-container { column-count: 2; column-gap: 10px; column-rule: 1px solid #ccc; margin-top: 2px; }
        .timeline-item { border-bottom: 1px dashed #ddd; break-inside: avoid; page-break-inside: avoid; line-height: 1.2; }
        .timeline-time { font-weight: bold; color: #d9534f; }
        .timeline-detail { color: #222; margin-top: 1px; }
        .delivery-table { width: 100%; border-collapse: collapse; margin-top: 2px; }
        .delivery-table th, .delivery-table td { border: 1px solid #ccc; padding: 2px 4px; text-align: left; }
        .delivery-table th { background-color: #f2f5f8; color: #003b7a; font-weight: bold; }
        .footer-print { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 8pt; color: #444; border-top: 1px solid #aaa; padding-top: 3px; background: #fff; }
    </style>
</head>
<body>

    <div class="web-container no-print">
        <h2>InVanDon247 - Trực Tiếp VNPost</h2>
        
        <div class="step-box">
            <b>Các bước thực hiện nhanh:</b><br>
            1. Tra cứu trực tiếp ở ô bên dưới.<br>
            2. Khi ra kết quả: Nhấn <b>Ctrl + A</b> $\rightarrow$ <b>Ctrl + C</b>.<br>
            3. Dán vào ô xanh dưới cùng để tự động in A4.
        </div>

        <div class="captcha-frame-wrapper">
            <iframe src="https://vnpost.vn/vi"></iframe>
        </div>

        <div class="form-group">
            <label style="color: #28a745;">Dán kết quả vừa copy vào đây (Tự động mở trang in A4):</label>
            <textarea id="rawText" placeholder="Click vào ô VNPost ở trên -> Ctrl+A -> Ctrl+C -> Quay xuống đây Ctrl+V..." oninput="autoProcess(this)"></textarea>
        </div>

        <button class="btn-print" onclick="processManualText()">🚀 Xử Lý Dữ Liệu & In A4</button>
    </div>

    <div id="print-area"></div>

    <script>
        function autoProcess(element) {
            if (element.value.trim().length > 80) {
                processManualText();
            }
        }

        function processManualText() {
            let text = document.getElementById('rawText').value;
            if (!text.trim()) {
                alert('Vui lòng dán nội dung tra cứu vào ô!');
                return;
            }
            renderPrintArea(text);
            window.print();
        }

        function renderPrintArea(text) {
            let codeMatch = text.match(/(?:Bưu gửi số|Mã vận đơn|Mã bưu gửi)\s*:\s*([A-Z0-9]+)/i) || text.match/([A-Z]{2}\d{9}[A-Z]{2})/i);
            let code = codeMatch ? codeMatch[1] : 'CHƯA_XÁC_ĐỊNH';

            let weightMatch = text.match/Khối lượng[^:]*:\s*([\d\.,]+)/i);
            let weight = weightMatch ? weightMatch[1] : '0';

            let statusMatch = text.match/Trạng thái\s*:\s*([^\n]+)/i);
            let status = statusMatch ? statusMatch[1].trim() : 'Đang cập nhật';

            let fromMatch = text.match(/(?:Bưu cục nhận|Nơi gửi)\s*:\s*([^\n]+)/i);
            let from = fromMatch ? fromMatch[1].trim() : '-';

            let toMatch = text.match(/(?:Bưu cục phát|Nơi nhận)\s*:\s*([^\n]+)/i);
            let to = toMatch ? toMatch[1].trim() : '-';

            let deliveryInfo = [];
            let deliverySectionIdx = text.indexOf('THÔNG TIN PHÁT');

            if (deliverySectionIdx !== -1) {
                let subText = text.substring(deliverySectionIdx);
                let lines = subText.split('\n');
                let date = '', office = '', detail = '';
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                        date = line;
                        for (let j = i + 1; j < lines.length; j++) {
                            let nextLine = lines[j].trim();
                            if (!nextLine || nextLine.toUpperCase().includes('NGÀY') || nextLine.toUpperCase().includes('BƯU CỤC')) continue;
                            if (!office) office = nextLine;
                            else if (!detail) { detail = nextLine; break; }
                        }
                        if (date) { deliveryInfo.push({date, office, detail}); break; }
                    }
                }
            }

            let timeline = [];
            let mainText = deliverySectionIdx !== -1 ? text.substring(0, deliverySectionIdx) : text;
            let lines = mainText.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    let time = line;
                    let detail = [];
                    let j = i + 1;
                    while (j < lines.length && !lines[j].trim().match(/^\d{2}\/\d{2}\/\d{4}/)) {
                        let subLine = lines[j].trim();
                        if (subLine.toUpperCase().includes('THÔNG TIN PHÁT') || 
                            subLine.toUpperCase().includes('DỊCH VỤ THỊNH HÀNH') || 
                            subLine.toUpperCase().includes('POSTMART')) break;
                        if (subLine) detail.push(subLine);
                        j++;
                    }
                    timeline.push({time, detail: detail.join(' ')});
                }
            }

            let fontSize = '9.5px';
            let itemPadding = '3px';
            if (timeline.length > 25) { fontSize = '8px'; itemPadding = '1px'; }
            else if (timeline.length > 15) { fontSize = '8.5px'; itemPadding = '1.5px'; }

            let deliveryHtml = '';
            if (deliveryInfo.length > 0) {
                deliveryHtml = `
                    <div class="box-section">
                        <div class="box-title">THÔNG TIN PHÁT</div>
                        <table class="delivery-table" style="font-size:${fontSize}">
                            <thead>
                                <tr>
                                    <th style="width:22%;">Ngày phát</th>
                                    <th style="width:33%;">Bưu cục phát</th>
                                    <th>Chi tiết phát</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${deliveryInfo.map(item => `
                                    <tr>
                                        <td><b>${item.date}</b></td>
                                        <td>${item.office}</td>
                                        <td><span style="color:green;font-weight:bold;">${item.detail}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            }

            let htmlContent = `
                <div class="header-container">
                    <div><img src="https://vnpost.vn/images/logo.png" style="height:28px;width:auto;" alt="VNPost"/></div>
                    <div class="header-title">THÔNG TIN VẬN ĐƠN</div>
                </div>
                <div class="box-section">
                    <div class="box-title">CHI TIẾT BƯU GỬI</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>Mã vận đơn:</strong> <b style="font-size:10.5px;">${code}</b></div>
                        <div class="info-item"><strong>Khối lượng:</strong> ${weight} gram</div>
                        <div class="info-item"><strong>Trạng thái:</strong> <span style="color:green;font-weight:bold;">${status}</span></div>
                        <div class="info-item"><strong>Bưu cục nhận:</strong> ${from}</div>
                        <div class="info-item" style="grid-column: span 2;"><strong>Bưu cục phát:</strong> ${to}</div>
                    </div>
                </div>
                <div class="box-section">
                    <div class="box-title">LỊCH SỬ HÀNH TRÌNH (${timeline.length} SỰ KIỆN)</div>
                    <div class="timeline-container" style="font-size:${fontSize}">
                        ${timeline.map(item => `<div class="timeline-item" style="margin-bottom:${itemPadding};padding-bottom:${itemPadding};"><div class="timeline-time">⏱ ${item.time}</div><div class="timeline-detail">${item.detail}</div></div>`).join('')}
                    </div>
                </div>
                ${deliveryHtml}
                <div class="footer-print">
                    <div>Xuất từ InVanDon247.com - Công cụ in vận đơn A4</div>
                    <div><b>Mã vận đơn:</b> ${code}</div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = htmlContent;
        }
    </script>
</body>
</html>
