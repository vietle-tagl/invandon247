<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InVanDon247 - Tra cứu VNPost</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
    --blue:#07579b;
    --blue2:#0b6bb8;
    --orange:#f6a000;
    --green:#148a4b;
    --bg:#f3f5f7;
    --text:#3f464d;
    --line:#dfe4e8;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
    margin:0;
    font-family:Arial,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* =========================
   HEADER
========================= */
.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 max(24px,calc((100% - 1100px)/2));
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
}

.brand-logo-img{
    height:42px;
    width:auto;
    display:block;
    object-fit:contain;
}

.brand strong{
    font-size:18px;
    color:var(--blue);
}

.brand small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:2px;
}

.nav{ display:flex; gap:25px; font-size:12px; }
.nav a{ color:#444; text-decoration:none; }
.nav a:hover{ color:var(--blue); }

/* =========================
   PAGE & SEARCH
========================= */
.page{
    max-width:1100px;
    margin:22px auto 50px;
    padding:0 14px;
}

.search-card{
    background:#fff;
    border:1px solid #e1e5e8;
    border-radius:9px;
    padding:20px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.search-title{
    text-align:center;
    color:var(--blue);
    font-size:20px;
    font-weight:700;
    margin:0;
}

.search-sub{
    text-align:center;
    color:#888;
    font-size:11px;
    margin:5px 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:12px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}

.field input{
    width:100%;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    padding:0 11px;
    font-size:13px;
    outline:none;
}

.field input:focus{ border-color:var(--blue); }

.captcha-line{ display:flex; gap:6px; }
.captcha-line input{ flex:1; }

.captcha-slot{
    width:100px;
    height:38px;
    flex:0 0 100px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
}

.captcha-img{
    width:100px;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    object-fit:contain;
    background:#fff;
    display:none;
}

.captcha-img.loaded{ display:block; }

.reload{
    border:0;
    background:#f0f1f2;
    border-radius:5px;
    padding:0 11px;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
}

.submit{
    width:100%;
    height:40px;
    margin-top:13px;
    border:0;
    border-radius:5px;
    background:var(--blue2);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.msg{
    margin-top:10px;
    padding:9px 12px;
    border-radius:5px;
    font-size:12px;
    display:none;
}
.msg.error{ display:block; background:#fff0f1; color:#b4232e; }
.msg.ok{ display:block; background:#eefaf3; color:#137441; }
.msg.wait{ display:block; background:#f3f8fc; color:#25638b; }

/* =========================
   RESULT & ACTION BUTTONS
========================= */
.result-head{
    display:none;
    justify-content:flex-end;
    gap:7px;
    margin:14px 0 10px;
}

.action{
    border:0;
    border-radius:5px;
    padding:9px 14px;
    color:#fff;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}
.print-btn{ background:#148a4b; }
.pdf-btn{ background:#0767b1; }

.result-card{
    background:#fff;
    border:1px solid #e0e5e9;
    border-radius:8px;
    padding:16px 20px 20px;
    box-shadow:0 3px 14px rgba(0,0,0,.05);
    display:none;
}

.summary-strip{
    background:#f4f6f8;
    border-radius:6px;
    padding:12px 16px;
    margin-bottom:16px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    font-size:12px;
    border:1px solid #e9ecef;
}

.summary-item{ display:flex; align-items:center; gap:8px; }
.summary-icon{ font-size:16px; color:#0d3f6d; }
.summary-item b{ color:#0d3f6d; }
.summary-item .status{ color:var(--green); font-weight:700; }

.route-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    padding:0 4px 16px;
    font-size:12px;
    border-bottom:1px dashed #e2e8f0;
}
.route-grid b{ display:inline-block; min-width:110px; color:#555; }

/* =========================
   TIMELINE
========================= */
.section-title{
    font-size:12px;
    font-weight:700;
    color:var(--blue);
    margin:16px 0 12px;
    text-transform:uppercase;
}

.timeline{ position:relative; margin:0 4px 16px; }
.timeline:before{
    content:"";
    position:absolute;
    left:8px;
    top:8px;
    bottom:8px;
    width:2px;
    background:#cfd5da;
}

.event{
    position:relative;
    display:grid;
    grid-template-columns:170px minmax(0,1.4fr) minmax(200px,1fr) 32px;
    gap:12px;
    padding:0 0 12px 0;
    align-items:start;
}

.event-dot{
    position:absolute;
    left:4px;
    top:5px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#9ea7af;
    border:2px solid #fff;
    box-shadow:0 0 0 1px #9ea7af;
    z-index:2;
}

.event.latest .event-dot{ background:#0b9a55; box-shadow:0 0 0 1px #0b9a55; }
.event-time{ padding-left:24px; font-size:11.5px; color:#666; font-weight:600; }
.event-status{ font-size:12px; line-height:1.4; color:#2d3748; }
.event-status b{ display:block; color:#64748b; font-size:11px; font-weight:500; margin-top:2px; }
.event.latest .event-status{ color:#078443; font-weight:700; }
.event-location{ font-size:11.5px; color:#5d646b; line-height:1.35; }

.map-btn{
    width:28px;
    height:28px;
    border:1px solid #d1d5db;
    background:#fff;
    color:#2563eb;
    cursor:pointer;
    font-size:13px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}
.map-btn:hover{ background:#eff6ff; border-color:#2563eb; }

/* =========================
   THÔNG TIN PHÁT
========================= */
.delivery{ margin-top:16px; border-top:1px dashed #e2e8f0; padding-top:8px; }
.delivery table{
    width:100%;
    border-collapse:collapse;
    font-size:11.5px;
    table-layout:fixed;
    margin-top:6px;
}
.delivery th{
    background:#edf2f7;
    text-align:left;
    padding:8px 10px;
    color:#334155;
    font-weight:700;
    border:1px solid #cbd5e1;
}
.delivery td{ border:1px solid #cbd5e1; padding:8px 10px; vertical-align:top; line-height:1.4; }

/* =========================
   MAP
========================= */
.map-panel{
    display:none;
    margin:20px 0 8px;
    border:1px solid #d9dee3;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.map-panel.show{ display:block; }
.map-toolbar{
    height:38px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    font-size:11.5px;
    border-bottom:1px solid #e2e8f0;
}
.map-toolbar b{ color:#1e293b; }
.map-toolbar a{ color:#2563eb; text-decoration:none; font-weight:600; }
.map-frame{ width:100%; height:320px; border:0; display:block; }

.screen-footer{
    text-align:center;
    border-top:1px solid #e2e5e8;
    margin:18px 0 0;
    padding-top:10px;
    color:#9aa1a8;
    font-size:10px;
}

#print-area{ display:none; }

@media(max-width:760px){
    .topbar{ padding:0 12px; }
    .nav{ display:none; }
    .form-grid, .summary-strip, .route-grid{ grid-template-columns:1fr; }
    .event{ grid-template-columns:1fr 30px; gap:6px; padding-left:22px; }
    .event-time{ padding-left:0; }
    .event-status, .event-location{ grid-column:1; }
    .event-dot{ left:0; }
    .timeline:before{ left:4px; }
    .result-head{ justify-content:stretch; }
    .action{ flex:1; }
    .delivery{ overflow-x:auto; }
    .delivery table{ min-width:620px; }
}

/* =========================================================
   STYLE IN A4
========================================================= */
@page{ size:A4 portrait; margin:8mm; }

.print-page{
    width:192mm;
    min-height:277mm;
    position:relative;
    page-break-after:always;
    padding:2px;
    font-family:Arial, sans-serif;
    color:#111;
}
.print-page:last-child{ page-break-after:auto; }

.p-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.p-logo-img{
    height:38px;
    width:auto;
    display:block;
}

.p-main-title{
    font-size:15px;
    font-weight:bold;
    color:#003b7a;
    text-transform:uppercase;
}

.p-box{
    border:1px solid #333;
    padding:6px 10px;
    margin-bottom:8px;
    background:#fff;
}

.p-box-title{
    font-size:11px;
    font-weight:bold;
    color:#003b7a;
    text-transform:uppercase;
    margin-bottom:4px;
    border-bottom:1px solid #ddd;
    padding-bottom:2px;
}

.p-grid-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px 12px;
    font-size:10px;
    line-height:1.2;
}

.p-grid-info strong{ color:#444; }
.p-grid-info .status-success{ color:green; font-weight:bold; }

.p-columns{
    column-count:2;
    column-gap:12px;
    column-rule:1px solid #ccc;
    margin-top:4px;
}

.p-event-item{
    margin-bottom:4px;
    padding-bottom:3px;
    border-bottom:1px dashed #ddd;
    break-inside:avoid;
    page-break-inside:avoid;
    line-height:1.25;
}

.p-event-time{
    font-weight:bold;
    color:#d9534f;
    font-size:9.5px;
}

.p-event-desc{
    color:#222;
    font-size:9.5px;
    margin-top:1px;
}

.p-table{
    width:100%;
    border-collapse:collapse;
    margin-top:4px;
    font-size:9.5px;
}

.p-table th, .p-table td{
    border:1px solid #ccc;
    padding:4px 6px;
    text-align:left;
}

.p-table th{
    background-color:#f2f5f8;
    color:#003b7a;
    font-weight:bold;
}

@media print{
    body{ background:#fff; }
    .no-print, .topbar, .page>.search-card, .result-head, .result-card{ display:none!important; }
    #print-area{ display:block!important; }
}
</style>
</head>

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;
let captchaRequestId = 0;

const esc = s => String(s ?? '-').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function cleanStatus(s){
    return String(s || '-').replace(/\s*\(\d{4,7}\s*:[^)]+\)/g, '').replace(/\s{2,}/g, ' ').trim();
}

function getAddress(item){
    return typeof item?.VI_TRI === 'string' && item.VI_TRI.trim() ? item.VI_TRI.trim() : '-';
}

function getCoords(item){
    let lat = item?.LAT ?? item?.Lat ?? item?.latitude ?? item?.Latitude;
    let lng = item?.LNG ?? item?.Lon ?? item?.LONG ?? item?.longitude ?? item?.Longitude;
    return lat && lng ? {lat,lng} : null;
}

function getOffice(item){
    const text = String(item?.StatusText || item?.STATUSTEXT || '');
    const m = text.match(/\((\d{4,7})\s*:\s*([^)]*)\)/);
    if(m){
        return { code:m[1], name:m[2].trim(), full:m[1]+': '+m[2].trim() };
    }
    const code = item?.POSCode ?? item?.POSCODE ?? item?.ToPOSCode ?? '';
    return { code:String(code || '-'), name:'', full:String(code || '-') };
}

function getOfficeForDelivery(data, d){
    const direct = getOffice({
        StatusText: d?.STATUSTEXT || d?.StatusText,
        POSCode: d?.POSCODE || d?.POSCode || d?.ToPOSCode
    });
    if(direct.name) return direct;

    const code = String(d?.ToPOSCode || d?.POSCode || d?.POSCODE || direct.code || '').trim();
    if(code){
        const found = (data?.locate || []).slice().reverse().find(x => String(x?.POSCode || x?.POSCODE || '').trim() === code);
        if(found) return getOffice(found);
    }
    return direct;
}

function getDeliveryRecord(data){
    const list = Array.isArray(data?.delivery) ? data.delivery : [];
    if(!list.length) return null;
    return list.find(d => /phát thành công|delivered/i.test(String(d?.STATUSTEXT || d?.StatusText || ''))) || list[list.length - 1];
}

function getDeliveryTime(d){
    const value = d?.NGAY_PHAT || d?.DATE || d?.Date || d?.TimeDetail || d?.NGAY_NHAP || '-';
    return String(value || '-').trim() || '-';
}

function getDeliveryPerson(data){
    const d = getDeliveryRecord(data);
    if(!d) return { route:'-', name:'-', phone:'-', receiver:'-', time:'-' };

    const cn = String(d.NGAY_CN || '').trim();
    let route = '-', name = '-', phone = '-';

    if(cn){
        const slashIndex = cn.indexOf('/');
        if(slashIndex >= 0){
            route = cn.slice(0,slashIndex).trim() || '-';
            let right = cn.slice(slashIndex + 1).trim();
            const pm = right.match(/(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*(\d[\d .-]{7,}\d)\s*$/iu) || right.match(/(\d[\d .-]{8,}\d)\s*$/);
            if(pm){
                phone = pm[1].replace(/\D/g,'');
                right = right.slice(0, pm.index).trim();
            }
            name = right.replace(/[.\s]*(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*$/iu, '').replace(/[.\s]+$/, '').trim() || '-';
        }
    }

    const st = String(d.STATUSTEXT || d.StatusText || '');
    let receiver = '-';
    const rm = st.match(/Người nhận\s*:\s*(.*)$/i);
    if(rm){
        receiver = rm[1].replace(/^\(\s*\)\s*/, '').trim().replace(/[.]+$/, '') || '-';
    }

    return { route, name, phone, receiver, time:getDeliveryTime(d) };
}

function latestStatus(data){
    const d = getDeliveryRecord(data);
    if(d?.STATUSTEXT) return String(d.STATUSTEXT).trim();
    const loc = data.locate || [];
    return loc.length ? String(loc[loc.length - 1].StatusText || '-').trim() : 'ĐANG VẬN CHUYỂN';
}

function showMsg(text, type='error'){
    const m = document.getElementById('message');
    m.className = 'msg ' + type;
    m.textContent = text;
}

function fetchWithTimeout(url, options = {}, timeout = 12000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    return fetch(url, { ...options, signal:controller.signal, cache:'no-store' }).finally(() => clearTimeout(timer));
}

async function loadCaptcha(){
    const img = document.getElementById('captchaImg');
    const reload = document.getElementById('reloadCaptcha');
    const requestId = ++captchaRequestId;

    img.classList.remove('loaded');
    img.removeAttribute('src');
    currentCookie = '';
    reload.disabled = true;

    for(let attempt = 1; attempt <= 3; attempt++){
        if(requestId !== captchaRequestId) return false;
        try{
            const res = await fetchWithTimeout('/api/proxy?action=get-captcha&_=' + Date.now(), {}, 10000);
            const data = await res.json();
            if(requestId !== captchaRequestId) return false;

            if(data?.captchaUrl){
                const src = String(data.captchaUrl);
                await new Promise((resolve,reject) => {
                    const test = new Image();
                    test.onload = () => resolve();
                    test.onerror = () => reject(new Error('captcha image error'));
                    test.src = src;
                });
                if(requestId !== captchaRequestId) return false;

                img.src = src;
                img.classList.add('loaded');
                currentCookie = data.cookie || '';
                reload.disabled = false;
                return true;
            }
        }catch(e){}

        if(attempt < 3){
            await new Promise(r => setTimeout(r, 500));
        }
    }

    reload.disabled = false;
    return false;
}

async function submitTracking(){
    const code = document.getElementById('trackingCode').value.trim();
    const captcha = document.getElementById('captchaText').value.trim();
    const btn = document.getElementById('btnSubmit');

    if(!code || !captcha){
        showMsg('Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.');
        return;
    }

    if(!currentCookie){
        showMsg('CAPTCHA chưa sẵn sàng. Vui lòng chờ CAPTCHA hiện ra rồi thử lại.', 'wait');
        return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Đang tra cứu...';
    showMsg('Đang kết nối hệ thống VNPost, vui lòng chờ...', 'wait');

    try{
        const res = await fetchWithTimeout('/api/proxy?action=track', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body:JSON.stringify({ trackingCode:code, captchaText:captcha, cookie:currentCookie })
        }, 30000);

        let data = null;
        try{
            data = await res.json();
        }catch(_){
            throw new Error('Máy chủ trả về dữ liệu không hợp lệ.');
        }

        if(data?.info?.ID){
            currentTrackingCode = data.info.ID;
            currentData = data;
            renderScreen(data);
            renderPrint(data);

            document.getElementById('result-card').style.display = 'block';
            document.getElementById('result').style.display = 'flex';
            showMsg('Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.', 'ok');
            document.getElementById('result-card').scrollIntoView({ behavior:'smooth', block:'start' });
        } else {
            showMsg(data?.message || 'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.');
            document.getElementById('captchaText').value = '';
            await loadCaptcha();
        }
    }catch(e){
        if(e?.name === 'AbortError'){
            showMsg('Tra cứu mất quá nhiều thời gian. Vui lòng thử lại sau vài giây.');
        } else {
            showMsg('Lỗi tra cứu: ' + (e?.message || 'Không xác định'));
        }
    }finally{
        btn.disabled = false;
        btn.textContent = '🔎 Tra cứu vận đơn';
    }
}

function openMap(address, title, coords){
    const panel = document.getElementById('map-panel');
    panel.classList.add('show');

    document.getElementById('map-title').textContent = title + ' — ' + address;
    const q = coords ? `${coords.lat},${coords.lng}` : address;
    const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

    document.getElementById('map-link').href = maps;
    document.getElementById('map-frame').src = 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed';

    panel.scrollIntoView({ behavior:'smooth', block:'center' });
}

function printA4(){
    if(!currentData){ alert('Vui lòng tra cứu vận đơn trước.'); return; }
    window.print();
}

async function downloadPDF(){
    if(!currentData){ alert('Vui lòng tra cứu vận đơn trước.'); return; }
    if(typeof html2pdf === 'undefined'){ alert('Thư viện tạo PDF chưa tải xong. Vui lòng thử lại.'); return; }

    const el = document.getElementById('print-area');
    const old = el.style.display;
    el.style.display = 'block';

    try{
        const opt = {
            margin:0,
            filename: `VanDon_VNPost_${currentTrackingCode || '247'}.pdf`,
            image:{ type:'jpeg', quality:.98 },
            html2canvas:{ scale:2, useCORS:true, backgroundColor:'#fff', logging:false },
            jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' }
        };

        await html2pdf().set(opt).from(el).save();
    }finally{
        el.style.display = old;
    }
}
