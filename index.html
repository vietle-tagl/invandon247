<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247.com - Tra Cứu & In A4</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .web-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003b7a; margin-top: 0; text-align: center; font-size: 20px; }
        
        .iframe-wrapper { width: 100%; height: 380px; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-bottom: 15px; }
        iframe { width: 100%; height: 100%; border: none; }

        .btn-submit { background-color: #003b7a; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-submit:hover { background-color: #002855; }
        
        .instruction { font-size: 13px; color: #555; background: #eef5ff; padding: 10px; border-radius: 4px; margin-bottom: 15px; }

        #print-area { display: none; background: #fff; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; }
            @page { size: A4 portrait; margin: 6mm 8mm 12mm 8mm; }
            body { background: #fff; padding: 0; margin: 0; }
        }

        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .header-title { font-size: 14px; font-weight: bold; color: #003b7a; text-transform: uppercase; margin: 0; }
        .box-section { border: 1px solid #333; padding: 4px 8px; margin-bottom: 6px; background: #fff; }
        .box-title { font-weight: bold; font-size: 10px; color: #003b7a; margin-bottom: 3px; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 1px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 8px; }
        .info-item { line-height: 1.2; font-size: 9.5px; }
        .info-item strong { color: #444; }
        .timeline-container { column-count: 2; column-gap: 10px; column-rule: 1px solid #ccc; margin-top: 2px; }
        .timeline-item { border-bottom: 1px dashed #ddd; break-inside: avoid; page-break-inside: avoid; line-height: 1.2; }
        .timeline-time { font-weight: bold; color: #d9534f; }
        .timeline-detail { color: #222; margin-top: 1px; }
        .footer-print { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 8pt; color: #444; border-top: 1px solid #aaa; padding-top: 3px; background: #fff; }
    </style>
</head>
<body>

    <div class="web-container no-print">
        <h2>InVanDon247 - Tra Cứu & In A4</h2>
        
        <div class="instruction">
            👉 Nhập <b>Mã vận đơn</b> và <b>CAPTCHA</b> trực tiếp khung VNPost bên dưới, sau đó bấm <b>Tra cứu</b> trên khung hoặc bấm nút xanh bên dưới để tự động chuyển sang bản in A4.
        </div>

        <div class="iframe-wrapper">
            <iframe id="vnpostFrame" src="https://vnpost.vn/vi/Tracking"></iframe>
        </div>

        <button class="btn-submit" onclick="captureAndPrint()">🚀 Chuyển Thành Bản In A4 & In</button>
    </div>

    <div id="print-area"></div>

    <script>
        function captureAndPrint() {
            try {
                let frame = document.getElementById('vnpostFrame');
                let frameDoc = frame.contentDocument || frame.contentWindow.document;
                let rawText = frameDoc.body.innerText;

                if (!rawText.includes('Khối lượng') && !rawText.includes('Bưu gửi số')) {
                    alert('Bạn chưa thực hiện tra cứu thành công trên khung VNPost hoặc thông tin chưa hiển thị. Vui lòng kiểm tra lại CAPTCHA!');
                    return;
                }

                renderPrintArea(rawText);
                window.print();
            } catch (e) {
                // Trường hợp trình duyệt chặn Cross-Origin (CORS) đọc iframe
                alert('Vui lòng bôi đen toàn bộ kết quả tra cứu trong khung trên, bấm Ctrl+C rồi bấm nút "In A4" lại nhé!');
            }
        }

        function renderPrintArea(rawText) {
            let codeMatch = rawText.match(/(?:Bưu gửi số|Mã vận đơn|Mã bưu gửi)\s*:\s*([A-Z0-9]+)/i) || rawText.match(/([A-Z]{2}\d{9}[A-Z]{2})/i);
            let code = codeMatch ? codeMatch[1] : 'Không xác định';

            let weightMatch = rawText.match(/Khối lượng[^:]*:\s*([\d\.,]+)/i);
            let weight = weightMatch ? weightMatch[1] : '0';

            let statusMatch = rawText.match(/Trạng thái\s*:\s*([^\n]+)/i);
            let status = statusMatch ? statusMatch[1].trim() : 'Đang cập nhật';

            let fromMatch = rawText.match(/(?:Bưu cục nhận|Nơi gửi)\s*:\s*([^\n]+)/i);
            let from = fromMatch ? fromMatch[1].trim() : '-';

            let toMatch = rawText.match(/(?:Bưu cục phát|Nơi nhận)\s*:\s*([^\n]+)/i);
            let to = toMatch ? toMatch[1].trim() : '-';

            let timeline = [];
            let lines = rawText.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    let time = line;
                    let detail = [];
                    let j = i + 1;
                    while (j < lines.length && !lines[j].trim().match(/^\d{2}\/\d{2}\/\d{4}/)) {
                        let subLine = lines[j].trim();
                        if (subLine && !subLine.includes('Chi tiết bưu gửi')) detail.push(subLine);
                        j++;
                    }
                    timeline.push({ time: time, detail: detail.join(' ') });
                }
            }

            let fontSize = timeline.length > 20 ? '8.5px' : '9.5px';

            let htmlContent = `
                <div class="header-container">
                    <div><img src="https://vnpost.vn/images/logo.png" style="height:28px;width:auto;" alt="VNPost"/></div>
                    <div class="header-title">THÔNG TIN VẬN ĐƠN</div>
                </div>
                <div class="box-section">
                    <div class="box-title">CHI TIẾT BƯU GỬI</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>Mã vận đơn:</strong> <b style="font-size:10.5px;">${code}</b></div>
                        <div class="info-item"><strong>Khối lượng:</strong> ${weight} gram</div>
                        <div class="info-item"><strong>Trạng thái:</strong> <span style="color:green;font-weight:bold;">${status}</span></div>
                        <div class="info-item"><strong>Bưu cục nhận:</strong> ${from}</div>
                        <div class="info-item" style="grid-column: span 2;"><strong>Bưu cục phát:</strong> ${to}</div>
                    </div>
                </div>
                <div class="box-section">
                    <div class="box-title">LỊCH SỬ HÀNH TRÌNH (${timeline.length} SỰ KIỆN)</div>
                    <div class="timeline-container" style="font-size:${fontSize}">
                        ${timeline.map(item => `
                            <div class="timeline-item">
                                <div class="timeline-time">⏱ ${item.time}</div>
                                <div class="timeline-detail">${item.detail}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="footer-print">
                    <div>Xuất từ InVanDon247.com</div>
                    <div><b>Mã vận đơn:</b> ${code}</div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = htmlContent;
        }
    </script>
</body>
</html>
