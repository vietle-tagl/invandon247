<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InVanDon247 - Tra cứu VNPost</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

/* =========================================================
   BIẾN MÀU
========================================================= */
:root{
    --blue:#07579b;
    --blue2:#0868b5;
    --blue-light:#eef5fb;
    --orange:#f6a000;
    --green:#148a4b;
    --red:#d93025;
    --bg:#f3f5f7;
    --text:#3f464d;
    --muted:#7b838c;
    --line:#dfe4e8;
}


/* =========================================================
   RESET
========================================================= */
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,"Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
}


/* =========================================================
   HEADER WEB
========================================================= */
.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 max(24px,calc((100% - 1100px)/2));
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:58px;
    height:45px;
    object-fit:contain;
}

.brand strong{
    display:block;
    font-size:18px;
    color:var(--blue);
}

.brand small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:2px;
}

.nav{
    display:flex;
    gap:25px;
    font-size:12px;
}

.nav a{
    color:#444;
    text-decoration:none;
}

.nav a:hover{
    color:var(--blue);
}


/* =========================================================
   PAGE
========================================================= */
.page{
    max-width:1100px;
    margin:22px auto 50px;
    padding:0 14px;
}


/* =========================================================
   KHUNG TRA CỨU
========================================================= */
.search-card{
    background:#fff;
    border:1px solid #e1e5e8;
    border-radius:9px;
    padding:20px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.search-title{
    text-align:center;
    color:var(--blue);
    font-size:20px;
    font-weight:700;
    margin:0;
}

.search-sub{
    text-align:center;
    color:#888;
    font-size:11px;
    margin:5px 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:12px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}

.field input{
    width:100%;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    padding:0 11px;
    font-size:13px;
    outline:none;
}

.field input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(7,87,155,.08);
}


/* =========================================================
   CAPTCHA
========================================================= */
.captcha-line{
    display:flex;
    gap:6px;
}

.captcha-line input{
    flex:1;
    min-width:0;
}

.captcha-img{
    width:100px;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    object-fit:contain;
    background:#f8f8f8;
}

.reload{
    border:0;
    background:#f0f1f2;
    border-radius:5px;
    padding:0 11px;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
}

.reload:hover{
    background:#e4e6e8;
}


/* =========================================================
   NÚT TRA CỨU
========================================================= */
.submit{
    width:100%;
    height:40px;
    margin-top:13px;
    border:0;
    border-radius:5px;
    background:var(--blue2);
    color:#fff;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
}

.submit:hover{
    background:#075a9d;
}

.submit:disabled{
    opacity:.6;
    cursor:wait;
}


/* =========================================================
   THÔNG BÁO
========================================================= */
.msg{
    margin-top:10px;
    padding:9px 12px;
    border-radius:5px;
    font-size:12px;
    display:none;
}

.msg.error{
    display:block;
    background:#fff0f1;
    color:#b4232e;
}

.msg.ok{
    display:block;
    background:#eefaf3;
    color:#137441;
}


/* =========================================================
   THANH NÚT IN / PDF
========================================================= */
.result-head{
    display:none;
    justify-content:flex-end;
    align-items:center;
    gap:7px;
    margin:12px 0 8px;
    height:38px;
}

.action{
    border:0;
    border-radius:5px;
    padding:8px 14px;
    color:#fff;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
    height:34px;
}

.print-btn{
    background:#148a4b;
}

.print-btn:hover{
    background:#10713d;
}

.pdf-btn{
    background:#0767b1;
}

.pdf-btn:hover{
    background:#05558f;
}


/* =========================================================
   KHUNG KẾT QUẢ
========================================================= */
.result-card{
    background:#fff;
    border:1px solid #e0e5e9;
    border-radius:8px;
    padding:0 16px 18px;
    box-shadow:0 3px 14px rgba(0,0,0,.05);
    display:none;
}


/* =========================================================
   THANH TÓM TẮT
========================================================= */
.summary-strip{
    background:#f4f5f6;
    margin:0 -8px 12px;
    padding:10px 8px;
    display:grid;
    grid-template-columns:1fr 1fr 1.3fr;
    gap:12px;
    font-size:11px;
}

.summary-item{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.summary-icon{
    font-size:18px;
    color:#222;
    width:20px;
    text-align:center;
}

.summary-item b{
    color:#0d3f6d;
}

.summary-item .status{
    color:var(--green);
    font-weight:700;
}


/* =========================================================
   THÔNG TIN TUYẾN
========================================================= */
.route-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 25px;
    padding:0 8px 13px;
    font-size:11px;
}

.route-grid div{
    padding:4px 0;
}

.route-grid b{
    display:inline-block;
    min-width:110px;
}


/* =========================================================
   TIÊU ĐỀ SECTION
========================================================= */
.section-title{
    font-size:12px;
    font-weight:700;
    color:#4e555c;
    margin:8px 8px 10px;
    text-transform:uppercase;
}


/* =========================================================
   TIMELINE
========================================================= */
.timeline{
    position:relative;
    margin:0 8px;
}

.timeline:before{
    content:"";
    position:absolute;
    left:8px;
    top:7px;
    bottom:7px;
    width:2px;
    background:#aeb4b9;
}

.event{
    position:relative;
    display:grid;
    grid-template-columns:185px minmax(0,1.45fr) minmax(230px,1fr) 32px;
    gap:12px;
    padding:0 0 12px;
    min-height:54px;
}

.event-dot{
    position:absolute;
    left:4px;
    top:6px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#5b6166;
    border:2px solid #fff;
    box-shadow:0 0 0 1px #5b6166;
}

.event.latest .event-dot{
    background:#0b9a55;
    box-shadow:0 0 0 1px #0b9a55;
}

.event-time{
    padding-left:22px;
    font-size:11px;
    color:#555;
    line-height:1.35;
}

.event-status{
    font-size:11px;
    line-height:1.4;
}

.event-status b{
    display:block;
    color:#555;
    font-size:10px;
    margin-top:3px;
}

.event.latest .event-status{
    color:#078443;
    font-weight:700;
}

.event-location{
    font-size:11px;
    color:#5d646b;
    line-height:1.4;
}

.map-btn{
    width:28px;
    height:28px;
    border:0;
    background:#fff;
    color:#536df1;
    cursor:pointer;
    font-size:17px;
    border-radius:50%;
    transition:.15s;
}

.map-btn:hover{
    background:#eef1ff;
    transform:scale(1.05);
}

.event.selected{
    background:#f7fbff;
    border-radius:4px;
}


/* =========================================================
   BẢN ĐỒ
========================================================= */
.map-panel{
    display:none;
    margin:4px 8px 14px;
    border:1px solid #d9dee3;
    border-radius:6px;
    overflow:hidden;
    background:#fff;
}

.map-panel.show{
    display:block;
}

.map-toolbar{
    min-height:38px;
    background:#f7f8f9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:7px 10px;
    font-size:11px;
}

.map-toolbar b{
    color:#495057;
}

.map-toolbar a{
    color:#0969b0;
    text-decoration:none;
    white-space:nowrap;
}

.map-frame{
    width:100%;
    height:300px;
    border:0;
    display:block;
}


/* =========================================================
   THÔNG TIN PHÁT
========================================================= */
.delivery{
    margin:12px 8px 0;
}

.delivery table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
}

.delivery th{
    background:#edf1f5;
    text-align:left;
    padding:8px;
}

.delivery td{
    border:1px solid #e1e5e9;
    padding:8px;
}

.screen-footer{
    text-align:center;
    border-top:1px solid #e2e5e8;
    margin:14px 8px 0;
    padding-top:7px;
    color:#9aa1a8;
    font-size:9px;
}


/* =========================================================
   KHU VỰC BẢN IN - MẶC ĐỊNH KHÔNG HIỆN TRÊN WEB
========================================================= */
#print-area{
    display:none;
}


/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:760px){

    .topbar{
        padding:0 12px;
    }

    .nav{
        display:none;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary-strip{
        grid-template-columns:1fr;
    }

    .route-grid{
        grid-template-columns:1fr;
    }

    .event{
        grid-template-columns:1fr 32px;
        gap:5px;
        padding-left:20px;
    }

    .event-time{
        padding-left:0;
    }

    .event-status,
    .event-location{
        grid-column:1;
    }

    .event-dot{
        left:0;
    }

    .timeline:before{
        left:4px;
    }

    .result-head{
        justify-content:stretch;
    }

    .action{
        flex:1;
    }

    .captcha-line{
        flex-wrap:wrap;
    }

    .captcha-line input{
        min-width:100%;
    }
}


/* =========================================================
   =========================================================
   CHỈ TỪ ĐÂY TRỞ XUỐNG MỚI LÀ CSS CHO BẢN IN
   =========================================================
   ========================================================= */
@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    html,
    body{
        background:#fff !important;
        margin:0 !important;
        padding:0 !important;
    }

    .no-print,
    .topbar,
    .search-card,
    .result-head,
    .result-card{
        display:none !important;
    }

    #print-area{
        display:block !important;
        width:100%;
    }

    .print-page{
        width:194mm;
        min-height:281mm;
        position:relative;
        page-break-after:always;
        break-after:page;
        padding:0;
        background:#fff;
    }

    .print-page:last-child{
        page-break-after:auto;
        break-after:auto;
    }


    /* HEADER */
    .print-header{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        border-bottom:2px solid var(--blue);
        padding-bottom:5px;
        margin-bottom:7px;
    }

    .print-brand-wrap{
        display:flex;
        align-items:flex-start;
        gap:8px;
    }

    .print-logo{
        width:63px;
        height:43px;
        object-fit:contain;
    }

    .print-brand{
        font-size:13px;
        color:var(--blue);
        font-weight:700;
        padding-top:3px;
    }

    .print-brand small{
        display:block;
        font-size:7px;
        color:#777;
        font-weight:400;
        margin-top:2px;
    }

    .print-meta{
        text-align:right;
        font-size:7px;
        color:#777;
        line-height:1.5;
    }


    /* TIÊU ĐỀ */
    .print-title{
        text-align:center;
        border:1px solid #cfd5db;
        padding:5px;
        margin-bottom:7px;
    }

    .print-title b{
        font-size:11px;
    }

    .print-code{
        font-size:12px;
        font-weight:700;
        color:#a66c00;
        margin-top:1px;
        letter-spacing:.5px;
    }


    /* TÓM TẮT */
    .print-summary{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:6px;
        margin-bottom:7px;
    }

    .pbox{
        border:1px solid #cdd3d8;
        padding:5px;
    }

    .pbox h4{
        font-size:7.5px;
        color:var(--blue);
        margin:0 0 4px;
        border-bottom:1px dashed #ddd;
        padding-bottom:2px;
    }

    .prow{
        font-size:7.2px;
        line-height:1.45;
    }

    .prow span{
        color:#777;
        display:inline-block;
        width:70px;
    }

    .prow b{
        color:#30353a;
    }


    /* LỊCH SỬ */
    .print-history-title{
        font-size:8px;
        font-weight:700;
        color:#333;
        border-left:3px solid var(--blue);
        padding-left:4px;
        margin:4px 0;
    }

    /*
       2 CỘT TRÊN GIẤY A4
    */
    .print-columns{
        column-count:2;
        column-gap:7mm;
        column-rule:1px solid #ddd;
        column-fill:auto;
        height:225mm;
    }

    .p-event{
        break-inside:avoid;
        page-break-inside:avoid;
        border-bottom:1px dashed #ddd;
        padding:0 0 3.5px;
        margin:0 0 3.5px;
        font-size:7.1px;
        line-height:1.25;
    }

    .p-time{
        font-weight:700;
        color:#555;
    }

    .p-event.latest .p-time,
    .p-event.latest .p-status{
        color:#087d42;
    }

    .p-status{
        margin-top:1px;
    }

    .p-meta{
        color:#555;
        margin-top:1px;
    }

    .p-address{
        color:#555;
    }


    /* THÔNG TIN PHÁT */
    .print-delivery{
        margin-top:7px;
    }

    .print-delivery h4{
        font-size:8px;
        margin:0 0 3px;
    }

    .print-delivery table{
        width:100%;
        border-collapse:collapse;
        font-size:7px;
    }

    .print-delivery th{
        background:#edf1f5;
        text-align:left;
        padding:3px;
    }

    .print-delivery td{
        border:1px solid #d8dde2;
        padding:3px;
    }


    /* FOOTER */
    .print-footer{
        position:absolute;
        left:0;
        right:0;
        bottom:0;
        border-top:1px solid #ddd;
        padding-top:3px;
        text-align:center;
        font-size:6.5px;
        color:#999;
    }

}


/* =========================================================
   BẢN IN PDF HTML2PDF
   Không dùng @media print
========================================================= */

.pdf-mode{
    display:block !important;
}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="topbar no-print">

    <div class="brand">

        <img
            src="https://vietnampost.vn/uploads/storage/vnp/2025/09/15/3aa71b839430793ee9e4b9f47415c54a878027ec.jpg"
            alt="Vietnam Post"
        >

        <div>
            <strong>InVanDon247</strong>
            <small>Công cụ tra cứu và tạo phiếu vận đơn A4</small>
        </div>

    </div>


    <nav class="nav">
        <a href="#">Trang chủ</a>
        <a href="#search">Tra cứu</a>
        <a href="#result">Hướng dẫn</a>
        <a href="#">Giới thiệu</a>
    </nav>

</header>



<!-- =========================================================
     NỘI DUNG
========================================================= -->

<main class="page">


<!-- =========================================================
     FORM TRA CỨU
========================================================= -->

<section class="search-card no-print" id="search">

    <h1 class="search-title">
        TRA CỨU VẬN ĐƠN
    </h1>

    <div class="search-sub">
        Nhập mã vận đơn và mã CAPTCHA để xem hành trình bưu gửi
    </div>


    <div class="form-grid">


        <!-- MÃ VẬN ĐƠN -->

        <div class="field">

            <label>
                1. Mã vận đơn VNPost
            </label>

            <input
                id="trackingCode"
                type="text"
                placeholder="Ví dụ: RB608631891VN"
            >

        </div>



        <!-- CAPTCHA -->

        <div class="field">

            <label>
                2. Mã xác thực (CAPTCHA)
            </label>

            <div class="captcha-line">

                <input
                    id="captchaText"
                    type="text"
                    placeholder="Nhập mã CAPTCHA"
                    autocomplete="off"
                >

                <img
                    id="captchaImg"
                    class="captcha-img"
                    alt="Đang tải CAPTCHA..."
                >

                <button
                    class="reload"
                    type="button"
                    onclick="loadCaptcha()"
                >
                    ↻ Đổi mã
                </button>

            </div>

        </div>

    </div>


    <button
        id="btnSubmit"
        class="submit"
        type="button"
        onclick="submitTracking()"
    >
        🔎 Tra cứu vận đơn
    </button>


    <div id="message" class="msg"></div>

</section>



<!-- =========================================================
     NÚT IN / PDF
========================================================= -->

<div
    id="result"
    class="result-head no-print"
>

    <button
        class="action print-btn"
        onclick="printA4()"
    >
        🖨 In A4
    </button>


    <button
        class="action pdf-btn"
        onclick="downloadPDF()"
    >
        📥 Tải xuống PDF
    </button>

</div>



<!-- =========================================================
     KHUNG KẾT QUẢ MÀN HÌNH
========================================================= -->

<section
    id="result-card"
    class="result-card no-print"
>

    <div id="screen-result"></div>

</section>



</main>



<!-- =========================================================
     KHU VỰC DÀNH RIÊNG CHO BẢN IN
========================================================= -->

<div id="print-area"></div>



<script>

/* =========================================================
   BIẾN TOÀN CỤC
========================================================= */

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;



/* =========================================================
   ESC HTML
========================================================= */

function esc(value){

    return String(value ?? '-')
        .replace(/[&<>"']/g, function(m){

            return {
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'
            }[m];

        });

}



/* =========================================================
   LÀM SẠCH STATUS
========================================================= */

function cleanStatus(value){

    return String(value || '-')
        .replace(
            /\s*\(\d{4,7}\s*:[^)]+\)/g,
            ''
        )
        .replace(/\s{2,}/g,' ')
        .trim();

}



/* =========================================================
   LẤY ĐỊA CHỈ
========================================================= */

function getAddress(item){

    if(
        typeof item?.VI_TRI === 'string' &&
        item.VI_TRI.trim()
    ){

        return item.VI_TRI.trim();

    }

    return '-';

}



/* =========================================================
   LẤY TỌA ĐỘ NẾU API CÓ
========================================================= */

function getCoords(item){

    const lat =
        item?.LAT ??
        item?.Lat ??
        item?.latitude ??
        item?.Latitude;

    const lng =
        item?.LNG ??
        item?.Lon ??
        item?.LONG ??
        item?.longitude ??
        item?.Longitude;

    if(lat && lng){

        return {
            lat:lat,
            lng:lng
        };

    }

    return null;

}



/* =========================================================
   LẤY TRẠNG THÁI MỚI NHẤT
========================================================= */

function latestStatus(data){

    const delivery =
        data.delivery?.[0];

    if(
        delivery?.STATUSTEXT
    ){

        return delivery.STATUSTEXT;

    }

    const locate =
        data.locate || [];

    if(locate.length){

        return locate[
            locate.length - 1
        ].StatusText;

    }

    return 'ĐANG VẬN CHUYỂN';

}



/* =========================================================
   HIỂN THỊ THÔNG BÁO
========================================================= */

function showMsg(
    text,
    type='error'
){

    const msg =
        document.getElementById('message');

    msg.className =
        'msg ' + type;

    msg.textContent =
        text;

}



/* =========================================================
   TẢI CAPTCHA
========================================================= */

async function loadCaptcha(){

    const img =
        document.getElementById('captchaImg');

    img.removeAttribute('src');

    img.alt =
        'Đang tải CAPTCHA...';


    try{

        const res =
            await fetch(
                '/api/proxy?action=get-captcha'
            );

        const data =
            await res.json();


        if(data.captchaUrl){

            img.src =
                data.captchaUrl;

            img.alt =
                'CAPTCHA';

            currentCookie =
                data.cookie || '';

        }else{

            img.alt =
                'Không tải được CAPTCHA';

        }

    }catch(error){

        img.alt =

/* =========================================================
   TRA CỨU
========================================================= */

async function submitTracking(){

    const code =
        document
        .getElementById('trackingCode')
        .value
        .trim();


    const captcha =
        document
        .getElementById('captchaText')
        .value
        .trim();


    const btn =
        document
        .getElementById('btnSubmit');


    if(!code || !captcha){

        showMsg(
            'Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.'
        );

        return;

    }


    btn.disabled = true;

    btn.textContent =
        '⏳ Đang tra cứu...';


    try{

        const res =
            await fetch(
                '/api/proxy?action=track',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({

                        trackingCode:code,

                        captchaText:captcha,

                        cookie:currentCookie

                    })
                }
            );


        const data =
            await res.json();


        if(
            data &&
            data.info &&
            data.info.ID
        ){

            currentTrackingCode =
                data.info.ID;

            currentData =
                data;


            renderScreen(data);

            renderPrint(data);


            document
                .getElementById('result-card')
                .style.display = 'block';


            document
                .getElementById('result')
                .style.display = 'flex';


            showMsg(
                'Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.',
                'ok'
            );


            document
                .getElementById('result-card')
                .scrollIntoView({
                    behavior:'smooth',
                    block:'start'
                });


        }else{

            showMsg(
                'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.'
            );


            document
                .getElementById('captchaText')
                .value = '';


            loadCaptcha();

        }


    }catch(error){

        showMsg(
            'Lỗi tra cứu: ' +
            error.message
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
            '🔎 Tra cứu vận đơn';

    }

}

function openMap(
    address,
    title,
    coords
){

    const panel =
        document.getElementById(
            'map-panel'
        );


    panel.classList.add('show');


    document
        .getElementById('map-title')
        .textContent =
            title +
            ' — ' +
            address;


    const q =
        coords
        ? `${coords.lat},${coords.lng}`
        : address;


    const mapsUrl =
        'https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(q);


    document
        .getElementById('map-link')
        .href =
            mapsUrl;


    document
        .getElementById('map-frame')
        .src =
            'https://www.google.com/maps?q=' +
            encodeURIComponent(q) +
            '&output=embed';


    panel.scrollIntoView({
        behavior:'smooth',
        block:'nearest'
    });

}

/* =========================================================
   TẢI PDF
========================================================= */

async function downloadPDF(){

    if(!currentData){

        alert(
            'Chưa có dữ liệu vận đơn để tải PDF.'
        );

        return;

    }


    const element =
        document.getElementById(
            'print-area'
        );


    /*
       Lưu trạng thái hiện tại
    */

    const oldDisplay =
        element.style.display;


    element.style.display =
        'block';


    try{

        const opt = {

            margin:0,

            filename:
                `VanDon_VNPost_${
                    currentTrackingCode ||
                    '247'
                }.pdf`,

            image:{
                type:'jpeg',
                quality:0.72
            },

            html2canvas:{

                scale:1.25,

                useCORS:true,

                allowTaint:false,

                backgroundColor:'#ffffff',

                logging:false,

                imageTimeout:5000

            },

            jsPDF:{

                unit:'mm',

                format:'a4',

                orientation:'portrait',

                compress:true

            },

            pagebreak:{

                mode:[
                    'css',
                    'legacy'
                ],

                avoid:[
                    '.p-event'
                ]

            }

        };


        await html2pdf()
            .set(opt)
            .from(element)
            .save();


    }catch(error){

        console.error(
            'PDF error:',
            error
        );

        alert(
            'Không thể tạo PDF: ' +
            error.message
        );

    }finally{

        element.style.display =
            oldDisplay;

    }

}
