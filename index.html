<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InVanDon247 - Tra cứu VNPost</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f3f6f9;
    color: #263238;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

button,
input {
    font-family: inherit;
}

/* =========================================================
   HEADER WEB
========================================================= */

.site-header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: flex;
    align-items: center;
}

.header-inner {
    width: 1200px;
    max-width: calc(100% - 32px);
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 58px;
    height: auto;
    display: block;
}

.brand-text strong {
    display: block;
    color: #00549a;
    font-size: 19px;
    line-height: 22px;
}

.brand-text span {
    display: block;
    color: #777;
    font-size: 10px;
    margin-top: 2px;
}

.site-nav {
    display: flex;
    gap: 26px;
    align-items: center;
}

.site-nav a {
    color: #444;
    text-decoration: none;
    font-size: 13px;
}

.site-nav a:hover {
    color: #0066b3;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    width: 1200px;
    max-width: calc(100% - 32px);
    margin: 20px auto 50px;
}

/* =========================================================
   SEARCH BOX
========================================================= */

.search-box {
    background: #fff;
    border-radius: 8px;
    padding: 22px 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    border: 1px solid #e3e7eb;
}

.search-title {
    text-align: center;
    margin-bottom: 18px;
}

.search-title h1 {
    margin: 0;
    color: #0065ad;
    font-size: 21px;
}

.search-title p {
    margin: 5px 0 0;
    color: #777;
    font-size: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: 12px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 12px;
    margin-bottom: 6px;
    color: #333;
}

.form-group input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid #cfd5da;
    border-radius: 5px;
    outline: none;
    font-size: 13px;
}

.form-group input:focus {
    border-color: #0065ad;
    box-shadow: 0 0 0 2px rgba(0,101,173,.08);
}

.captcha-row {
    display: flex;
    gap: 7px;
}

.captcha-row input {
    flex: 1;
}

.captcha-box {
    width: 100px;
    height: 40px;
    border: 1px solid #cfd5da;
    border-radius: 5px;
    background: #f7f7f7;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.captcha-box img {
    max-width: 100%;
    max-height: 100%;
    display: block;
}

.btn-reload {
    height: 40px;
    padding: 0 13px;
    border: 0;
    background: #eee;
    color: #333;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.btn-reload:hover {
    background: #ddd;
}

.btn-submit {
    width: 100%;
    height: 40px;
    margin-top: 14px;
    border: 0;
    border-radius: 5px;
    background: #0068b7;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-submit:hover {
    background: #005493;
}

.btn-submit:disabled {
    opacity: .7;
    cursor: wait;
}

/* =========================================================
   ACTION BAR
========================================================= */

.action-bar {
    display: none;
    justify-content: flex-end;
    gap: 8px;
    margin: 12px 0;
}

.action-btn {
    border: 0;
    border-radius: 5px;
    padding: 8px 17px;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}

.btn-print {
    background: #16864a;
}

.btn-print:hover {
    background: #116d3c;
}

.btn-pdf {
    background: #0068b7;
}

.btn-pdf:hover {
    background: #005493;
}

/* =========================================================
   RESULT
========================================================= */

#result-wrapper {
    display: none;
    background: #fff;
    border: 1px solid #e1e5e8;
    border-radius: 7px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    padding: 12px;
}

/* =========================================================
   WEB RESULT HEADER
========================================================= */

.web-result-top {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: #f3f4f5;
    min-height: 54px;
    align-items: center;
    margin-bottom: 10px;
}

.web-top-item {
    padding: 7px 15px;
    border-right: 1px solid #e2e2e2;
}

.web-top-item:last-child {
    border-right: 0;
}

.web-top-label {
    color: #777;
    font-size: 11px;
    margin-bottom: 3px;
}

.web-top-value {
    font-size: 13px;
    font-weight: bold;
    color: #17324d;
}

.web-top-status {
    color: #00854a;
}

/* =========================================================
   BASIC INFORMATION
========================================================= */

.basic-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 35px;
    row-gap: 8px;
    padding: 4px 12px 13px;
}

.basic-item {
    display: grid;
    grid-template-columns: 125px 1fr;
    font-size: 12px;
    line-height: 20px;
}

.basic-label {
    font-weight: bold;
    color: #333;
}

.basic-value {
    color: #555;
}

/* =========================================================
   SECTION TITLE
========================================================= */

.section-title {
    font-size: 12px;
    font-weight: bold;
    color: #4b535b;
    margin: 10px 0 8px;
    text-transform: uppercase;
}

/* =========================================================
   TIMELINE WEB - GIỐNG VNPOST
========================================================= */

.timeline {
    position: relative;
    margin: 0 6px 14px;
    padding: 0 0 0 26px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 7px;
    bottom: 7px;
    width: 2px;
    background: #aab2b8;
}

.timeline-item {
    position: relative;
    display: grid;
    grid-template-columns: 155px minmax(0, 1.45fr) minmax(240px, 1fr) 35px;
    column-gap: 10px;
    padding: 5px 0 8px;
    min-height: 47px;
}

.timeline-dot {
    position: absolute;
    left: -22px;
    top: 10px;
    width: 12px;
    height: 12px;
    background: #fff;
    border: 2px solid #777;
    border-radius: 50%;
}

.timeline-item.latest .timeline-dot {
    border-color: #00a65a;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(0,166,90,.08);
}

.timeline-date {
    font-size: 11px;
    color: #37474f;
    padding-top: 1px;
}

.timeline-status {
    font-size: 11px;
    color: #333;
    line-height: 17px;
}

.timeline-item.latest .timeline-status {
    color: #00864a;
    font-weight: bold;
}

.timeline-pos {
    font-size: 11px;
    color: #555;
    line-height: 17px;
}

.timeline-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
}

.location-btn {
    border: 0;
    background: transparent;
    color: #4d70ff;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 2px;
}

.location-btn:hover {
    color: #174cff;
    transform: scale(1.1);
}

/* =========================================================
   DELIVERY INFO
========================================================= */

.delivery-section {
    margin-top: 8px;
}

.delivery-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}

.delivery-table th {
    background: #edf2f7;
    color: #4a5568;
    font-weight: bold;
    text-align: left;
    padding: 8px 10px;
    border: 1px solid #e1e7ec;
}

.delivery-table td {
    padding: 8px 10px;
    border: 1px solid #e1e7ec;
    vertical-align: top;
}

.delivery-table th:nth-child(1) {
    width: 22%;
}

.delivery-table th:nth-child(2) {
    width: 22%;
}

.delivery-table th:nth-child(3) {
    width: 56%;
}

/* =========================================================
   MAP
========================================================= */

.map-container {
    display: none;
    margin-top: 10px;
    border: 1px solid #d5dce2;
    border-radius: 5px;
    overflow: hidden;
    background: #fff;
}

.map-header {
    min-height: 42px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    background: #fff;
    border-bottom: 1px solid #ddd;
}

.map-title {
    font-size: 12px;
    line-height: 17px;
    font-weight: bold;
    color: #273746;
}

.map-link {
    white-space: nowrap;
    color: #0068b7;
    font-size: 11px;
    text-decoration: none;
    font-weight: bold;
}

.map-frame {
    width: 100%;
    height: 390px;
    border: 0;
    display: block;
}

/* =========================================================
   FOOTER
========================================================= */

.result-footer {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
    text-align: center;
    color: #9aa3aa;
    font-size: 9px;
}

/* =========================================================
   PRINT AREA
========================================================= */

#print-content {
    display: none;
}

/* =========================================================
   A4 DOCUMENT
========================================================= */

.a4-document {
    width: 190mm;
    margin: 0 auto;
    background: white;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

.a4-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    border-bottom: 1.2px solid #0065ad;
    padding-bottom: 3mm;
    margin-bottom: 2.5mm;
}

.a4-logo {
    width: 34mm;
    height: auto;
    display: block;
}

.a4-meta {
    text-align: right;
    font-size: 7.5pt;
    line-height: 1.5;
    color: #555;
}

.a4-title-box {
    border: 1px solid #c8d1d9;
    text-align: center;
    padding: 2mm 3mm;
    margin-bottom: 2.5mm;
}

.a4-title {
    font-size: 10.5pt;
    font-weight: bold;
    color: #17324d;
}

.a4-code {
    font-size: 12pt;
    font-weight: bold;
    color: #b87900;
    margin-top: 1mm;
    letter-spacing: .7px;
}

.a4-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5mm;
    margin-bottom: 2.5mm;
}

.a4-card {
    border: 1px solid #cbd5df;
    padding: 2mm 2.5mm;
    min-height: 25mm;
}

.a4-card-title {
    color: #0065ad;
    font-weight: bold;
    font-size: 7.8pt;
    border-bottom: 1px dashed #cbd5df;
    padding-bottom: 1mm;
    margin-bottom: 1.5mm;
    text-transform: uppercase;
}

.a4-row {
    display: grid;
    grid-template-columns: 28mm 1fr;
    font-size: 7.6pt;
    line-height: 1.45;
}

.a4-label {
    color: #68737d;
}

.a4-value {
    font-weight: bold;
    color: #1e2933;
}

.a4-status {
    color: #00854a;
    font-weight: bold;
}

/* =========================================================
   A4 TIMELINE - 2 CỘT
========================================================= */

.a4-section-title {
    font-size: 8.3pt;
    font-weight: bold;
    color: #263746;
    border-left: 1.2mm solid #0065ad;
    padding-left: 1.5mm;
    margin: 2mm 0 1.5mm;
    text-transform: uppercase;
}

.a4-history {
    column-count: 2;
    column-gap: 5mm;
    column-rule: 1px solid #d8dee3;
}

.a4-event {
    break-inside: avoid;
    page-break-inside: avoid;
    padding: 1.2mm 1mm 1.3mm 0;
    border-bottom: 1px dashed #d9dee2;
    min-height: 13mm;
}

.a4-event-time {
    font-size: 7pt;
    font-weight: bold;
    color: #4c5963;
    margin-bottom: .7mm;
}

.a4-event-status {
    font-size: 7pt;
    line-height: 1.32;
    color: #202a32;
}

.a4-event-pos {
    margin-top: .5mm;
    font-size: 6.7pt;
    color: #596771;
}

.a4-event.latest .a4-event-time {
    color: #00854a;
}

.a4-event.latest .a4-event-status {
    color: #00854a;
    font-weight: bold;
}

.a4-delivery-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 7.2pt;
    margin-top: 1mm;
}

.a4-delivery-table th {
    background: #edf2f7;
    padding: 1.5mm 2mm;
    text-align: left;
    border: 1px solid #cfd8df;
}

.a4-delivery-table td {
    padding: 1.5mm 2mm;
    border: 1px solid #cfd8df;
    vertical-align: top;
}

.a4-footer {
    margin-top: 3mm;
    padding-top: 1.5mm;
    border-top: 1px solid #dce2e6;
    text-align: center;
    font-size: 6.5pt;
    color: #8b969d;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 800px) {

    .site-nav {
        display: none;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .web-result-top {
        grid-template-columns: 1fr;
    }

    .web-top-item {
        border-right: 0;
        border-bottom: 1px solid #e2e2e2;
    }

    .basic-info {
        grid-template-columns: 1fr;
    }

    .timeline-item {
        grid-template-columns: 110px minmax(0,1fr) 32px;
    }

    .timeline-pos {
        grid-column: 2;
        padding-top: 2px;
    }

    .timeline-arrow {
        grid-column: 3;
        grid-row: 1 / span 2;
    }

    .map-frame {
        height: 320px;
    }
}

/* =========================================================
   PRINT
========================================================= */

@media print {

    html,
    body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    body {
        font-size: 8pt;
    }

    .site-header,
    .main > .search-box,
    .action-bar,
    #result-wrapper {
        display: none !important;
    }

    #print-content {
        display: block !important;
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .a4-document {
        width: 100%;
        margin: 0;
    }

    .a4-header {
        margin-top: 0;
    }

    @page {
        size: A4 portrait;
        margin: 8mm 10mm 8mm 10mm;
    }

    .a4-history,
    .a4-event {
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .a4-event {
        break-inside: avoid-column;
    }

    .a4-delivery-table,
    .a4-card,
    .a4-title-box {
        break-inside: avoid;
        page-break-inside: avoid;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     WEB HEADER
========================================================= -->

<header class="site-header">
    <div class="header-inner">

        <div class="brand">
            <img
                src="https://vnpost.vn/images/logo-vnpost.png"
                alt="Vietnam Post"
                onerror="this.src='https://vietnampost.vn/images/logo.png';"
            >

            <div class="brand-text">
                <strong>InVanDon247</strong>
                <span>Công cụ tra cứu và tạo phiếu vận đơn A4</span>
            </div>
        </div>

        <nav class="site-nav">
            <a href="#">Trang chủ</a>
            <a href="#tra-cuu">Tra cứu</a>
            <a href="#huong-dan">Hướng dẫn</a>
            <a href="#gioi-thieu">Giới thiệu</a>
        </nav>

    </div>
</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

    <!-- SEARCH -->
    <section class="search-box no-print" id="tra-cuu">

        <div class="search-title">
            <h1>TRA CỨU VẬN ĐƠN</h1>
            <p>Nhập mã vận đơn và mã CAPTCHA để xem hành trình bưu gửi</p>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>1. Mã vận đơn VNPost</label>

                <input
                    type="text"
                    id="trackingCode"
                    placeholder="Ví dụ: RB608631891VN"
                >
            </div>

            <div class="form-group">

                <label>2. Mã xác thực (CAPTCHA)</label>

                <div class="captcha-row">

                    <input
                        type="text"
                        id="captchaText"
                        placeholder="Nhập mã CAPTCHA"
                    >

                    <div class="captcha-box">
                        <img
                            id="captchaImg"
                            src=""
                            alt="CAPTCHA"
                        >
                    </div>

                    <button
                        type="button"
                        class="btn-reload"
                        onclick="loadCaptcha()"
                    >
                        ↻ Đổi mã
                    </button>

                </div>

            </div>

        </div>

        <button
            type="button"
            class="btn-submit"
            id="btnSubmit"
            onclick="submitTracking()"
        >
            🔎 Tra cứu vận đơn
        </button>

    </section>


    <!-- ACTION BAR -->

    <div
        class="action-bar no-print"
        id="actionBar"
    >

        <button
            class="action-btn btn-print"
            onclick="printA4()"
        >
            🖨 In A4
        </button>

        <button
            class="action-btn btn-pdf"
            onclick="downloadPDF()"
        >
            📥 Tải xuống PDF
        </button>

    </div>


    <!-- RESULT -->

    <section id="result-wrapper">
        <div id="web-result"></div>
    </section>


    <!-- =====================================================
         PRINT DOCUMENT
    ====================================================== -->

    <div id="print-content"></div>

</main>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return '';
    }

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* =========================================================
   LẤY GIÁ TRỊ THEO NHIỀU TÊN FIELD
========================================================= */

function getField(obj, keys, fallback = '') {

    if (!obj || typeof obj !== 'object') {
        return fallback;
    }

    for (const key of keys) {

        if (
            obj[key] !== undefined &&
            obj[key] !== null &&
            String(obj[key]).trim() !== ''
        ) {
            return obj[key];
        }
    }

    return fallback;
}


/* =========================================================
   TẢI CAPTCHA
========================================================= */

async function loadCaptcha() {

    const img = document.getElementById('captchaImg');

    img.src = '';
    img.alt = 'Đang tải...';

    try {

        const res = await fetch(
            '/api/proxy?action=get-captcha',
            {
                cache: 'no-store'
            }
        );

        const data = await res.json();

        if (data && data.captchaUrl) {

            img.src = data.captchaUrl;

            currentCookie = data.cookie || '';

        } else {

            img.alt = 'Không tải được CAPTCHA';
        }

    } catch (error) {

        console.error(error);

        img.alt = 'Lỗi kết nối CAPTCHA';
    }
}


/* =========================================================
   TRA CỨU
========================================================= */

async function submitTracking() {

    const code =
        document.getElementById('trackingCode')
            .value
            .trim()
            .toUpperCase();

    const captcha =
        document.getElementById('captchaText')
            .value
            .trim();

    const btn =
        document.getElementById('btnSubmit');


    if (!code || !captcha) {

        alert(
            'Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA!'
        );

        return;
    }


    btn.disabled = true;
    btn.innerText = '⏳ Đang tra cứu...';


    try {

        const res = await fetch(
            '/api/proxy?action=track',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    trackingCode: code,

                    captchaText: captcha,

                    cookie: currentCookie

                })
            }
        );


        const data = await res.json();


        btn.disabled = false;
        btn.innerText = '🔎 Tra cứu vận đơn';


        if (
            data &&
            data.info &&
            data.info.ID
        ) {

            currentData = data;

            currentTrackingCode = data.info.ID;

            renderWebResult(data);

            renderPrintDocument(data);


            document.getElementById(
                'result-wrapper'
            ).style.display = 'block';


            document.getElementById(
                'actionBar'
            ).style.display = 'flex';


            document.getElementById(
                'result-wrapper'
            ).scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

        } else {

            alert(
                'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.'
            );

            document.getElementById(
                'captchaText'
            ).value = '';

            loadCaptcha();
        }


    } catch (error) {

        console.error(error);

        btn.disabled = false;

        btn.innerText = '🔎 Tra cứu vận đơn';

        alert(

/* =========================================================
   CHUẨN HÓA LỊCH TRÌNH
========================================================= */

function normalizeLocate(data) {

    let locate = [];

    if (
        data &&
        Array.isArray(data.locate)
    ) {

        locate = data.locate
            .filter(item => item && typeof item === 'object')
            .map((item, index) => {

                const date = getField(
                    item,
                    [
                        'Date',
                        'DATE',
                        'date',
                        'Ngay',
                        'NGAY'
                    ],
                    ''
                );

                const time = getField(
                    item,
                    [
                        'TimeDetail',
                        'TIME',
                        'Time',
                        'time',
                        'Gio',
                        'GIO'
                    ],
                    ''
                );

                const status = getField(
                    item,
                    [
                        'StatusText',
                        'STATUSTEXT',
                        'statusText',
                        'Status',
                        'STATUS',
                        'NoiDung',
                        'NOIDUNG'
                    ],
                    ''
                );

                const posCode = getField(
                    item,
                    [
                        'POSCode',
                        'POSCODE',
                        'PosCode',
                        'posCode',
                        'MA_BC',
                        'MABUCUC',
                        'MaBuuCuc'
                    ],
                    ''
                );

                const position = getField(
                    item,
                    [
                        'VI_TRI',
                        'VI_TRI_TEXT',
                        'ViTri',
                        'Location',
                        'LOCATION',
                        'Address',
                        'ADDRESS'
                    ],
                    ''
                );

                const lat = getField(
                    item,
                    [
                        'LAT',
                        'Lat',
                        'lat',
                        'Latitude',
                        'latitude'
                    ],
                    ''
                );

                const lng = getField(
                    item,
                    [
                        'LNG',
                        'Lng',
                        'lng',
                        'Longitude',
                        'longitude',
                        'LONGITUDE'
                    ],
                    ''
                );


                return {

                    originalIndex: index,

                    date: date,

                    time: time,

                    datetime: (
                        String(date) +
                        ' ' +
                        String(time)
                    ).trim(),

                    status: status,

                    posCode: posCode,

                    position: position,

                    lat: lat,

                    lng: lng
                };

            });
    }


    /*
       QUAN TRỌNG:

       Không dùng reverse() mù quáng.

       Kiểm tra thứ tự dữ liệu hiện tại.
       Nếu API đã trả cũ -> mới thì giữ nguyên.
    */

    function dateValue(item) {

        const raw =
            `${item.date} ${item.time}`;

        const m =
            raw.match(
                /(\d{2})\/(\d{2})\/(\d{4})\s*(\d{2})?:?(\d{2})?:?(\d{2})?/
            );

        if (!m) {
            return 0;
        }

        return new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1]),
            Number(m[4] || 0),
            Number(m[5] || 0),
            Number(m[6] || 0)
        ).getTime();
    }


    const hasDates =
        locate.filter(
            item => dateValue(item) > 0
        ).length >= 2;


    if (hasDates) {

        /*
           Sắp xếp chính xác theo thời gian:
           CŨ -> MỚI
        */

        locate.sort(
            (a, b) =>
                dateValue(a) - dateValue(b)
        );
    }


    return locate;
}


/* =========================================================
   TÌM SỰ KIỆN PHÁT THÀNH CÔNG CUỐI
========================================================= */

function findDeliveredEvent(locate) {

    if (!locate || !locate.length) {
        return null;
    }


    const keywords = [
        'phát thành công',
        'delivered',
        'đã phát',
        'phat thanh cong'
    ];


    for (
        let i = locate.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            String(locate[i].status || '')
                .toLowerCase();

        if (
            keywords.some(
                keyword =>
                    text.includes(keyword)
            )
        ) {

            return locate[i];
        }
    }


    return locate[locate.length - 1];
}


/* =========================================================
   LẤY DELIVERY INFO - CÓ FALLBACK
========================================================= */

function normalizeDelivery(data, locate) {

    let result = [];


    /*
       1. ƯU TIÊN data.delivery
    */

    if (
        data &&
        Array.isArray(data.delivery)
    ) {

        data.delivery.forEach(item => {

            if (!item || typeof item !== 'object') {
                return;
            }


            const date =
                getField(
                    item,
                    [
                        'Date',
                        'DATE',
                        'date',
                        'Ngay',
                        'NGAY'
                    ],
                    ''
                );


            const time =
                getField(
                    item,
                    [
                        'Time',
                        'TIME',
                        'TimeDetail',
                        'time',
                        'Gio',
                        'GIO'
                    ],
                    ''
                );


            const office =
                getField(
                    item,
                    [
                        'POSCode',
                        'POSCODE',
                        'PosCode',
                        'BC_PHAT',
                        'BCPhat',
                        'BuuCuc',
                        'BUUCUC',
                        'Office',
                        'OFFICE'
                    ],
                    ''
                );


            const detail =
                getField(
                    item,
                    [
                        'STATUSTEXT',
                        'StatusText',
                        'Status',
                        'STATUS',
                        'Content',
                        'CONTENT',
                        'Detail',
                        'DETAIL',
                        'NoiDung',
                        'NOIDUNG'
                    ],
                    ''
                );


            if (
                date ||
                time ||
                office ||
                detail
            ) {

                result.push({

                    date: date,

                    time: time,

                    office: office,

                    detail: detail
                });
            }

        });
    }


    /*
       2. NẾU DELIVERY KHÔNG ĐỦ
          => lấy sự kiện phát thành công từ LOCATE
    */

    const delivered =
        findDeliveredEvent(locate);


    if (delivered) {

        const existing =
            result.some(item => {

                const a =
                    `${item.date} ${item.time} ${item.detail}`
                        .toLowerCase();

                const b =
                    `${delivered.date} ${delivered.time} ${delivered.status}`
                        .toLowerCase();

                return (
                    a.includes(
                        String(delivered.date).toLowerCase()
                    ) &&
                    (
                        a.includes(
                            String(delivered.time).toLowerCase()
                        ) ||
                        a.includes(
                            String(delivered.status).toLowerCase()
                        )
                    )
                );
            });


        /*
           Nếu delivery không có dòng tương ứng,
           thêm dòng fallback.
        */

        if (!existing) {

            result.push({

                date: delivered.date,

                time: delivered.time,

                office:
                    delivered.posCode
                    ? delivered.posCode
                    : '-',

                detail:
                    delivered.status || '-'
            });
        }
    }


    /*
       3. Nếu vẫn rỗng nhưng locate có dữ liệu
    */

    if (
        result.length === 0 &&
        locate.length > 0
    ) {

        const last =
            locate[locate.length - 1];


        result.push({

            date: last.date,

            time: last.time,

            office:
                last.posCode || '-',

            detail:
                last.status || '-'
        });
    }


    /*
       Sắp xếp DELIVERY theo cũ -> mới
    */

    return result;
}


/* =========================================================
   TẠO LINK GOOGLE MAPS
========================================================= */

function getGoogleMapsUrl(item) {

    if (
        item &&
        item.lat !== '' &&
        item.lng !== '' &&
        !isNaN(Number(item.lat)) &&
        !isNaN(Number(item.lng))
    ) {

        return (
            'https://www.google.com/maps/search/?api=1&query=' +
            encodeURIComponent(
                item.lat + ',' + item.lng
            )
        );
    }


    const query =
        item.position ||
        item.posCode ||
        'Vietnam Post';


    return (
        'https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(query)
    );
}

   HIỂN THỊ MAP
========================================================= */

function showMap(index) {

    const locate =
        normalizeLocate(currentData);

    const item =
        locate[index];


    if (!item) {
        return;
    }


    const mapContainer =
        document.getElementById(
            'map-container'
        );


    const mapFrame =
        document.getElementById(
            'map-frame'
        );


    const mapTitle =
        document.getElementById(
            'map-title'
        );


    const mapLink =
        document.getElementById(
            'map-link'
        );


    const url =
        getGoogleMapsUrl(item);


    const embedUrl =
        url.replace(
            '/search/?api=1&query=',
            '/search?api=1&query='
        );


    mapTitle.textContent =
        (
            item.status ||
            'Vị trí bưu cục'
        ) +
        (
            item.posCode
                ? ' — Mã bưu cục: ' + item.posCode
                : ''
        ) +
        (
            item.position
                ? ' — ' + item.position
                : ''
        );


    mapLink.href = url;


    mapFrame.src =
        'https://www.google.com/maps?q=' +
        encodeURIComponent(
            (
                item.lat &&
                item.lng
            )
                ? `${item.lat},${item.lng}`
                : (
                    item.position ||
                    item.posCode ||
                    'Vietnam Post'
                )
        ) +
        '&output=embed';


    mapContainer.style.display =
        'block';


    mapContainer.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
    });
}

    ).innerHTML = html;
}


/* =========================================================
   IN A4
========================================================= */

function printA4() {

    if (!currentData) {

        alert(
            'Chưa có dữ liệu để in.'
        );

        return;
    }


    renderPrintDocument(
        currentData
    );


    /*
       Đợi trình duyệt render xong
       rồi mới mở hộp thoại in.
    */

    setTimeout(() => {

        window.print();

    }, 250);
}


/* =========================================================
   TẢI PDF
========================================================= */

async function downloadPDF() {

    if (!currentData) {

        alert(
            'Chưa có dữ liệu để tải PDF.'
        );

        return;
    }


    renderPrintDocument(
        currentData
    );


    const element =
        document.getElementById(
            'print-content'
        );


    /*
       Lấy document A4 thật.
    */

    const documentElement =
        element.querySelector(
            '.a4-document'
        );


    if (!documentElement) {

        alert(
            'Không tạo được nội dung PDF.'
        );

        return;
    }


    /*
       Hiển thị tạm để html2canvas
       đo đúng kích thước.
    */

    const oldDisplay =
        element.style.display;

    const oldWidth =
        element.style.width;


    element.style.display = 'block';

    element.style.width = '190mm';


    await new Promise(
        resolve =>
            requestAnimationFrame(
                () => requestAnimationFrame(resolve)
            )
    );


    const filename =
        `VanDon_VNPost_${currentTrackingCode || 'InVanDon247'}.pdf`;


    const options = {

        margin: [
            8,
            10,
            8,
            10
        ],

        filename: filename,

        image: {
            type: 'jpeg',
            quality: 0.86
        },

        html2canvas: {

            scale: 1.45,

            useCORS: true,

            allowTaint: false,

            backgroundColor: '#ffffff',

            logging: false,

            imageTimeout: 5000

        },

        jsPDF: {

            unit: 'mm',

            format: 'a4',

            orientation: 'portrait',

            compress: true

        },

        pagebreak: {

            mode: [
                'css',
                'legacy'
            ],

            avoid: [
                '.a4-event',
                '.a4-card',
                '.a4-delivery-table'
            ]

        }

    };


    try {

        await html2pdf()
            .set(options)
            .from(documentElement)
            .save();

    } catch (error) {

        console.error(error);

        alert(
            'Không thể tạo file PDF: ' +
            error.message
        );

    }


    element.style.display =
        oldDisplay;

    element.style.width =
        oldWidth;
}
