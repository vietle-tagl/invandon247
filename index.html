<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InVanDon247 - Tra cứu VNPost</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --blue:#07579b;
  --blue2:#0b6bb8;
  --orange:#f6a000;
  --green:#148a4b;
  --bg:#f3f5f7;
  --text:#3f464d;
  --muted:#7b838c;
  --line:#dfe4e8
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  font-family:Arial,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text)
}


/* =========================================================
   HEADER
========================================================= */

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 max(24px,calc((100% - 1100px)/2));
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none
}

.brand-logo{
  width:72px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 72px;
  overflow:hidden
}

.brand-logo img{
  width:72px;
  height:48px;
  object-fit:contain;
  display:block
}

.brand strong{
  font-size:18px;
  color:var(--blue)
}

.brand small{
  display:block;
  color:#888;
  font-size:10px;
  margin-top:2px
}

.nav{
  display:flex;
  gap:25px;
  font-size:12px
}

.nav a{
  color:#444;
  text-decoration:none
}

.nav a:hover{
  color:var(--blue)
}


/* =========================================================
   PAGE
========================================================= */

.page{
  max-width:1100px;
  margin:22px auto 50px;
  padding:0 14px
}


/* =========================================================
   SEARCH
========================================================= */

.search-card{
  background:#fff;
  border:1px solid #e1e5e8;
  border-radius:9px;
  padding:20px 22px;
  box-shadow:0 4px 18px rgba(0,0,0,.06)
}

.search-title{
  text-align:center;
  color:var(--blue);
  font-size:20px;
  font-weight:700;
  margin:0
}

.search-sub{
  text-align:center;
  color:#888;
  font-size:11px;
  margin:5px 0 18px
}

.form-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:12px
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px
}

.field input{
  width:100%;
  height:38px;
  border:1px solid #cfd5da;
  border-radius:5px;
  padding:0 11px;
  font-size:13px;
  outline:none
}

.field input:focus{
  border-color:var(--blue)
}


/* =========================================================
   CAPTCHA
========================================================= */

.captcha-line{
  display:flex;
  gap:6px
}

.captcha-line input{
  flex:1
}

.captcha-slot{
  width:100px;
  height:38px;
  flex:0 0 100px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  overflow:hidden
}

.captcha-img{
  width:100px;
  height:38px;
  border:1px solid #cfd5da;
  border-radius:5px;
  object-fit:contain;
  background:#fff;
  display:none
}

.captcha-img.loaded{
  display:block
}

.reload{
  border:0;
  background:#f0f1f2;
  border-radius:5px;
  padding:0 11px;
  cursor:pointer;
  font-size:12px;
  white-space:nowrap
}

.reload:disabled{
  opacity:.6;
  cursor:wait
}


/* =========================================================
   BUTTON
========================================================= */

.submit{
  width:100%;
  height:40px;
  margin-top:13px;
  border:0;
  border-radius:5px;
  background:var(--blue2);
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.submit:disabled{
  opacity:.6;
  cursor:wait
}


/* =========================================================
   MESSAGE
========================================================= */

.msg{
  margin-top:10px;
  padding:9px 12px;
  border-radius:5px;
  font-size:12px;
  display:none
}

.msg.error{
  display:block;
  background:#fff0f1;
  color:#b4232e
}

.msg.ok{
  display:block;
  background:#eefaf3;
  color:#137441
}

.msg.wait{
  display:block;
  background:#f3f8fc;
  color:#25638b
}


/* =========================================================
   RESULT BUTTON
========================================================= */

.result-head{
  display:none;
  justify-content:flex-end;
  gap:7px;
  margin:14px 0 10px
}

.action{
  border:0;
  border-radius:5px;
  padding:9px 14px;
  color:#fff;
  font-weight:700;
  font-size:12px;
  cursor:pointer
}

.print-btn{
  background:#148a4b
}

.pdf-btn{
  background:#0767b1
}


/* =========================================================
   RESULT
========================================================= */

.result-card{
  background:#fff;
  border:1px solid #e0e5e9;
  border-radius:8px;
  padding:0 16px 18px;
  box-shadow:0 3px 14px rgba(0,0,0,.05);
  display:none
}

.summary-strip{
  background:#f4f5f6;
  margin:16px -8px 12px;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  font-size:12px;
  border-radius:6px;
  border:1px solid #e2e8f0
}

.summary-item{
  display:flex;
  align-items:center;
  gap:8px
}

.summary-icon{
  font-size:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center
}

.summary-item b{
  color:#0d3f6d
}

.summary-item .status{
  color:var(--green);
  font-weight:700
}

.section-title{
  font-size:12px;
  font-weight:700;
  color:#4e555c;
  margin:16px 8px 10px;
  text-transform:uppercase
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  position:relative;
  margin:0 8px
}

.timeline:before{
  content:"";
  position:absolute;
  left:8px;
  top:7px;
  bottom:7px;
  width:2px;
  background:#aeb4b9
}

.event{
  position:relative;
  display:grid;
  grid-template-columns:185px minmax(0,1.4fr) minmax(230px,1fr) 30px;
  gap:12px;
  padding:0 0 12px 0;
  min-height:54px
}

.event-dot{
  position:absolute;
  left:4px;
  top:6px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#5b6166;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #5b6166
}

.event.latest .event-dot{
  background:#0b9a55;
  box-shadow:0 0 0 1px #0b9a55
}

.event-time{
  padding-left:22px;
  font-size:11px;
  color:#555
}

.event-status{
  font-size:11px;
  line-height:1.35
}

.event-status b{
  display:block;
  color:#4a4f54;
  font-size:10px;
  margin-top:3px
}

.event.latest .event-status{
  color:#078443;
  font-weight:700
}

.event-location{
  font-size:11px;
  color:#5d646b;
  line-height:1.35
}

.map-btn{
  width:28px;
  height:28px;
  border:0;
  background:#fff;
  color:#536df1;
  cursor:pointer;
  font-size:17px;
  border-radius:50%
}

.map-btn:hover{
  background:#eef1ff
}


/* =========================================================
   MAP
========================================================= */

.map-panel{
  display:none;
  margin:16px 8px 14px;
  border:1px solid #d9dee3;
  border-radius:6px;
  overflow:hidden
}

.map-panel.show{
  display:block
}

.map-toolbar{
  height:38px;
  background:#f7f8f9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  font-size:11px
}

.map-toolbar b{
  color:#495057
}

.map-toolbar a{
  color:#0969b0;
  text-decoration:none
}

.map-frame{
  width:100%;
  height:300px;
  border:0;
  display:block
}


/* =========================================================
   DELIVERY
========================================================= */

.delivery{
  margin:12px 8px 0
}

.delivery table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
  table-layout:fixed
}

.delivery th{
  background:#edf1f5;
  text-align:left;
  padding:8px
}

.delivery td{
  border:1px solid #e1e5e9;
  padding:8px;
  vertical-align:top;
  line-height:1.35
}

.delivery th:nth-child(1),
.delivery td:nth-child(1){
  width:18%
}

.delivery th:nth-child(2),
.delivery td:nth-child(2){
  width:25%
}

.delivery th:nth-child(3),
.delivery td:nth-child(3){
  width:24%
}

.delivery th:nth-child(4),
.delivery td:nth-child(4){
  width:33%
}

.screen-footer{
  text-align:center;
  border-top:1px solid #e2e5e8;
  margin:14px 8px 0;
  padding-top:7px;
  color:#9aa1a8;
  font-size:9px
}


/* =========================================================
   PRINT AREA
========================================================= */

#print-area{
  display:none
}


/* =========================================================
   A4
========================================================= */

@page{
  size:A4 portrait;
  margin:8mm
}

.print-page{
  width:194mm;
  min-height:281mm;
  position:relative;
  page-break-after:always;
  padding:0
}

.print-page:last-child{
  page-break-after:auto
}

.print-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:2px solid var(--blue);
  padding-bottom:5px;
  margin-bottom:7px
}

.print-logo{
  width:62px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden
}

.print-logo img{
  width:62px;
  height:42px;
  object-fit:contain;
  display:block
}

.print-brand{
  font-size:13px;
  color:var(--blue);
  font-weight:700
}

.print-brand small{
  display:block;
  font-size:7px;
  color:#777;
  font-weight:400
}

.print-meta{
  text-align:right;
  font-size:7px;
  color:#777;
  line-height:1.5
}

.print-title{
  text-align:center;
  border:1px solid #cfd5db;
  padding:5px;
  margin-bottom:7px
}

.print-title b{
  font-size:11px
}

.print-code{
  font-size:12px;
  font-weight:700;
  color:#a66c00;
  margin-top:1px
}

.print-summary{
  margin-bottom:7px
}

.pbox{
  border:1px solid #cdd3d8;
  padding:6px
}

.pbox h4{
  font-size:8px;
  color:var(--blue);
  margin:0 0 4px;
  border-bottom:1px dashed #ddd;
  padding-bottom:2px
}

.pgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px
}

.prow{
  font-size:7.2px;
  line-height:1.45
}

.prow span{
  color:#777;
  display:inline-block;
  width:70px
}

.prow b{
  color:#30353a
}

.print-history-title{
  font-size:8px;
  font-weight:700;
  color:#333;
  border-left:3px solid var(--blue);
  padding-left:4px;
  margin:4px 0
}

.print-columns{
  column-count:2;
  column-gap:7mm;
  column-rule:1px solid #ddd
}

.p-event{
  break-inside:avoid;
  page-break-inside:avoid;
  border-bottom:1px dashed #ddd;
  padding:0 0 4px;
  margin:0 0 4px;
  font-size:7.1px;
  line-height:1.25
}

.p-time{
  font-weight:700;
  color:#555
}

.p-event.latest .p-time,
.p-event.latest .p-status{
  color:#087d42
}

.p-status{
  margin-top:1px
}

.p-meta{
  color:#555
}

.p-address{
  color:#555
}

.print-delivery{
  margin-top:7px
}

.print-delivery h4{
  font-size:8px;
  margin:0 0 3px
}

.print-delivery table{
  width:100%;
  border-collapse:collapse;
  font-size:7px;
  table-layout:fixed
}

.print-delivery th{
  background:#edf1f5;
  text-align:left;
  padding:3px
}

.print-delivery td{
  border:1px solid #d8dde2;
  padding:3px;
  vertical-align:top
}

.print-delivery th:nth-child(1),
.print-delivery td:nth-child(1){
  width:18%
}

.print-delivery th:nth-child(2),
.print-delivery td:nth-child(2){
  width:25%
}

.print-delivery th:nth-child(3),
.print-delivery td:nth-child(3){
  width:24%
}

.print-delivery th:nth-child(4),
.print-delivery td:nth-child(4){
  width:33%
}

.print-footer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  border-top:1px solid #ddd;
  padding-top:3px;
  text-align:center;
  font-size:6.5px;
  color:#999
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .topbar{
    padding:0 12px
  }

  .brand-logo{
    width:62px;
    flex-basis:62px
  }

  .brand-logo img{
    width:62px;
    height:44px
  }

  .nav{
    display:none
  }

  .form-grid,
  .summary-strip{
    grid-template-columns:1fr
  }

  .event{
    grid-template-columns:1fr 30px;
    gap:5px;
    padding-left:20px
  }

  .event-time{
    padding-left:0
  }

  .event-status,
  .event-location{
    grid-column:1
  }

  .event-location{
    padding-left:0
  }

  .event-dot{
    left:0
  }

  .timeline:before{
    left:4px
  }

  .result-head{
    justify-content:stretch
  }

  .action{
    flex:1
  }

  .delivery{
    overflow-x:auto
  }

  .delivery table{
    min-width:680px
  }
}


/* =========================================================
   PRINT
========================================================= */

@media print{

  body{
    background:#fff
  }

  .no-print,
  .topbar,
  .page>.search-card,
  .result-head,
  .result-card{
    display:none!important
  }

  #print-area{
    display:block!important
  }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header class="topbar no-print">

  <div class="brand">

    <div class="brand-logo" aria-label="Vietnam Post">

      <img
        src="https://cdn.haitrieu.com/wp-content/uploads/2022/01/Logo-VietNam-Post.png"
        alt="Vietnam Post"
        loading="eager"
        decoding="async"
        referrerpolicy="no-referrer"
      >

    </div>

    <div>
      <strong>InVanDon247</strong>
      <small>Công cụ tra cứu và tạo phiếu vận đơn A4</small>
    </div>

  </div>


  <nav class="nav">

    <a href="#">Trang chủ</a>
    <a href="#search">Tra cứu</a>
    <a href="#result">Hướng dẫn</a>
    <a href="#">Giới thiệu</a>

  </nav>

</header>



<!-- =======================================================
     MAIN
======================================================== -->

<main class="page">


<!-- =======================================================
     SEARCH
======================================================== -->

<section class="search-card no-print" id="search">

  <h1 class="search-title">
    TRA CỨU VẬN ĐƠN
  </h1>

  <div class="search-sub">
    Nhập mã vận đơn và mã CAPTCHA để xem hành trình bưu gửi
  </div>


  <div class="form-grid">


    <!-- MÃ VẬN ĐƠN -->

    <div class="field">

      <label>
        1. Mã vận đơn VNPost
      </label>

      <input
        id="trackingCode"
        type="text"
        placeholder="Ví dụ: RB608631891VN"
        autocomplete="off"
      >

    </div>



    <!-- CAPTCHA -->

    <div class="field">

      <label>
        2. Mã xác thực (CAPTCHA)
      </label>

      <div class="captcha-line">

        <input
          id="captchaText"
          type="text"
          placeholder="Nhập mã CAPTCHA"
          autocomplete="off"
        >

        <div class="captcha-slot">

          <img
            id="captchaImg"
            class="captcha-img"
            alt="CAPTCHA"
          >

        </div>


        <button
          id="reloadCaptcha"
          class="reload"
          type="button"
          onclick="loadCaptcha()"
        >
          ↻ Đổi mã
        </button>

      </div>

    </div>

  </div>


  <button
    id="btnSubmit"
    class="submit"
    type="button"
    onclick="submitTracking()"
  >
    🔎 Tra cứu vận đơn
  </button>


  <div id="message" class="msg"></div>

</section>



<!-- =======================================================
     RESULT ACTIONS
======================================================== -->

<div id="result" class="result-head no-print">

  <button
    class="action print-btn"
    onclick="printA4()"
  >
    🖨 In A4
  </button>

  <button
    class="action pdf-btn"
    onclick="downloadPDF()"
  >
    📥 Tải xuống PDF
  </button>

</div>



<!-- =======================================================
     RESULT CARD
======================================================== -->

<section
  id="result-card"
  class="result-card no-print"
>

  <div id="screen-result"></div>

</section>


</main>


<!-- =======================================================
     PRINT AREA
======================================================== -->

<div id="print-area"></div>



<script>


/* =========================================================
   GLOBAL
========================================================= */

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;

let captchaRequestId = 0;



/* =========================================================
   ESC HTML
========================================================= */

const esc = s =>
  String(s ?? '-')
  .replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );



/* =========================================================
   CLEAN STATUS
========================================================= */

function cleanStatus(s){

  return String(s || '-')
    .replace(
      /\s*\(\d{4,7}\s*:[^)]+\)/g,
      ''
    )
    .replace(/\s{2,}/g,' ')
    .trim();

}



/* =========================================================
   ADDRESS
========================================================= */

function getAddress(item){

  return typeof item?.VI_TRI === 'string' &&
         item.VI_TRI.trim()
    ? item.VI_TRI.trim()
    : '-';

}



/* =========================================================
   COORDINATES
========================================================= */

function getCoords(item){

  let lat =
    item?.LAT ??
    item?.Lat ??
    item?.latitude ??
    item?.Latitude;

  let lng =
    item?.LNG ??
    item?.Lon ??
    item?.LONG ??
    item?.longitude ??
    item?.Longitude;

  return lat && lng
    ? {lat,lng}
    : null;

}



/* =========================================================
   OFFICE
========================================================= */

function getOffice(item){

  const text = String(
    item?.StatusText ||
    item?.STATUSTEXT ||
    ''
  );

  const m = text.match(
    /\((\d{4,7})\s*:\s*([^)]*)\)/
  );

  if(m){

    return {
      code:m[1],
      name:m[2].trim(),
      full:m[1]+' - '+m[2].trim()
    };

  }


  const code =
    item?.POSCode ??
    item?.POSCODE ??
    item?.ToPOSCode ??
    '';


  return {
    code:String(code || '-'),
    name:'',
    full:String(code || '-')
  };

}



/* =========================================================
   OFFICE FOR DELIVERY
========================================================= */

function getOfficeForDelivery(data,d){

  const direct = getOffice({
    StatusText:
      d?.STATUSTEXT ||
      d?.StatusText,

    POSCode:
      d?.POSCODE ||
      d?.POSCode ||
      d?.ToPOSCode
  });


  if(direct.name){
    return direct;
  }


  const code = String(
    d?.ToPOSCode ||
    d?.POSCode ||
    d?.POSCODE ||
    direct.code ||
    ''
  ).trim();


  if(code){

    const found =
      (data?.locate || [])
      .slice()
      .reverse()
      .find(
        x =>
          String(
            x?.POSCode ||
            x?.POSCODE ||
            ''
          ).trim() === code
      );


    if(found){
      return getOffice(found);
    }

  }


  return direct;

}



/* =========================================================
   DELIVERY RECORD
========================================================= */

function getDeliveryRecord(data){

  const list =
    Array.isArray(data?.delivery)
      ? data.delivery
      : [];


  if(!list.length){
    return null;
  }


  return list.find(
    d =>
      /phát thành công|delivered/i.test(
        String(
          d?.STATUSTEXT ||
          d?.StatusText ||
          ''
        )
      )
  ) || list[list.length - 1];

}



/* =========================================================
   DELIVERY TIME
========================================================= */

function getDeliveryTime(d){

  const value =
    d?.NGAY_PHAT ||
    d?.DATE ||
    d?.Date ||
    d?.TimeDetail ||
    d?.NGAY_NHAP ||
    '-';


  return String(value || '-').trim() || '-';

}



/* =========================================================
   DELIVERY PERSON
========================================================= */

function getDeliveryPerson(data){

  const d = getDeliveryRecord(data);


  if(!d){

    return {
      route:'-',
      name:'-',
      phone:'-',
      receiver:'-',
      time:'-'
    };

  }


  const cn =
    String(d.NGAY_CN || '').trim();


  let route='-';
  let name='-';
  let phone='-';


  if(cn){

    const slashIndex =
      cn.indexOf('/');


    if(slashIndex >= 0){

      route =
        cn.slice(
          0,
          slashIndex
        ).trim() || '-';


      let right =
        cn.slice(
          slashIndex + 1
        ).trim();


      const pm =
        right.match(
          /(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*(\d[\d .-]{7,}\d)\s*$/iu
        ) ||
        right.match(
          /(\d[\d .-]{8,}\d)\s*$/
        );


      if(pm){

        phone =
          pm[1].replace(
            /\D/g,
            ''
          );

        right =
          right.slice(
            0,
            pm.index
          ).trim();

      }


      name =
        right
          .replace(
            /[.\s]*(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*$/iu,
            ''
          )
          .replace(/[.\s]+$/,'')
          .trim() || '-';

    }

  }


  const st =
    String(
      d.STATUSTEXT ||
      d.StatusText ||
      ''
    );


  let receiver='-';


  const rm =
    st.match(
      /Người nhận\s*:\s*(.*)$/i
    );


  if(rm){

    receiver =
      rm[1]
        .replace(
          /^\(\s*\)\s*/,
          ''
        )
        .trim()
        .replace(/[.]+$/,'') || '-';

  }


  return {
    route,
    name,
    phone,
    receiver,
    time:getDeliveryTime(d)
  };

}



/* =========================================================

========================================================= */

function latestStatus(data){

  const d =
    getDeliveryRecord(data);


  if(d?.STATUSTEXT){

    return String(
      d.STATUSTEXT
    ).trim();

  }


  const loc =
    data.locate || [];


  return loc.length
    ? String(
        loc[loc.length - 1].StatusText ||
        '-'
      ).trim()
    : 'ĐANG VẬN CHUYỂN';

}

/* =========================================================
   FETCH TIMEOUT
========================================================= */

function fetchWithTimeout(
  url,
  options={},
  timeout=12000
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );


  return fetch(
    url,
    {
      ...options,
      signal:controller.signal,
      cache:'no-store'
    }
  ).finally(
    () => clearTimeout(timer)
  );

}



/* =========================================================
   LOAD CAPTCHA
========================================================= */

async function loadCaptcha(){

  const img =
    document.getElementById(
      'captchaImg'
    );

  const reload =
    document.getElementById(
      'reloadCaptcha'
    );


  const requestId =
    ++captchaRequestId;


  img.classList.remove(
    'loaded'
  );

  img.removeAttribute(
    'src'
  );


  currentCookie='';


  reload.disabled=true;


  for(
    let attempt=1;
    attempt<=3;
    attempt++
  ){

    if(
      requestId !==
      captchaRequestId
    ){
      return false;
    }


    try{

      const res =
        await fetchWithTimeout(
          '/api/proxy?action=get-captcha&_=' +
          Date.now(),
          {},
          10000
        );


      const data =
        await res.json();


      if(
        requestId !==
        captchaRequestId
      ){
        return false;
      }


      if(data?.captchaUrl){

        const src =
          String(
            data.captchaUrl
          );


        await new Promise(
          (resolve,reject) => {

            const test =
              new Image();


            test.onload =
              () => resolve();


            test.onerror =
              () =>
                reject(
                  new Error(
                    'captcha image error'
                  )
                );


            test.src=src;

          }
        );


        if(
          requestId !==
          captchaRequestId
        ){
          return false;
        }


        img.src=src;

        img.classList.add(
          'loaded'
        );


        currentCookie =
          data.cookie || '';


        reload.disabled=false;


        return true;

      }

    }catch(e){

    }


    if(attempt < 3){

      await new Promise(
        r => setTimeout(
          r,
          500
        )
      );

    }

  }


  reload.disabled=false;

  return false;

}



/* =========================================================
   SUBMIT TRACKING
========================================================= */

async function submitTracking(){

  const code =
    document
      .getElementById(
        'trackingCode'
      )
      .value
      .trim();


  const captcha =
    document
      .getElementById(
        'captchaText'
      )
      .value
      .trim();


  const btn =
    document.getElementById(
      'btnSubmit'
    );


  if(!code || !captcha){

    showMsg(
      'Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.'
    );

    return;

  }


  if(!currentCookie){

    showMsg(
      'CAPTCHA chưa sẵn sàng. Vui lòng chờ CAPTCHA hiện ra rồi thử lại.',
      'wait'
    );

    return;

  }


  btn.disabled=true;

  btn.textContent =
    '⏳ Đang tra cứu...';


  showMsg(
    'Đang kết nối hệ thống VNPost, vui lòng chờ...',
    'wait'
  );


  try{

    const res =
      await fetchWithTimeout(
        '/api/proxy?action=track',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            trackingCode:code,

            captchaText:captcha,

            cookie:currentCookie

          })

        },
        30000
      );


    let data=null;


    try{

      data =
        await res.json();

    }catch(_){

      throw new Error(
        'Máy chủ trả về dữ liệu không hợp lệ.'
      );

    }


    if(
      data?.info?.ID
    ){

      currentTrackingCode =
        data.info.ID;

      currentData =
        data;


      renderScreen(data);

      renderPrint(data);


      document
        .getElementById(
          'result-card'
        )
        .style.display='block';


      document
        .getElementById(
          'result'
        )
        .style.display='flex';


      showMsg(
        'Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.',
        'ok'
      );


      document
        .getElementById(
          'result-card'
        )
        .scrollIntoView({
          behavior:'smooth',
          block:'start'
        });

    }else{

      showMsg(
        data?.message ||
        'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.'
      );


      document
        .getElementById(
          'captchaText'
        )
        .value='';


      await loadCaptcha();

    }

  }catch(e){

    if(
      e?.name ===
      'AbortError'
    ){

      showMsg(
        'Tra cứu mất quá nhiều thời gian. Vui lòng thử lại sau vài giây.'
      );

    }else{

      showMsg(
        'Lỗi tra cứu: ' +
        (
          e?.message ||
          'Không xác định'
        )
      );

    }

  }finally{

    btn.disabled=false;

    btn.textContent =
      '🔎 Tra cứu vận đơn';

  }

}

    behavior:'smooth',
    block:'nearest'
  });

/* =========================================================

========================================================= */

async function downloadPDF(){

  if(!currentData){

    alert(
      'Vui lòng tra cứu vận đơn trước.'
    );

    return;

  }


  if(
    typeof html2pdf ===
    'undefined'
  ){

    alert(
      'Thư viện tạo PDF chưa tải xong. Vui lòng thử lại.'
    );

    return;

  }


  const el =
    document.getElementById(
      'print-area'
    );


  const old =
    el.style.display;


  el.style.display='block';


  try{

    const opt={

      margin:0,

      filename:
        `VanDon_VNPost_${
          currentTrackingCode ||
          '247'
        }.pdf`,

      image:{
        type:'jpeg',
        quality:.78
      },

      html2canvas:{
        scale:1.25,
        useCORS:true,
        backgroundColor:'#fff',
        logging:false
      },

      jsPDF:{
        unit:'mm',
        format:'a4',
        orientation:'portrait'
      },

      pagebreak:{
        mode:[
          'css',
          'legacy'
        ],
        avoid:[
          '.p-event'
        ]
      }

    };


    await html2pdf()
      .set(opt)
      .from(el)
      .save();


  }finally{

    el.style.display =
      old;

  }

}
