<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247 - Tra Cứu VNPost (Proxy Session)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .web-container { max-width: 480px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003b7a; margin-top: 0; text-align: center; font-size: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; outline: none; }
        
        .captcha-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .captcha-box { height: 42px; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: #eee; min-width: 130px; cursor: pointer; }
        .captcha-box img { height: 100%; width: auto; display: block; }
        .btn-reload { background: #6c757d; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }

        .btn-submit { background-color: #003b7a; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #002855; }

        /* GIAO DIỆN BẢN IN A4 */
        #print-area { display: none; background: #fff; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; }
            @page { size: A4 portrait; margin: 6mm 8mm 12mm 8mm; }
            body { background: #fff; padding: 0; margin: 0; }
        }

        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .header-title { font-size: 14px; font-weight: bold; color: #003b7a; text-transform: uppercase; margin: 0; }
        .box-section { border: 1px solid #333; padding: 4px 8px; margin-bottom: 6px; background: #fff; }
        .box-title { font-weight: bold; font-size: 10px; color: #003b7a; margin-bottom: 3px; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 1px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 8px; }
        .info-item { line-height: 1.2; font-size: 9.5px; }
        .info-item strong { color: #444; }
        .timeline-container { column-count: 2; column-gap: 10px; column-rule: 1px solid #ccc; margin-top: 2px; }
        .timeline-item { border-bottom: 1px dashed #ddd; break-inside: avoid; page-break-inside: avoid; line-height: 1.2; }
        .timeline-time { font-weight: bold; color: #d9534f; }
        .timeline-detail { color: #222; margin-top: 1px; }
        .footer-print { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 8pt; color: #444; border-top: 1px solid #aaa; padding-top: 3px; background: #fff; }
    </style>
</head>
<body>

    <div class="web-container no-print">
        <h2>InVanDon247 - Tra Cứu VNPost</h2>
        
        <div class="form-group">
            <label>1. Nhập Mã vận đơn:</label>
            <input type="text" id="trackingCode" placeholder="Ví dụ: RB608631891VN" value="RB608631891VN">
        </div>

        <div class="form-group">
            <label>2. Mã xác nhận (CAPTCHA từ VNPost):</label>
            <input type="text" id="captchaText" placeholder="Nhập chữ trong hình bên dưới">
            <div class="captcha-row">
                <div class="captcha-box" onclick="loadCaptcha()" title="Click để đổi mã">
                    <img id="captchaImg" src="" alt="Đang tải...">
                </div>
                <button class="btn-reload" onclick="loadCaptcha()">🔄 Đổi mã</button>
            </div>
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="submitTracking()">🚀 Tra Cứu & In A4 Ngay</button>
    </div>

    <!-- Khu vực hiển thị nội dung in A4 -->
    <div id="print-area"></div>

    <script>
        let currentCookie = '';

        // 1. Tải CAPTCHA và lưu Session Cookie
        async function loadCaptcha() {
            const img = document.getElementById('captchaImg');
            img.src = '';
            img.alt = "Đang tải...";

            try {
                const res = await fetch('/api/proxy?action=get-captcha');
                const data = await res.json();
                
                if (data.captcha) {
                    img.src = data.captcha;
                    currentCookie = data.cookie || '';
                } else {
                    img.alt = "Lỗi CAPTCHA";
                    alert("Lỗi từ Server Proxy: " + (data.error || "Không thể tải mã CAPTCHA"));
                }
            } catch (e) {
                img.alt = "Lỗi kết nối";
                alert('Không thể kết nối API Proxy: ' + e.message);
            }
        }

        // 2. Gửi mã tra cứu kèm Cookie phiên làm việc
        async function submitTracking() {
            const code = document.getElementById('trackingCode').value.trim();
            const captcha = document.getElementById('captchaText').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!code) {
                alert('Vui lòng nhập Mã vận đơn!');
                return;
            }
            if (!captcha) {
                alert('Vui lòng nhập Mã xác nhận (CAPTCHA)!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Đang gửi dữ liệu...";

            try {
                const res = await fetch('/api/proxy?action=track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        trackingCode: code,
                        captchaText: captcha,
                        cookie: currentCookie
                    })
                });

                const data = await res.json();
                btn.disabled = false;
                btn.innerText = "🚀 Tra Cứu & In A4 Ngay";

                if (data.html) {
                    if (data.html.includes('Mã xác thực không chính xác') || data.html.includes('CaptchaText')) {
                        alert('Mã CAPTCHA không chính xác hoặc đã hết hạn. Vui lòng thử lại!');
                        document.getElementById('captchaText').value = '';
                        loadCaptcha();
                    } else {
                        // Tra cứu thành công, đổ dữ liệu vào trang in
                        renderPrintForm(data.html, code);
                        window.print();
                    }
                } else {
                    alert('Lỗi tra cứu: ' + (data.error || 'Khái quát lỗi từ server'));
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "🚀 Tra Cứu & In A4 Ngay";
                alert('Lỗi gửi dữ liệu: ' + e.message);
            }
        }

        // 3. Xử lý dữ liệu trả về và hiển thị bản in A4
        function renderPrintForm(rawText, fallbackCode) {
            let codeMatch = rawText.match(/(?:Bưu gửi số|Mã vận đơn|Mã bưu gửi)\s*:\s*([A-Z0-9]+)/i) || rawText.match(/([A-Z]{2}\d{9}[A-Z]{2})/i);
            let code = codeMatch ? codeMatch[1] : fallbackCode;

            let weightMatch = rawText.match(/Khối lượng[^:]*:\s*([\d\.,]+)/i);
            let weight = weightMatch ? weightMatch[1] : '0';

            let statusMatch = rawText.match(/Trạng thái\s*:\s*([^\n]+)/i);
            let status = statusMatch ? statusMatch[1].trim() : 'Đang cập nhật';

            let fromMatch = rawText.match(/(?:Bưu cục nhận|Nơi gửi)\s*:\s*([^\n]+)/i);
            let from = fromMatch ? fromMatch[1].trim() : '-';

            let toMatch = rawText.match(/(?:Bưu cục phát|Nơi nhận)\s*:\s*([^\n]+)/i);
            let to = toMatch ? toMatch[1].trim() : '-';

            let timeline = [];
            let lines = rawText.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    let time = line;
                    let detail = [];
                    let j = i + 1;
                    while (j < lines.length && !lines[j].trim().match(/^\d{2}\/\d{2}\/\d{4}/)) {
                        let subLine = lines[j].trim();
                        if (subLine && !subLine.includes('GIẢI QUYẾT KHIẾU NẠI') && !subLine.includes('THÔNG TIN TRẠNG THÁI')) {
                            detail.push(subLine);
                        }
                        j++;
                    }
                    timeline.push({ time: time, detail: detail.join(' ') });
                }
            }

            let fontSize = timeline.length > 20 ? '8.5px' : '9.5px';

            let htmlContent = `
                <div class="header-container">
                    <div><img src="https://vnpost.vn/images/logo.png" style="height:28px;width:auto;" alt="VNPost"/></div>
                    <div class="header-title">THÔNG TIN VẬN ĐƠN</div>
                </div>
                <div class="box-section">
                    <div class="box-title">CHI TIẾT BƯU GỬI</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>Mã vận đơn:</strong> <b style="font-size:10.5px;">${code}</b></div>
                        <div class="info-item"><strong>Khối lượng:</strong> ${weight} gram</div>
                        <div class="info-item"><strong>Trạng thái:</strong> <span style="color:green;font-weight:bold;">${status}</span></div>
                        <div class="info-item"><strong>Bưu cục nhận:</strong> ${from}</div>
                        <div class="info-item" style="grid-column: span 2;"><strong>Bưu cục phát:</strong> ${to}</div>
                    </div>
                </div>
                <div class="box-section">
                    <div class="box-title">LỊCH SỬ HÀNH TRÌNH (${timeline.length} SỰ KIỆN)</div>
                    <div class="timeline-container" style="font-size:${fontSize}">
                        ${timeline.map(item => `
                            <div class="timeline-item">
                                <div class="timeline-time">⏱ ${item.time}</div>
                                <div class="timeline-detail">${item.detail}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="footer-print">
                    <div>Xuất từ InVanDon247.com</div>
                    <div><b>Mã vận đơn:</b> ${code}</div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = htmlContent;
        }

        // Tự động tải Captcha ngay khi load trang
        window.onload = loadCaptcha;
    </script>
</body>
</html>
