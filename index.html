<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InVanDon247 - Tra cứu VNPost</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
    --blue:#07579b;
    --blue2:#0b6bb8;
    --orange:#f6a000;
    --green:#148a4b;
    --bg:#f3f5f7;
    --text:#3f464d;
    --muted:#7b838c;
    --line:#dfe4e8
}

*{
    box-sizing:border-box
}

html{
    scroll-behavior:smooth
}

body{
    margin:0;
    font-family:Arial,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text)
}

.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 max(24px,calc((100% - 1100px)/2));
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.brand{
    display:flex;
    align-items:center;
    gap:12px
}

.brand img{
    width:55px;
    height:42px;
    object-fit:contain
}

.brand strong{
    font-size:18px;
    color:var(--blue)
}

.brand small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:2px
}

.nav{
    display:flex;
    gap:25px;
    font-size:12px
}

.nav a{
    color:#444;
    text-decoration:none
}

.nav a:hover{
    color:var(--blue)
}

.page{
    max-width:1100px;
    margin:22px auto 50px;
    padding:0 14px
}

.search-card{
    background:#fff;
    border:1px solid #e1e5e8;
    border-radius:9px;
    padding:20px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06)
}

.search-title{
    text-align:center;
    color:var(--blue);
    font-size:20px;
    font-weight:700;
    margin:0
}

.search-sub{
    text-align:center;
    color:#888;
    font-size:11px;
    margin:5px 0 18px
}

.form-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:12px
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px
}

.field input{
    width:100%;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    padding:0 11px;
    font-size:13px;
    outline:none
}

.field input:focus{
    border-color:var(--blue)
}

.captcha-line{
    display:flex;
    gap:6px
}

.captcha-line input{
    flex:1
}

.captcha-img{
    width:100px;
    height:38px;
    border:1px solid #cfd5da;
    border-radius:5px;
    object-fit:contain;
    background:#f8f8f8
}

.reload{
    border:0;
    background:#f0f1f2;
    border-radius:5px;
    padding:0 11px;
    cursor:pointer;
    font-size:12px
}

.submit{
    width:100%;
    height:40px;
    margin-top:13px;
    border:0;
    border-radius:5px;
    background:var(--blue2);
    color:#fff;
    font-weight:700;
    cursor:pointer
}

.submit:disabled{
    opacity:.6;
    cursor:wait
}

.msg{
    margin-top:10px;
    padding:9px 12px;
    border-radius:5px;
    font-size:12px;
    display:none
}

.msg.error{
    display:block;
    background:#fff0f1;
    color:#b4232e
}

.msg.ok{
    display:block;
    background:#eefaf3;
    color:#137441
}

.result-head{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin:14px 0 10px
}

.action{
    border:0;
    border-radius:5px;
    padding:9px 14px;
    color:#fff;
    font-weight:700;
    font-size:12px;
    cursor:pointer
}

.print-btn{
    background:#148a4b
}

.pdf-btn{
    background:#0767b1
}

.result-card{
    background:#fff;
    border:1px solid #e0e5e9;
    border-radius:8px;
    padding:0 16px 18px;
    box-shadow:0 3px 14px rgba(0,0,0,.05);
    display:none
}

.summary-strip{
    background:#f4f5f6;
    margin:0 -8px 12px;
    padding:10px 8px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    font-size:11px
}

.summary-item{
    display:flex;
    align-items:center;
    gap:8px
}

.summary-icon{
    font-size:18px;
    color:#222
}

.summary-item b{
    color:#0d3f6d
}

.summary-item .status{
    color:var(--green);
    font-weight:700
}

.route-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 8px 14px;
    font-size:11px
}

.route-grid div{
    padding:4px 0
}

.route-grid b{
    display:inline-block;
    min-width:110px
}

.section-title{
    font-size:12px;
    font-weight:700;
    color:#4e555c;
    margin:8px 8px 10px;
    text-transform:uppercase
}

.timeline{
    position:relative;
    margin:0 8px
}

.timeline:before{
    content:"";
    position:absolute;
    left:8px;
    top:7px;
    bottom:7px;
    width:2px;
    background:#aeb4b9
}

.event{
    position:relative;
    display:grid;
    grid-template-columns:185px minmax(0,1.4fr) minmax(230px,1fr) 30px;
    gap:12px;
    padding:0 0 12px 0;
    min-height:54px
}

.event-dot{
    position:absolute;
    left:4px;
    top:6px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#5b6166;
    border:2px solid #fff;
    box-shadow:0 0 0 1px #5b6166
}

.event.latest .event-dot{
    background:#0b9a55;
    box-shadow:0 0 0 1px #0b9a55
}

.event-time{
    padding-left:22px;
    font-size:11px;
    color:#555
}

.event-status{
    font-size:11px;
    line-height:1.35
}

.event-status b{
    display:block;
    color:#4a4f54;
    font-size:10px;
    margin-top:3px
}

.event.latest .event-status{
    color:#078443;
    font-weight:700
}

.event-location{
    font-size:11px;
    color:#5d646b;
    line-height:1.35
}

.map-btn{
    width:28px;
    height:28px;
    border:0;
    background:#fff;
    color:#536df1;
    cursor:pointer;
    font-size:17px;
    border-radius:50%
}

.map-btn:hover{
    background:#eef1ff
}

.event.selected{
    background:#f7fbff;
    border-radius:4px
}

.map-panel{
    display:none;
    margin:4px 8px 14px;
    border:1px solid #d9dee3;
    border-radius:6px;
    overflow:hidden
}

.map-panel.show{
    display:block
}

.map-toolbar{
    height:38px;
    background:#f7f8f9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    font-size:11px
}

.map-toolbar b{
    color:#495057
}

.map-toolbar a{
    color:#0969b0;
    text-decoration:none
}

.map-frame{
    width:100%;
    height:300px;
    border:0;
    display:block
}

.delivery{
    margin:12px 8px 0
}

.delivery-info{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin:0 0 10px
}

.delivery-info .di{
    border:1px solid #e1e5e9;
    border-radius:5px;
    background:#fafbfc;
    padding:8px
}

.delivery-info .di-label{
    display:block;
    color:#7b838c;
    font-size:9px;
    margin-bottom:3px
}

.delivery-info .di-value{
    display:block;
    color:#30353a;
    font-weight:700;
    font-size:11px;
    line-height:1.35;
    word-break:break-word
}

.delivery table{
    width:100%;
    border-collapse:collapse;
    font-size:11px
}

.delivery th{
    background:#edf1f5;
    text-align:left;
    padding:8px
}

.delivery td{
    border:1px solid #e1e5e9;
    padding:8px
}

.screen-footer{
    text-align:center;
    border-top:1px solid #e2e5e8;
    margin:14px 8px 0;
    padding-top:7px;
    color:#9aa1a8;
    font-size:9px
}

/* =========================
   KHU VỰC IN A4
   ========================= */

#print-area{
    display:none
}

@media(max-width:760px){

    .delivery-info{
        grid-template-columns:1fr 1fr
    }

    .topbar{
        padding:0 12px
    }

    .nav{
        display:none
    }

    .form-grid,
    .summary-strip,
    .route-grid{
        grid-template-columns:1fr
    }

    .event{
        grid-template-columns:1fr 30px;
        gap:5px;
        padding-left:20px
    }

    .event-time{
        padding-left:0
    }

    .event-status,
    .event-location{
        grid-column:1
    }

    .event-location{
        padding-left:0
    }

    .event-dot{
        left:0
    }

    .timeline:before{
        left:4px
    }

    .result-head{
        justify-content:stretch
    }

    .action{
        flex:1
    }
}

@page{
    size:A4 portrait;
    margin:8mm
}

.print-page{
    width:194mm;
    min-height:281mm;
    position:relative;
    page-break-after:always;
    padding:0
}

.print-page:last-child{
    page-break-after:auto
}

.print-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid var(--blue);
    padding-bottom:5px;
    margin-bottom:7px
}

.print-logo{
    width:62px;
    height:42px;
    object-fit:contain
}

.print-brand{
    font-size:13px;
    color:var(--blue);
    font-weight:700
}

.print-brand small{
    display:block;
    font-size:7px;
    color:#777;
    font-weight:400
}

.print-meta{
    text-align:right;
    font-size:7px;
    color:#777;
    line-height:1.5
}

.print-title{
    text-align:center;
    border:1px solid #cfd5db;
    padding:5px;
    margin-bottom:7px
}

.print-title b{
    font-size:11px
}

.print-code{
    font-size:12px;
    font-weight:700;
    color:#a66c00;
    margin-top:1px
}

.print-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:7px
}

.pbox{
    border:1px solid #cdd3d8;
    padding:5px
}

.pbox h4{
    font-size:7.5px;
    color:var(--blue);
    margin:0 0 4px;

}

.prow{
    font-size:7.2px;

}

.prow span{
    color:#777;
    display:inline-block;

}

.prow b{

}

.print-history-title{
    font-size:8px;
    font-weight:700;
    color:#333;

}

.print-columns{

}

.p-event{
    break-inside:avoid;
    page-break-inside:avoid;

.p-time{

}

.p-event.latest .p-time,
.p-event.latest .p-status{

}

.p-status{
    margin-top:1px
}

.p-meta{

}

.p-address{
    color:#555
}

.print-delivery{
    margin-top:7px
}

.print-delivery h4{

}

.print-delivery table{

.print-delivery th{

.print-delivery td{

.print-footer{

    left:0;

/* QUAN TRỌNG:
   Chỉ hiện print-area khi thực sự in.

*/

    <div class="brand">

        <img

            crossorigin="anonymous"
        >

        <div>

        </div>

    </div>

    <nav class="nav">

    </nav>

<main class="page">

<section class="search-card no-print" id="search">

    <h1 class="search-title">
        TRA CỨU VẬN ĐƠN
    </h1>

    <div class="search-sub">
        Nhập mã vận đơn và mã CAPTCHA để xem hành trình bưu gửi
    </div>

    <div class="form-grid">

        <div class="field">

            <label>
                1. Mã vận đơn VNPost
            </label>

            <input
                id="trackingCode"
                type="text"
                placeholder="Ví dụ: RB608631891VN"
            >

        </div>


        <div class="field">

            <label>
                2. Mã xác thực (CAPTCHA)
            </label>

            <div class="captcha-line">

                <input
                    id="captchaText"
                    type="text"
                    placeholder="Nhập mã CAPTCHA"
                >

                <img
                    id="captchaImg"
                    class="captcha-img"
                    alt="CAPTCHA"
                >

                    class="reload"
                    type="button"
                    onclick="loadCaptcha()"

        id="btnSubmit"

    id="result-card"

>

    <div id="screen-result"></div>

<script>

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;


/* =========================
   ESCAPE HTML
   ========================= */

const esc = s =>
    String(s ?? '-').replace(
        /[&<>"']/g,
        m => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'
        }[m])
    );


/* =========================
   XÓA MÃ BƯU CỤC CHỈ KHI
   CẦN HIỂN THỊ LỊCH SỬ
   ========================= */

function cleanStatus(s){

    return String(s || '-')
        .replace(
            /\s*\(\d{4,7}\s*:[^)]+\)/g,
            ''
        )
        .replace(
            /\s{2,}/g,
            ' '
        )
        .trim();

}


/* =========================
   ĐỊA CHỈ
   ========================= */

function getAddress(item){

    return typeof item?.VI_TRI === 'string' &&
           item.VI_TRI.trim()
        ? item.VI_TRI.trim()
        : '-';

}


/* =========================
   TỌA ĐỘ
   ========================= */

function getCoords(item){

    let lat =
        item?.LAT ??
        item?.Lat ??
        item?.latitude ??
        item?.Latitude;

    let lng =
        item?.LNG ??
        item?.Lon ??
        item?.LONG ??
        item?.longitude ??
        item?.Longitude;

    return lat && lng
        ? {lat,lng}
        : null;

}


/* =========================
   LẤY BƯU CỤC
   ========================= */

function getOffice(item){

    const text = String(
        item?.StatusText || ''
    );


    /*
      Ví dụ:

      EMI - Phát thành công
      (823960: BCP Thuận An - Hồ Chí Minh )
    */

    const m = text.match(
        /\((\d{4,7})\s*:\s*([^)]*)\)/
    );


    if(m){

        return {
            code:m[1],
            name:m[2].trim(),
            full:m[1] + ' - ' + m[2].trim()
        };

    }


    const code =
        item?.POSCode ??
        item?.POSCODE ??
        item?.ToPOSCode ??
        '';


    return {
        code:String(code || '-'),
        name:'',
        full:String(code || '-')
    };

}


/* =========================
   LẤY BẢN GHI PHÁT
   ========================= */

function getDeliveryRecord(data){

    const list =
        Array.isArray(data?.delivery)
            ? data.delivery
            : [];


    if(!list.length)
        return null;


    /*
      Ưu tiên bản ghi "Phát thành công".
      Nếu không có thì lấy bản ghi cuối.
    */

    return list.find(
        d =>
            /phát thành công|delivered/i.test(
                String(
                    d?.STATUSTEXT ||
                    d?.StatusText ||
                    ''
                )
            )
    ) || list[list.length - 1];

}


/* =========================
   THỜI GIAN PHÁT THỰC TẾ
   ========================= */

function getDeliveryTime(d){

    /*
      QUAN TRỌNG:

      VNPost trả:

      NGAY_PHAT  = thời điểm phát thực tế
      NGAY_NHAP  = thời điểm hệ thống nhập dữ liệu

      Vì vậy phải ưu tiên NGAY_PHAT.
    */

    const value =
        d?.NGAY_PHAT ||
        d?.DATE ||
        d?.Date ||
        d?.TimeDetail ||
        d?.NGAY_NHAP ||
        '-';


    return String(value || '-').trim() || '-';

}


/* =========================
   LẤY TÊN + SỐ BƯU TÁ
   ========================= */

function getDeliveryPerson(data){

    const d = getDeliveryRecord(data);


    if(!d){

        return {
            route:'-',
            name:'-',
            phone:'-',
            receiver:'-',
            time:'-'
        };

    }


    /*
      VNPost thực tế:

      NGAY_CN:

      Lái Thiêu_01 /
      ĐẶNG VŨ BÌNH DU.ÐT B.Tá:0898688486
    */

    const cn =
        String(d.NGAY_CN || '').trim();


    let route = '-';
    let name = '-';
    let phone = '-';


    if(cn){

        const slashIndex =
            cn.indexOf('/');


        if(slashIndex >= 0){

            /*
              Phần trước dấu /
              là tuyến / đội phát
            */

            route =
                cn
                    .slice(0, slashIndex)
                    .trim() || '-';


            /*
              Phần sau dấu /
              chứa tên bưu tá + điện thoại
            */

            let right =
                cn
                    .slice(slashIndex + 1)
                    .trim();


            /*
              Bắt:

              ĐT B.Tá:0898688486

              hoặc

              ÐT B.Tá:0898688486

              hoặc số điện thoại nằm cuối.
            */

            const pm =
                right.match(
                    /(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*(\d[\d .-]{7,}\d)\s*$/iu
                )
                ||
                right.match(
                    /(\d[\d .-]{8,}\d)\s*$/
                );


            if(pm){

                phone =
                    pm[1]
                        .replace(/\D/g,'');


                /*
                  Cắt phần điện thoại
                  ra khỏi tên
                */

                right =
                    right
                        .slice(0, pm.index)
                        .trim();

            }


            /*
              Nếu còn "ĐT B.Tá" thì xóa.
            */

            name =
                right
                    .replace(
                        /[.\s]*(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*$/iu,
                        ''
                    )
                    .replace(
                        /[.\s]+$/,
                        ''
                    )
                    .trim() || '-';

        }

    }


    /* =========================
       NGƯỜI NHẬN
       ========================= */

    const st =
        String(
            d.STATUSTEXT ||
            d.StatusText ||
            ''
        );


    let receiver = '-';


    const rm =
        st.match(
            /Người nhận\s*:\s*(.*)$/i
        );


    if(rm){

        receiver =
            rm[1]
                .replace(
                    /^\(\s*\)\s*/,
                    ''
                )
                .trim()
                .replace(
                    /[.]+$/,
                    ''
                ) || '-';

    }


    return {
        route,
        name,
        phone,
        receiver,
        time:getDeliveryTime(d)
    };

}


/* =========================
   TRẠNG THÁI CUỐI
   ========================= */

function latestStatus(data){

    const d =
        getDeliveryRecord(data);


    /*
      QUAN TRỌNG:

      Không dùng cleanStatus ở đây.

      Vì bạn muốn giữ nguyên:

      EMI - Phát thành công (Delivered)
      (823960: BCP Thuận An - Hồ Chí Minh )
    */

    if(d?.STATUSTEXT)
        return String(
            d.STATUSTEXT
        ).trim();


    const loc =
        data.locate || [];


    return loc.length
        ? String(
            loc[loc.length - 1].StatusText || '-'
          ).trim()
        : 'ĐANG VẬN CHUYỂN';

}

/* =========================
   CAPTCHA
   ========================= */

async function loadCaptcha(){

    const img =
        document.getElementById('captchaImg');


    img.removeAttribute('src');
    img.alt = 'Đang tải...';


    try{

        const res =
            await fetch(
                '/api/proxy?action=get-captcha'
            );


        const data =
            await res.json();


        if(data.captchaUrl){

            img.src =
                data.captchaUrl;

            img.alt =
                'CAPTCHA';

            currentCookie =
                data.cookie || '';

        }
        else{

            img.alt =
                'Không tải được CAPTCHA';

        }

    }
    catch(e){

        img.alt =
            'Lỗi kết nối';

    }

}


/* =========================
   TRA CỨU
   ========================= */

async function submitTracking(){

    const code =
        document
            .getElementById('trackingCode')
            .value
            .trim();


    const captcha =
        document
            .getElementById('captchaText')
            .value
            .trim();


    const btn =
        document
            .getElementById('btnSubmit');


    if(!code || !captcha){

        showMsg(
            'Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.'
        );

        return;

    }


    btn.disabled = true;

    btn.textContent =
        '⏳ Đang tra cứu...';


    try{

        const res =
            await fetch(
                '/api/proxy?action=track',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        trackingCode:code,
                        captchaText:captcha,
                        cookie:currentCookie
                    })
                }
            );


        const data =
            await res.json();


        if(data?.info?.ID){

            currentTrackingCode =
                data.info.ID;


            currentData =
                data;


            renderScreen(data);

            renderPrint(data);


            document
                .getElementById('result-card')
                .style.display =
                'block';


            document
                .getElementById('result')
                .style.display =
                'flex';


            showMsg(
                'Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.',
                'ok'
            );


            document
                .getElementById('result-card')
                .scrollIntoView({
                    behavior:'smooth',
                    block:'start'
                });

        }
        else{

            showMsg(
                'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.'
            );


            document
                .getElementById('captchaText')
                .value = '';


            loadCaptcha();

        }

    }
    catch(e){

        showMsg(
            'Lỗi tra cứu: ' + e.message
        );

    }
    finally{

        btn.disabled = false;

        btn.textContent =
            '🔎 Tra cứu vận đơn';

    }

}

function openMap(
    address,
    title,
    coords
){

    const panel =
        document.getElementById(
            'map-panel'
        );


    panel.classList.add('show');


    document
        .getElementById('map-title')
        .textContent =
        title + ' — ' + address;


    const q =
        coords
            ? `${coords.lat},${coords.lng}`
            : address;


    const maps =
        'https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(q);


    document
        .getElementById('map-link')
        .href = maps;


    document
        .getElementById('map-frame')
        .src =
        'https://www.google.com/maps?q=' +
        encodeURIComponent(q) +
        '&output=embed';


    panel.scrollIntoView({
        behavior:'smooth',
        block:'nearest'
    });

}

/* =========================

   ========================= */

async function downloadPDF(){

    if(!currentData)
        return;


    const el =
        document.getElementById(
            'print-area'
        );


    const old =
        el.style.display;


    el.style.display =
        'block';


    try{

        const opt = {

            margin:0,

            filename:
                `VanDon_VNPost_${
                    currentTrackingCode || '247'
                }.pdf`,

            image:{
                type:'jpeg',
                quality:.78
            },

            html2canvas:{
                scale:1.25,
                useCORS:true,
                backgroundColor:'#fff',
                logging:false
            },

            jsPDF:{
                unit:'mm',
                format:'a4',
                orientation:'portrait'
            },

            pagebreak:{
                mode:[
                    'css',
                    'legacy'
                ],
                avoid:[
                    '.p-event'
                ]
            }

        };


        await html2pdf()
            .set(opt)
            .from(el)
            .save();

    }
    finally{

        el.style.display =
            old;

    }

}
