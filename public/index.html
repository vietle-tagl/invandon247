<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247 - Công cụ tra cứu và tạo phiếu vận đơn A4</title>
    
    <!-- CSS chính -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Thư viện hỗ trợ tạo PDF (Sử dụng đúng file có trong thư mục libs của bạn) -->
    <script src="./libs/html2canvas.min.js"></script>
    <script src="./libs/jspdf.umd.min.js"></script>
    
    <!-- Các thư viện khác của bạn (giữ nguyên) -->
    <script src="./libs/JsBarcode.all.min.js"></script>
    <script src="./libs/qrcode.min.js"></script>
</head>
<body>

    <!-- HEADER -->
    <header class="topbar no-print">
        <div class="topbar-inner">
            <a href="#" class="brand">
                <div class="brand-logo">
                    <img src="./images/logo.png" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div>
                    <strong>InVanDon247</strong>
                    <small>Công cụ tra cứu và tạo phiếu vận đơn A4</small>
                </div>
            </a>
            <nav class="nav">
                <a href="#">Trang chủ</a>
                <a href="#">Tra cứu</a>
                <a href="#">Bảng kê</a>
                <a href="#">Giới thiệu</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="page">
        <!-- KHU VỰC TÌM KIẾM -->
        <section class="search-card no-print">
            <h2 class="search-title">Tra cứu vận đơn</h2>
            <p class="search-sub">Nhập mã vận đơn để tra cứu thông tin</p>
            
            <div class="form-grid">
                <div class="field">
                    <label>Mã vận đơn</label>
                    <input type="text" id="tracking-code" placeholder="Nhập mã vận đơn...">
                </div>
                <div class="field">
                    <label>Mã Captcha</label>
                    <div class="captcha-line">
                        <input type="text" id="captcha-input" placeholder="Nhập mã...">
                        <div class="captcha-slot">
                            <img id="captcha-img" class="captcha-img" src="" alt="Captcha">
                        </div>
                        <button class="reload" id="reload-captcha">Đổi mã</button>
                    </div>
                </div>
            </div>
            
            <button class="submit" id="search-btn">Tra cứu ngay</button>
            <div id="msg" class="msg"></div>
        </section>

        <!-- NÚT HÀNH ĐỘNG (Ẩn khi chưa có kết quả) -->
        <div class="result-head no-print" id="action-buttons" style="display: none;">
            <button class="action print-btn" onclick="printPage()">🖨️ In A4</button>
            <button class="action pdf-btn" onclick="downloadPDF()">⬇️ Tải PDF</button>
        </div>

        <!-- KẾT QUẢ TRA CỨU (Hiển thị trên web) -->
        <section class="result-card" id="result-container">
            <!-- Dữ liệu sẽ được JS render vào đây -->
        </section>

        <!-- VÙNG IN ẤN A4 (Ẩn trên web, chỉ hiện khi in/tải PDF) -->
        <section id="print-area">
            <!-- Dữ liệu in sẽ được JS render vào đây -->
        </section>
    </main>

    <!-- FOOTER (Chỉ hiển thị 1 lần duy nhất) -->
    <footer class="site-footer">
        © 2026 InVanDon247. All rights reserved. Dữ liệu được truy xuất từ hệ thống VNPost.
    </footer>

    <!-- CÁC FILE JS -->
    <script src="./js/api.js"></script>
    <script src="./js/pdf.js"></script>
</body>
</html>
