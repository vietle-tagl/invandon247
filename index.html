<script>
/* =========================================================
   BIẾN TOÀN CỤC
========================================================= */

let currentCookie = "";
let currentTrackingCode = "";
let currentData = null;
let currentMapItem = null;


/* =========================================================
   ESCAPE HTML
   Tránh dữ liệu API chứa ký tự HTML làm vỡ giao diện
========================================================= */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   LẤY GIÁ TRỊ AN TOÀN
========================================================= */

function firstValue(obj, keys){

    for(const key of keys){

        if(
            obj &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            String(obj[key]).trim() !== ""
        ){
            return obj[key];
        }

    }

    return "";
}


/* =========================================================
   LẤY TỌA ĐỘ

   API có thể dùng nhiều tên khác nhau.
========================================================= */

function getCoordinates(item){

    const lat = firstValue(item,[
        "LAT",
        "Lat",
        "lat",
        "LATITUDE",
        "Latitude",
        "latitude",
        "Y"
    ]);

    const lng = firstValue(item,[
        "LNG",
        "Lng",
        "lng",
        "LONGITUDE",
        "Longitude",
        "longitude",
        "LON",
        "Lon",
        "lon",
        "X"
    ]);

    if(lat !== "" && lng !== ""){

        const a = parseFloat(String(lat).replace(",","."));
        const b = parseFloat(String(lng).replace(",",".")); 

        if(
            Number.isFinite(a) &&
            Number.isFinite(b) &&
            Math.abs(a) <= 90 &&
            Math.abs(b) <= 180
        ){
            return {
                lat:a,
                lng:b
            };
        }
    }

    /* Một số API có trường tọa độ chung */

    const coordinate = firstValue(item,[
        "COORDINATE",
        "Coordinate",
        "coordinate",
        "GPS",
        "gps",
        "LOCATION"
    ]);

    if(coordinate){

        const match = String(coordinate).match(
            /(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/
        );

        if(match){

            const a = parseFloat(match[1]);
            const b = parseFloat(match[2]);

            if(
                Math.abs(a)<=90 &&
                Math.abs(b)<=180
            ){
                return {
                    lat:a,
                    lng:b
                };
            }
        }
    }

    return null;
}


/* =========================================================
   LẤY ĐỊA CHỈ / VỊ TRÍ
========================================================= */

function getLocation(item){

    return firstValue(item,[
        "VI_TRI",
        "ViTri",
        "vi_tri",
        "LOCATION_TEXT",
        "Location",
        "location",
        "ADDRESS",
        "Address",
        "address"
    ]) || "-";
}


/* =========================================================
   LẤY MÃ BƯU CỤC
========================================================= */

function getPostCode(item){

    return firstValue(item,[
        "POSCode",
        "POSCODE",
        "PosCode",
        "BCCode",
        "BCCODE",
        "MA_BC",
        "MABC",
        "PostCode"
    ]) || "-";
}


/* =========================================================
   LẤY NỘI DUNG TRẠNG THÁI
========================================================= */

function getStatus(item){

    return firstValue(item,[
        "StatusText",
        "STATUSTEXT",
        "statusText",
        "STATUS",
        "status"
    ]) || "-";
}


/* =========================================================
   CHUYỂN THỜI GIAN THÀNH GIÁ TRỊ SO SÁNH
========================================================= */

function getDateTimeValue(item){

    const date = firstValue(item,[
        "Date",
        "DATE",
        "date"
    ]);

    const time = firstValue(item,[
        "TimeDetail",
        "TIME",
        "Time",
        "time"
    ]);

    const str = `${date} ${time}`.trim();

    /*
       VNPost thường trả DD/MM/YYYY.
       Chuyển thành YYYY-MM-DD để sort.
    */

    const match = str.match(
        /(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/
    );

    if(match){

        return new Date(
            Number(match[3]),
            Number(match[2])-1,
            Number(match[1]),
            Number(match[4] || 0),
            Number(match[5] || 0),
            Number(match[6] || 0)
        ).getTime();
    }

    const fallback = Date.parse(str);

    return Number.isNaN(fallback) ? 0 : fallback;
}


/* =========================================================
   HIỂN THỊ THỜI GIAN
========================================================= */

function getDisplayTime(item){

    const date = firstValue(item,[
        "Date",
        "DATE",
        "date"
    ]);

    const time = firstValue(item,[
        "TimeDetail",
        "TIME",
        "Time",
        "time"
    ]);

    return `${date || ""} ${time || ""}`.trim();
}

/* =========================================================
   CAPTCHA
========================================================= */

async function loadCaptcha(){

    const img = document.getElementById("captchaImg");

    img.removeAttribute("src");
    img.alt = "Đang tải CAPTCHA...";

    try{

        const res = await fetch(
            "/api/proxy?action=get-captcha",
            {
                cache:"no-store"
            }
        );

        if(!res.ok){
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if(data && data.captchaUrl){

            img.src = data.captchaUrl;
            currentCookie = data.cookie || "";

        }else{

            img.alt = "Không tải được CAPTCHA";

        }

    }catch(error){

        console.error("CAPTCHA:",error);

        img.alt = "Lỗi tải CAPTCHA";

        showMessage(
            "Không thể tải CAPTCHA. Vui lòng bấm “Đổi mã” để thử lại.",
            "error"
        );
    }
}


/* =========================================================
   TRA CỨU
========================================================= */

async function submitTracking(){

    hideMessage();

    const code = document
        .getElementById("trackingCode")
        .value
        .trim();

    const captcha = document
        .getElementById("captchaText")
        .value
        .trim();

    const btn = document.getElementById("btnSubmit");

    if(!code){

        showMessage(
            "Vui lòng nhập mã vận đơn.",
            "error"
        );

        return;
    }

    if(!captcha){

        showMessage(
            "Vui lòng nhập mã CAPTCHA.",
            "error"
        );

        return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Đang tra cứu...";

    try{

        const res = await fetch(
            "/api/proxy?action=track",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    trackingCode:code,
                    captchaText:captcha,
                    cookie:currentCookie
                })
            }
        );

        if(!res.ok){
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if(
            data &&
            data.info &&
            data.info.ID
        ){

            currentData = data;
            currentTrackingCode = data.info.ID;

            renderResult(data);

            document.getElementById("resultCard").style.display = "block";
            document.getElementById("actionBar").style.display = "flex";

            showMessage(
                "Tra cứu thành công.",
                "success"
            );

            setTimeout(()=>{

                document
                    .getElementById("resultCard")
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

            },100);

        }else{

            showMessage(
                "Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.",
                "error"
            );

            document
                .getElementById("captchaText")
                .value = "";

            await loadCaptcha();
        }

    }catch(error){

        console.error(error);

        showMessage(
            "Lỗi tra cứu: " + error.message,
            "error"
        );

    }finally{

        btn.disabled = false;
        btn.textContent = "🔎 Tra cứu vận đơn";
    }
}

/* =========================================================
   HIỂN THỊ BẢN ĐỒ
========================================================= */

function showMapForItem(index){

    if(!currentData){
        return;
    }

    const locate = Array.isArray(currentData.locate)
        ? [...currentData.locate]
        : [];

    locate.sort(
        (a,b)=>getDateTimeValue(a)-getDateTimeValue(b)
    );

    const item = locate[index];

    if(!item){
        return;
    }

    currentMapItem = item;

    const mapSection =
        document.getElementById("mapSection");

    const mapFrame =
        document.getElementById("mapFrame");

    const mapHead =
        document.getElementById("mapHead");

    if(!mapSection || !mapFrame || !mapHead){
        return;
    }


    const location = getLocation(item);
    const code = getPostCode(item);
    const status = getStatus(item);

    const coordinates = getCoordinates(item);


    let mapUrl = "";
    let googleUrl = "";


    /*
       ƯU TIÊN TỌA ĐỘ API.
       Nếu API trả tọa độ thì không dùng geocoding theo
       tên địa phương nữa.
    */

    if(coordinates){

        const lat = coordinates.lat;
        const lng = coordinates.lng;

        mapUrl =
            `https://www.google.com/maps?q=${lat},${lng}&output=embed`;

        googleUrl =
            `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

    }else{

        const query =
            `${location}, Việt Nam`;

        mapUrl =
            `https://www.google.com/maps?q=${encodeURIComponent(query)}&output=embed`;

        googleUrl =
            `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }


    mapHead.innerHTML = `

        <div class="map-title">

            ${escapeHtml(status)}
            (${escapeHtml(code)})

            —
            ${escapeHtml(location)}

        </div>

        <a
            class="map-google"
            href="${googleUrl}"
            target="_blank"
            rel="noopener"
        >
            Mở Google Maps ↗
        </a>

    `;


    mapFrame.src = mapUrl;

    mapSection.style.display = "block";


    setTimeout(()=>{

        mapSection.scrollIntoView({
            behavior:"smooth",
            block:"nearest"
        });

    },50);
}

/* =========================================================
   PHÂN TRANG A4

   24 sự kiện / trang.
   12 bên trái + 12 bên phải.

   Với dữ liệu dài hơn, tự động tạo trang tiếp theo.
========================================================= */

function buildPrintDocument(data){

    const info = data.info || {};

    const locate = Array.isArray(data.locate)
        ? [...data.locate]
        : [];

    const delivery =
        data.delivery &&
        Array.isArray(data.delivery) &&
        data.delivery.length
            ? data.delivery[0]
            : null;


    /*
       CŨ -> MỚI
    */

    locate.sort(
        (a,b)=>getDateTimeValue(a)-getDateTimeValue(b)
    );


    const latest =
        locate.length
            ? locate[locate.length-1]
            : null;


    const status =
        delivery && delivery.STATUSTEXT
            ? delivery.STATUSTEXT
            : latest
                ? getStatus(latest)
                : "ĐANG VẬN CHUYỂN";


    /*
       24 dòng / trang.
    */

    const EVENTS_PER_PAGE = 24;

    const eventPages = [];


    for(
        let i=0;
        i<locate.length;
        i+=EVENTS_PER_PAGE
    ){

        eventPages.push(
            locate.slice(
                i,
                i + EVENTS_PER_PAGE
            )
        );

    }


    /*
       Nếu không có lịch sử thì vẫn tạo 1 trang.
    */

    if(eventPages.length === 0){
        eventPages.push([]);
    }


    const totalPages = eventPages.length;

    let html = "";


    eventPages.forEach((events,pageIndex)=>{

        /*
           Chia đều event thành 2 cột.
        */

        const split =
            Math.ceil(events.length / 2);

        const leftEvents =
            events.slice(0,split);

        const rightEvents =
            events.slice(split);


        html += `

            <div class="print-page">

                ${createPrintHeader(
                    info,
                    pageIndex+1,
                    totalPages
                )}

                ${
                    pageIndex === 0
                        ? createPrintInfo(info,status)
                        : `
                            <div class="print-section-title">
                                LỊCH SỬ HÀNH TRÌNH — TIẾP THEO
                            </div>
                        `
                }


                <div class="print-section-title">
                    CHI TIẾT LỊCH SỬ HÀNH TRÌNH
                    (${locate.length} công đoạn)
                </div>


                <div class="print-timeline-grid">

                    <div class="print-timeline-col">

                        ${
                            leftEvents.map(item=>{

                                const isLatest =
                                    item === latest;

                                return createPrintEvent(
                                    item,
                                    isLatest
                                );

                            }).join("")
                        }

                    </div>


                    <div class="print-timeline-col">

                        ${
                            rightEvents.map(item=>{

                                const isLatest =
                                    item === latest;

                                return createPrintEvent(
                                    item,
                                    isLatest
                                );

                            }).join("")
                        }

                    </div>

                </div>


                ${
                    pageIndex === totalPages-1
                        ? createPrintDelivery(delivery)
                        : ""
                }


                <div class="print-footer">

                    Dữ liệu được truy xuất trực tiếp từ hệ thống VNPost
                    qua cổng kết nối InVanDon247

                    &nbsp;•&nbsp;

                    Trang ${pageIndex+1}/${totalPages}

                </div>

            </div>

        `;

    });


    document.getElementById(
        "print-document"
    ).innerHTML = html;
}

/* =========================================================
   TẢI PDF

   Dùng CHÍNH DOM A4 đã tạo cho chức năng in.
   Vì vậy PDF và bản in có cùng bố cục.
========================================================= */

async function downloadPDF(){

    if(!currentData){
        alert("Chưa có dữ liệu vận đơn để tải PDF.");
        return;
    }

    buildPrintDocument(currentData);

    const element =
        document.getElementById("print-document");


    /*
       Đợi logo load.
    */

    await waitForImages(element);


    const fileName =
        `VanDon_VNPost_${currentTrackingCode || "InVanDon247"}.pdf`;


    const options = {

        margin:0,

        filename:fileName,

        image:{
            type:"jpeg",
            quality:0.72
        },

        html2canvas:{
            scale:1.35,
            useCORS:true,
            allowTaint:false,
            backgroundColor:"#ffffff",
            logging:false
        },

        jsPDF:{
            unit:"mm",
            format:"a4",
            orientation:"portrait",
            compress:true
        },

        pagebreak:{
            mode:[
                "css",
                "legacy"
            ]
        }

    };


    try{

        /*
           html2pdf cần phần tử render được.
           Tạm thời hiển thị document nhưng ngoài màn hình.
        */

        element.style.display = "block";
        element.style.position = "absolute";
        element.style.left = "-10000px";
        element.style.top = "0";
        element.style.width = "210mm";


        await html2pdf()
            .set(options)
            .from(element)
            .save();


    }catch(error){

        console.error("PDF:",error);

        alert(
            "Không thể tạo PDF. Vui lòng thử lại."
        );

    }finally{

        element.style.display = "none";
        element.style.position = "";
        element.style.left = "";
        element.style.top = "";
        element.style.width = "";

    }
}


/* =========================================================
   ĐỢI HÌNH ẢNH LOAD
========================================================= */

function waitForImages(container){

    const images =
        Array.from(
            container.querySelectorAll("img")
        );

    if(!images.length){
        return Promise.resolve();
    }

    return Promise.all(
        images.map(img=>{

            if(img.complete){
                return Promise.resolve();
            }

            return new Promise(resolve=>{

                img.onload = resolve;
                img.onerror = resolve;

            });

        })
    );
}
