<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InVanDon247.com - Tra Cứu & In A4</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .web-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003b7a; margin-top: 0; text-align: center; font-size: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; outline: none; text-transform: uppercase; font-weight: bold; }
        
        .captcha-box { display: flex; gap: 10px; align-items: center; }
        .captcha-box input { flex: 1; }
        .captcha-img-wrapper { display: flex; align-items: center; gap: 5px; }
        .captcha-img-wrapper img { height: 42px; min-width: 130px; max-width: 150px; border: 1px solid #ccc; border-radius: 4px; background: #eee; cursor: pointer; object-fit: contain; }
        .btn-refresh { background: #eee; border: 1px solid #ccc; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 16px; }

        .btn-submit { background-color: #003b7a; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #002855; }
        .btn-submit:disabled { background-color: #888; cursor: not-allowed; }
        
        #print-area { display: none; background: #fff; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; }
            @page { size: A4 portrait; margin: 6mm 8mm 12mm 8mm; }
            body { background: #fff; padding: 0; margin: 0; }
        }

        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .header-title { font-size: 14px; font-weight: bold; color: #003b7a; text-transform: uppercase; margin: 0; }
        .box-section { border: 1px solid #333; padding: 4px 8px; margin-bottom: 6px; background: #fff; }
        .box-title { font-weight: bold; font-size: 10px; color: #003b7a; margin-bottom: 3px; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 1px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 8px; }
        .info-item { line-height: 1.2; font-size: 9.5px; }
        .info-item strong { color: #444; }
        .timeline-container { column-count: 2; column-gap: 10px; column-rule: 1px solid #ccc; margin-top: 2px; }
        .timeline-item { border-bottom: 1px dashed #ddd; break-inside: avoid; page-break-inside: avoid; line-height: 1.2; }
        .timeline-time { font-weight: bold; color: #d9534f; }
        .timeline-detail { color: #222; margin-top: 1px; }
        .footer-print { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 8pt; color: #444; border-top: 1px solid #aaa; padding-top: 3px; background: #fff; }
    </style>
</head>
<body>

    <div class="web-container no-print">
        <h2>InVanDon247 - Tra Cứu & In A4</h2>
        
        <div class="form-group">
            <label>1. Nhập Mã vận đơn VNPost:</label>
            <input type="text" id="trackCode" placeholder="Ví dụ: RB608631891VN" />
        </div>

        <div class="form-group">
            <label>2. Mã xác nhận (CAPTCHA từ VNPost):</label>
            <div class="captcha-box">
                <input type="text" id="captchaInput" placeholder="Nhập chữ trong hình..." />
                <div class="captcha-img-wrapper">
                    <img id="captchaImg" src="" alt="Đang tải..." onclick="loadCaptcha()" title="Bấm để đổi mã khác">
                    <button class="btn-refresh" onclick="loadCaptcha()" title="Đổi mã khác">🔄</button>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="submitTrack()">🚀 Tra Cứu & In A4</button>
    </div>

    <div id="print-area"></div>

    <script>
        let currentCookie = '';

        window.onload = loadCaptcha;

        async function loadCaptcha() {
            let img = document.getElementById('captchaImg');
            img.style.opacity = '0.3';

            try {
                let res = await fetch('/api/captcha?t=' + Date.now());
                let data = await res.json();
                if (data.image) {
                    img.src = data.image;
                    currentCookie = data.cookie || '';
                } else {
                    alert('Lỗi lấy ảnh CAPTCHA, bấm 🔄 để thử lại!');
                }
            } catch (e) {
                alert('Không kết nối được server lấy CAPTCHA!');
            }
            img.style.opacity = '1';
        }

        async function submitTrack() {
            let code = document.getElementById('trackCode').value.trim().toUpperCase();
            let captcha = document.getElementById('captchaInput').value.trim();
            let btn = document.getElementById('btnSubmit');

            if (!code || !captcha) {
                alert('Vui lòng điền đủ Mã vận đơn và Mã xác nhận!');
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ Đang gửi dữ liệu...';

            try {
                let res = await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        captcha: captcha,
                        cookie: currentCookie
                    })
                });

                let htmlText = await res.text();

                if (htmlText.includes('không đúng') || htmlText.includes('Captcha')) {
                    alert('Mã CAPTCHA sai hoặc hết hạn. Vui lòng thử lại mã mới!');
                    loadCaptcha();
                    document.getElementById('captchaInput').value = '';
                } else {
                    renderPrintArea(htmlText, code);
                    window.print();
                }
            } catch (e) {
                alert('Lỗi khi tải trang in!');
            }

            btn.disabled = false;
            btn.innerText = '🚀 Tra Cứu & In A4';
        }

        function renderPrintArea(text, inputCode = '') {
            let parser = new DOMParser();
            let doc = parser.parseFromString(text, 'text/html');
            let rawText = doc.body ? doc.body.innerText : text;

            let codeMatch = rawText.match(/(?:Bưu gửi số|Mã vận đơn|Mã bưu gửi)\s*:\s*([A-Z0-9]+)/i) || rawText.match(/([A-Z]{2}\d{9}[A-Z]{2})/i);
            let code = codeMatch ? codeMatch[1] : inputCode;

            let weightMatch = rawText.match(/Khối lượng[^:]*:\s*([\d\.,]+)/i);
            let weight = weightMatch ? weightMatch[1] : '0';

            let statusMatch = rawText.match(/Trạng thái\s*:\s*([^\n]+)/i);
            let status = statusMatch ? statusMatch[1].trim() : 'Đang cập nhật';

            let fromMatch = rawText.match(/(?:Bưu cục nhận|Nơi gửi)\s*:\s*([^\n]+)/i);
            let from = fromMatch ? fromMatch[1].trim() : '-';

            let toMatch = rawText.match(/(?:Bưu cục phát|Nơi nhận)\s*:\s*([^\n]+)/i);
            let to = toMatch ? toMatch[1].trim() : '-';

            let timeline = [];
            let lines = rawText.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    let time = line;
                    let detail = [];
                    let j = i + 1;
                    while (j < lines.length && !lines[j].trim().match(/^\d{2}\/\d{2}\/\d{4}/)) {
                        let subLine = lines[j].trim();
                        if (subLine) detail.push(subLine);
                        j++;
                    }
                    timeline.push({time, detail: detail.join(' ')});
                }
            }

            let fontSize = timeline.length > 20 ? '8.5px' : '9.5px';

            let htmlContent = `
                <div class="header-container">
                    <div><img src="https://vnpost.vn/images/logo.png" style="height:28px;width:auto;" alt="VNPost"/></div>
                    <div class="header-title">THÔNG TIN VẬN ĐƠN</div>
                </div>
                <div class="box-section">
                    <div class="box-title">CHI TIẾT BƯU GỬI</div>
                    <div class="info-grid">
                        <div class="info-item"><strong>Mã vận đơn:</strong> <b style="font-size:10.5px;">${code}</b></div>
                        <div class="info-item"><strong>Khối lượng:</strong> ${weight} gram</div>
                        <div class="info-item"><strong>Trạng thái:</strong> <span style="color:green;font-weight:bold;">${status}</span></div>
                        <div class="info-item"><strong>Bưu cục nhận:</strong> ${from}</div>
                        <div class="info-item" style="grid-column: span 2;"><strong>Bưu cục phát:</strong> ${to}</div>
                    </div>
                </div>
                <div class="box-section">
                    <div class="box-title">LỊCH SỬ HÀNH TRÌNH (${timeline.length} SỰ KIỆN)</div>
                    <div class="timeline-container" style="font-size:${fontSize}">
                        ${timeline.map(item => `<div class="timeline-item"><div class="timeline-time">⏱ ${item.time}</div><div class="timeline-detail">${item.detail}</div></div>`).join('')}
                    </div>
                </div>
                <div class="footer-print">
                    <div>Xuất từ InVanDon247.com</div>
                    <div><b>Mã vận đơn:</b> ${code}</div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = htmlContent;
        }
    </script>
</body>
</html>
