<script>
// =============================================
// BỘ ĐẾM GOOGLE SHEETS (URL Web App)
// =============================================
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzsVn0Af2xMybpijpIDgbyoOXt588s393Udm-D_MgPBPkbLYS0xAtCxvg819VYlU0DRfQ/exec"; 

async function logToSheet(action) {
  try {
    await fetch(GOOGLE_SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        trackingCode: currentTrackingCode,
        action: action
      })
    });
  } catch (e) {
    console.log('Không ghi được log:', e);
  }
}

let currentCookie = '';
let currentTrackingCode = '';
let currentData = null;
let captchaRequestId = 0;

const esc = s => String(s ?? '-').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function cleanStatus(s){
  return String(s || '-')
    .replace(/\s*\(\d{4,7}\s*:[^)]+\)/g, '')
    .replace(/\s*[\.\,]\s*Người nhận\s*:.*$/gi, '')
    .replace(/\s*[\.\,]\s*Ghi chú\s*:.*$/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function getAddress(item){
  return typeof item?.VI_TRI === 'string' && item.VI_TRI.trim() ? item.VI_TRI.trim() : '';
}

function getCoords(item){
  let lat = item?.LAT ?? item?.Lat ?? item?.latitude ?? item?.Latitude;
  let lng = item?.LNG ?? item?.Lon ?? item?.LONG ?? item?.longitude ?? item?.Longitude;
  return lat && lng ? {lat,lng} : null;
}

function getOffice(item){
  const text = String(item?.StatusText || item?.STATUSTEXT || '');
  const m = text.match(/\((\d{4,7})\s*:\s*([^)]*)\)/);
  if(m) return { code:m[1], name:m[2].trim(), full:m[1]+' - '+m[2].trim() };
  const code = item?.POSCode ?? item?.POSCODE ?? item?.ToPOSCode ?? '';
  return { code:String(code || '-'), name:'', full:String(code || '-') };
}

function getOfficeForDelivery(data,d){
  const direct = getOffice({
    StatusText: d?.STATUSTEXT || d?.StatusText,
    POSCode: d?.POSCODE || d?.POSCode || d?.ToPOSCode
  });
  if(direct.name) return direct;
  const code = String(d?.ToPOSCode || d?.POSCode || d?.POSCODE || direct.code || '').trim();
  if(code){
    const found = (data?.locate || []).slice().reverse().find(x => String(x?.POSCode || x?.POSCODE || '').trim() === code);
    if(found) return getOffice(found);
  }
  return direct;
}

function getDeliveryRecord(data){
  const list = Array.isArray(data?.delivery) ? data.delivery : [];
  if(!list.length) return null;
  return list.find(d => /phát thành công|delivered/i.test(String(d?.STATUSTEXT || d?.StatusText || ''))) || list[list.length - 1];
}

function getDeliveryTime(d){
  return String(d?.NGAY_PHAT || d?.DATE || d?.Date || d?.TimeDetail || d?.NGAY_NHAP || '-').trim() || '-';
}

function getDeliveryPerson(data){
  const d = getDeliveryRecord(data);
  if(!d) return { route:'-', name:'-', phone:'-', receiver:'-', time:'-' };

  const cn = String(d.NGAY_CN || '').trim();
  let route='-', name='-', phone='-';

  if(cn){
    const slashIndex = cn.indexOf('/');
    if(slashIndex >= 0){
      route = cn.slice(0, slashIndex).trim() || '-';
      let right = cn.slice(slashIndex + 1).trim();
      const pm = right.match(/(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*(\d[\d .-]{7,}\d)\s*$/iu) || right.match(/(\d[\d .-]{8,}\d)\s*$/);
      if(pm){
        phone = pm[1].replace(/\D/g, '');
        right = right.slice(0, pm.index).trim();
      }
      name = right.replace(/[.\s]*(?:ĐT|ÐT)\s*B\s*[.·]?\s*T(?:á|a)?\s*[:：]?\s*$/iu, '').replace(/[.\s]+$/,'').trim() || '-';
    }
  }

  const st = String(d.STATUSTEXT || d.StatusText || '');
  let receiver='-';
  const rm = st.match(/Người nhận\s*:\s*(.*)$/i);
  if(rm) receiver = rm[1].replace(/^\(\s*\)\s*/, '').trim();

  return { route, name, phone, receiver, time:getDeliveryTime(d) };
}

function latestStatus(data){
  const d = getDeliveryRecord(data);
  if(d?.STATUSTEXT) return String(d.STATUSTEXT).trim();
  const loc = data.locate || [];
  return loc.length ? String(loc[loc.length - 1].StatusText || '-').trim() : 'ĐANG VẬN CHUYỂN';
}

function showMsg(text, type='error'){
  const m = document.getElementById('message');
  m.className = 'msg ' + type;
  m.textContent = text;
}

function fetchWithTimeout(url, options={}, timeout=12000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  return fetch(url, { ...options, signal:controller.signal, cache:'no-store' }).finally(() => clearTimeout(timer));
}

async function loadCaptcha(){
  const img = document.getElementById('captchaImg');
  const reload = document.getElementById('reloadCaptcha');
  const requestId = ++captchaRequestId;

  img.classList.remove('loaded');
  img.removeAttribute('src');
  currentCookie='';
  reload.disabled=true;

  for(let attempt=1; attempt<=3; attempt++){
    if(requestId !== captchaRequestId) return false;
    try{
      const res = await fetchWithTimeout('/api/proxy?action=get-captcha&_=' + Date.now(), {}, 10000);
      const data = await res.json();
      if(requestId !== captchaRequestId) return false;

      if(data?.captchaUrl){
        const src = String(data.captchaUrl);
        await new Promise((resolve,reject) => {
          const test = new Image();
          test.onload = () => resolve();
          test.onerror = () => reject(new Error('captcha image error'));
          test.src=src;
        });

        if(requestId !== captchaRequestId) return false;
        img.src=src;
        img.classList.add('loaded');
        currentCookie = data.cookie || '';
        reload.disabled=false;
        return true;
      }
    }catch(e){}
    if(attempt < 3) await new Promise(r => setTimeout(r, 500));
  }
  reload.disabled=false;
  return false;
}

async function submitTracking(){
  const code = document.getElementById('trackingCode').value.trim();
  const captcha = document.getElementById('captchaText').value.trim();
  const btn = document.getElementById('btnSubmit');

  if(!code || !captcha){
    showMsg('Vui lòng nhập đầy đủ mã vận đơn và CAPTCHA.');
    return;
  }

  if(!currentCookie){
    showMsg('CAPTCHA chưa sẵn sàng. Vui lòng chờ CAPTCHA hiện ra rồi thử lại.', 'wait');
    return;
  }

  btn.disabled=true;
  btn.textContent = '⏳ Đang tra cứu...';
  showMsg('Đang kết nối hệ thống VNPost, vui lòng chờ...', 'wait');

  try{
    const res = await fetchWithTimeout('/api/proxy?action=track', {
      method:'POST',
      headers:{ 'Content-Type': 'application/json' },
      body:JSON.stringify({ trackingCode:code, captchaText:captcha, cookie:currentCookie })
    }, 30000);

    let data=null;
    try{ data = await res.json(); }catch(_){ throw new Error('Máy chủ trả về dữ liệu không hợp lệ.'); }

    if(data?.info?.ID){
      currentTrackingCode = data.info.ID;
      currentData = data;

      // GHI LOG TRA CỨU
      logToSheet('Tra cứu');

      renderScreen(data);
      renderPrint(data);

      document.getElementById('result-card').style.display='block';
      document.getElementById('result').style.display='flex';

      showMsg('Tra cứu thành công. Bạn có thể xem, in A4 hoặc tải PDF.', 'ok');
      document.getElementById('result-card').scrollIntoView({ behavior:'smooth', block:'start' });
    }else{
      showMsg(data?.message || 'Mã CAPTCHA không đúng hoặc không tìm thấy thông tin vận đơn.');
      document.getElementById('captchaText').value='';
      await loadCaptcha();
    }
  }catch(e){
    if(e?.name === 'AbortError'){
      showMsg('Tra cứu mất quá nhiều thời gian. Vui lòng thử lại sau vài giây.');
    }else{
      showMsg('Lỗi tra cứu: ' + (e?.message || 'Không xác định'));
    }
  }finally{
    btn.disabled=false;
    btn.textContent = '🔎 TRA CỨU VẬN ĐƠN';
  }
}

function renderScreen(data){
  const info = data.info || {};
  const locate = data.locate || [];
  const delivery = data.delivery || [];
  const status = latestStatus(data);
  const dp = getDeliveryPerson(data);

  const html = `
  <div class="detail-box">
    <div class="detail-title">
      <svg class="loc-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      CHI TIẾT BƯU GỬI
    </div>
    <div class="detail-grid">
      <div class="detail-item">✉ Mã vận đơn: <b>${esc(info.ID)}</b></div>
      <div class="detail-item">⚖ Khối lượng: <b>${esc(info.Weight || 0)} gam</b></div>
      <div class="detail-item">📍 Trạng thái: <span class="status-badge">${esc(cleanStatus(status))}</span></div>
      <div class="detail-item">📤 Bưu cục gửi: <b>${esc(info.BC_GUI || '-')}</b></div>
      <div class="detail-item">📥 Bưu cục phát: <b>${esc(info.BC_PHAT || '-')}</b></div>
      <div class="detail-item">👤 Người nhận: <span class="receiver-text">${esc(dp.receiver !== '-' ? dp.receiver : '-')}</span></div>
    </div>
  </div>

  <div class="section-title">THÔNG TIN TRẠNG THÁI (${locate.length} SỰ KIỆN)</div>

  <div class="timeline">
    ${locate.map((item,i) => {
      const address = getAddress(item);
      const coords = getCoords(item);
      const office = getOffice(item);
      return `
      <div class="event ${i === locate.length - 1 ? 'latest' : ''}" id="event-${i}">
        <span class="event-dot"></span>
        <div class="event-time">${esc((item.Date || '') + ' ' + (item.TimeDetail || ''))}</div>
        <div class="event-status">
          ${esc(cleanStatus(item.StatusText))}
          <b>Bưu cục: ${esc(office.full)}</b>
        </div>
        <div class="event-location">${esc(address)}</div>
        <button class="map-btn" title="Xem vị trí" onclick='openMap(${JSON.stringify(address)},${JSON.stringify(cleanStatus(item.StatusText))},${JSON.stringify(coords)})'>➤</button>
      </div>`;
    }).join('')}
  </div>

  <div class="delivery">
    <div class="section-title" style="margin-left:0">THÔNG TIN PHÁT</div>
    <table class="delivery-table">
      <thead>
        <tr>
          <th>Ngày</th>
          <th>Bưu cục / Bưu tá</th>
          <th>Chi tiết</th>
        </tr>
      </thead>
      <tbody>
        ${delivery.length ? delivery.map(d => {
          const o = getOfficeForDelivery(data, d);
          const pi = getDeliveryPerson({ delivery:[d] });
          const postmanText = pi.name !== '-' ? pi.name + (pi.phone !== '-' ? ' - ' + pi.phone : '') : '';
          return `
          <tr>
            <td>${esc(getDeliveryTime(d))}</td>
            <td>
              <b>${esc(o.full)}</b>
              ${postmanText ? `<div class="postman-info">Bưu tá: ${esc(postmanText)}</div>` : ''}
            </td>
            <td>${esc(d.STATUSTEXT || d.StatusText || '-')}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">Chưa có dữ liệu phát</td></tr>`}
      </tbody>
    </table>

    <div class="delivery-cards-mobile">
      ${delivery.length ? delivery.map(d => {
        const o = getOfficeForDelivery(data, d);
        const pi = getDeliveryPerson({ delivery:[d] });
        const postmanText = pi.name !== '-' ? pi.name + (pi.phone !== '-' ? ' - ' + pi.phone : '') : '';
        return `
        <div class="delivery-card-item">
          <div class="delivery-card-header">
            <span>📅 ${esc(getDeliveryTime(d))}</span>
          </div>
          <div class="delivery-card-body">
            <div><b>Bưu cục:</b> ${esc(o.full)}</div>
            ${postmanText ? `<div style="color:var(--text-muted); font-size:12px;"><b>Bưu tá:</b> ${esc(postmanText)}</div>` : ''}
            <div style="margin-top:2px;"><b>Trạng thái:</b> <span style="color:var(--green); font-weight:600;">${esc(d.STATUSTEXT || d.StatusText || '-')}</span></div>
          </div>
        </div>`;
      }).join('') : `<div class="delivery-card-item" style="text-align:center; color:#94a3b8;">Chưa có dữ liệu phát</div>`}
    </div>
  </div>

  <div id="map-panel" class="map-panel">
    <div class="map-toolbar">
      <b id="map-title">Vị trí bưu cục</b>
      <a id="map-link" target="_blank" rel="noopener">Mở Google Maps ↗</a>
    </div>
    <iframe id="map-frame" class="map-frame" loading="lazy"></iframe>
  </div>

  <div class="screen-footer">Dữ liệu được truy xuất trực tiếp từ hệ thống VNPost qua cổng kết nối InVanDon247</div>`;

  document.getElementById('screen-result').innerHTML = html;
}

function openMap(address, title, coords){
  const panel = document.getElementById('map-panel');
  panel.classList.add('show');
  document.getElementById('map-title').textContent = title + ' — ' + address;
  const q = coords ? `${coords.lat},${coords.lng}` : address;
  document.getElementById('map-link').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  document.getElementById('map-frame').src = 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed';
  panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* Tạo Barcode bằng JsBarcode - Đã tăng chiều cao và bỏ chữ bên dưới */
function generateBarcodeBase64(text) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  JsBarcode(svg, text, {
    format: "CODE128",
    width: 2,
    height: 60,
    displayValue: false,
    margin: 6
  });
  const xml = new XMLSerializer().serializeToString(svg);
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
}

function buildPrintEventCard(item){
  return `
    <div class="p-event-card">
      <div class="p-event-time">⏰ ${esc((item.Date || '') + ' ' + (item.TimeDetail || ''))}</div>
      <div class="p-event-desc">${esc(cleanStatus(item.StatusText))}</div>
      <div class="p-event-office">Bưu cục: ${esc(getOffice(item).full)} ${getAddress(item) ? ' - ' + esc(getAddress(item)) : ''}</div>
    </div>`;
}

function buildPrintPageHTML(data, chunk, pageIndex, totalPages, splitIndex, includeDelivery){
  const info = data.info || {};
  const locate = data.locate || [];
  const delivery = data.delivery || [];
  const dp = getDeliveryPerson(data);

  const left = chunk.slice(0, splitIndex);
  const right = chunk.slice(splitIndex);

  const qrLink = `https://invandon247.com/?code=${info.ID || currentTrackingCode || '-'}`;
  
  // Tạo QR dạng ảnh
  const qrEl = document.createElement('div');
  new QRCode(qrEl, {
    text: qrLink,
    width: 55,
    height: 55,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
  const qrCanvas = qrEl.querySelector('canvas');
  const qrImg = qrEl.querySelector('img');
  const qrSrc = qrCanvas ? qrCanvas.toDataURL('image/png') : qrImg.src;

  const barcodeBase64 = generateBarcodeBase64(info.ID || currentTrackingCode || '-');

  const adBanner = `
    <div class="p-ad-box">
      <div class="ad-text">🔥 TUYỂN DỤNG NV GIAO HÀNG / NHÂN VIÊN BƯU CỤC - THU NHẬP 10 - 20 TRIỆU. GỌI 19006885</div>
    </div>
  `;

  return `
    <div class="print-page">
      <div class="p-header">
        <div class="p-header-left">
          <!-- ĐƯỜNG DẪN MỚI: Logo nằm trong images -->
          <img class="p-logo" src="/images/logo.png" alt="InVanDon247">
          <div class="p-brand-info">
            <div class="p-brand-name">InVanDon247</div>
            <div class="p-brand-sub">Công cụ tra cứu và tạo phiếu vận đơn A4</div>
          </div>
        </div>
        <div class="p-title-wrap">
          <div class="p-title-main">THÔNG TIN VẬN ĐƠN</div>
          <div class="p-title-code">Mã vận đơn: ${esc(info.ID || currentTrackingCode || '-')} (Đơn vị VNPOST - Bưu điện Việt Nam)</div>
        </div>
        <img class="p-qr-code" src="${qrSrc}" alt="QR Code">
      </div>

      ${pageIndex === 0 ? `
      <div class="p-section-box">
        <div class="p-section-head">CHI TIẾT BƯU GỬI</div>
        <div class="p-grid-info">
          <div class="p-barcode-item">
            <img class="p-barcode-img" src="${barcodeBase64}" alt="Barcode">
          </div>
          
          <div class="p-info-item">
            <div class="p-info-top">Mã vận đơn: <b>${esc(info.ID)}</b></div>
            <div>Bưu cục gửi: <b>${esc(info.BC_GUI || '-')}</b></div>
          </div>
          
          <div class="p-info-item">
            <div class="p-info-top">Khối lượng: <b>${esc(info.Weight || 0)} gam</b></div>

          </div>
          
          <div class="p-info-item">
            <div class="p-info-top">Trạng thái: <b style="color:#059669">${esc(cleanStatus(latestStatus(data)))}</b></div>
            <div>Người nhận: <b>${esc(dp.receiver !== '-' ? dp.receiver : '-')}</b></div>
          </div>
        </div>
      </div>
      ` : ''}

      <div class="p-section-box p-timeline-box">
        <div class="p-section-head">LỊCH SỬ HÀNH TRÌNH (${locate.length} SỰ KIỆN)</div>
        <div style="padding:4px;">
          <table class="p-timeline-table">
            <tr>
              <td>${left.map(buildPrintEventCard).join('')}</td>
              <td>${right.map(buildPrintEventCard).join('')}</td>
            </tr>
          </table>
        </div>
      </div>

      ${includeDelivery ? `
      <div class="p-section-box p-delivery-box">
        <div class="p-section-head">THÔNG TIN PHÁT</div>
        <div style="padding:3px;">

            <thead>
              <tr>

                <th style="width:40%;">Bưu cục / Bưu tá</th>

                const postmanText = pi.name !== '-' ? pi.name + (pi.phone !== '-' ? ' - ' + pi.phone : '') : '';
                return `
                <tr>
                  <td>${esc(getDeliveryTime(d))}</td>
                  <td>
                    <b>${esc(o.full)}</b>
                    ${postmanText ? `<br><span style="color:#475569;">Bưu tá: ${esc(postmanText)}</span>` : ''}
                  </td>
                  <td>${esc(d.STATUSTEXT || d.StatusText || '-')}</td>
                </tr>`;
              }).join('') : `<tr><td colspan="3" style="text-align:center;">Chưa có dữ liệu phát</td></tr>`}
            </tbody>
          </table>

      ` : ''}

      ${adBanner}

      <div class="p-footer">
        Dữ liệu được truy xuất trực tiếp từ hệ thống VNPost qua cổng kết nối InVanDon247 — Trang ${pageIndex + 1}/${totalPages}
      </div>
    </div>`;
}

function createPrintMeasureRoot(){
  const root = document.createElement('div');
  root.id = 'print-measure-root';
  root.style.cssText =
    'position:absolute;left:-100000px;top:0;width:194mm;visibility:hidden;pointer-events:none;z-index:-1;';
  document.body.appendChild(root);
  return root;
}

function measurePrintCardHeights(data){
  const locate = Array.isArray(data?.locate) ? data.locate : [];
  const root = createPrintMeasureRoot();

  const section = document.createElement('div');
  section.className = 'p-section-box';
  section.innerHTML = `
    <div class="p-section-head">LỊCH SỬ HÀNH TRÌNH</div>
    <div style="padding:4px;">
      <table class="p-timeline-table">
        <tr><td id="measure-left"></td><td id="measure-right"></td></tr>
      </table>
    </div>`;
  root.appendChild(section);

  const td = section.querySelector('#measure-left');
  const heights = [];

  for(const item of locate){
    const holder = document.createElement('div');
    holder.innerHTML = buildPrintEventCard(item);
    const card = holder.firstElementChild;
    td.appendChild(card);

    const cs = getComputedStyle(card);
    const marginBottom = parseFloat(cs.marginBottom) || 0;
    heights.push(card.getBoundingClientRect().height + marginBottom);

    td.removeChild(card);
  }

  root.remove();
  return heights;
}

function measurePageBaseHeight(data, pageIndex, totalPages, includeDelivery){
  const root = createPrintMeasureRoot();
  root.innerHTML = buildPrintPageHTML(data, [], pageIndex, totalPages, 0, includeDelivery);

  const page = root.firstElementChild;
  const pageRect = page.getBoundingClientRect();
  const footer = page.querySelector('.p-footer');

  let contentBottom = footer
    ? footer.getBoundingClientRect().bottom - pageRect.top
    : 0;

  contentBottom += 1;

  const pageHeight = pageRect.height;
  root.remove();

  return {
    pageHeight,
    available: Math.max(0, pageHeight - contentBottom)
  };
}

function findSplitForChunk(heights, start, count, capacity){
  if(count <= 0) return 0;

  const prefix = [0];
  for(let i=0;i<count;i++){
    prefix.push(prefix[prefix.length - 1] + (heights[start + i] || 0));
  }

  if(count === 1){
    return prefix[1] <= capacity ? 1 : 0;
  }

  let best = -1;
  let bestBalance = Infinity;

  for(let k=1;k<count;k++){
    const left = prefix[k];
    const right = prefix[count] - prefix[k];

    if(left <= capacity && right <= capacity){
      const balance = Math.abs(left - right);
      if(balance < bestBalance){
        bestBalance = balance;
        best = k;
      }
    }
  }

  return best;
}

function renderPrint(data){
  const locate = Array.isArray(data?.locate) ? data.locate : [];
  const printArea = document.getElementById('print-area');

  if(!printArea) return;

  const heights = measurePrintCardHeights(data);
  const totalEvents = locate.length;
  const pages = [];
  let start = 0;
  let pageIndex = 0;

  const MEASURE_TOTAL = 999;

  while(start < totalEvents || pageIndex === 0){
    const remaining = totalEvents - start;

    if(remaining > 0){
      const lastBase = measurePageBaseHeight(data, pageIndex, MEASURE_TOTAL, true);
      const splitAll = findSplitForChunk(heights, start, remaining, lastBase.available);

      if(splitAll > 0){
        pages.push({
          start,
          count: remaining,
          split: splitAll,
          includeDelivery: true
        });
        start = totalEvents;
        break;
      }
    }else{
      pages.push({
        start: totalEvents,
        count: 0,
        split: 0,
        includeDelivery: true
      });
      break;
    }

    const base = measurePageBaseHeight(data, pageIndex, MEASURE_TOTAL, false);
    let maxCount = 0;

    const limit = remaining > 1 ? remaining - 1 : remaining;

    for(let count=1; count<=limit; count++){
      const split = findSplitForChunk(heights, start, count, base.available);
      if(split <= 0) break;
      maxCount = count;
    }

    if(maxCount === 0 && remaining > 0){
      maxCount = 1;
    }

    const split = findSplitForChunk(heights, start, maxCount, base.available);

    pages.push({
      start,
      count: maxCount,
      split: split > 0 ? split : 1,
      includeDelivery: false
    });

    start += maxCount;
    pageIndex++;

    if(pageIndex > totalEvents + 5) break;
  }

  const totalPages = pages.length || 1;

  printArea.innerHTML = pages.map((p, i) => {
    const chunk = locate.slice(p.start, p.start + p.count);

    return buildPrintPageHTML(
      data,
      chunk,
      i,
      totalPages,
      p.split,
      p.includeDelivery
    );
  }).join('');
}

function safeTrackingFilename(){
  const raw = String(currentTrackingCode || currentData?.info?.ID || '247').trim();
  return raw.replace(/[^a-zA-Z0-9_-]/g, '_');
}

async function printA4(){
  if(!currentData){
    alert('Vui lòng tra cứu vận đơn trước.');
    return;
  }

  try{
    if(document.fonts?.ready) await document.fonts.ready;
  }catch(_){}

  renderPrint(currentData);

  // GHI LOG IN A4
  logToSheet('In A4');

  const oldTitle = document.title;
  const printFilename = `InVanDon247_VNPost_${safeTrackingFilename()}`;
  document.title = printFilename;

  const restoreTitle = () => {
    document.title = oldTitle;
    window.removeEventListener('afterprint', restoreTitle);
  };
  window.addEventListener('afterprint', restoreTitle);

  setTimeout(() => window.print(), 300);
}

/* HÀM TẢI XUỐNG PDF (HTML2CANVAS - TỐI ƯU) */
async function downloadPDF(){
  if(!currentData){
    alert('Vui lòng tra cứu vận đơn trước.');
    return;
  }

  const pdfBtn = document.querySelector('.pdf-btn');
  const originalText = pdfBtn.innerHTML;

  try{
    pdfBtn.disabled = true;
    pdfBtn.innerHTML = '⏳ Đang tạo PDF...';

    renderPrint(currentData);
    
    const printArea = document.getElementById('print-area');
    const pages = printArea.querySelectorAll('.print-page');
    
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4',
      compress: true,
    });

    const pageWidth = 210;
    let pageIndex = 0;

    for (const page of pages) {
      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'absolute';
      tempContainer.style.left = '-100000px';
      tempContainer.style.top = '0';
      tempContainer.style.width = '210mm';
      tempContainer.style.boxSizing = 'border-box';
      tempContainer.style.background = '#ffffff';
      tempContainer.style.padding = '8mm';
      
      const pageClone = page.cloneNode(true);
      pageClone.style.width = '194mm';
      pageClone.style.height = 'auto';
      pageClone.style.overflow = 'visible';
      pageClone.style.margin = '0';
      pageClone.style.pageBreakAfter = 'auto';
      pageClone.style.breakAfter = 'auto';

      const imgs = pageClone.querySelectorAll('img');
      for (const img of imgs) {
        if (img.src.startsWith('blob:') || img.src.startsWith('http')) {
          try {
            const imgCanvas = document.createElement('canvas');
            imgCanvas.width = img.naturalWidth;
            imgCanvas.height = img.naturalHeight;
            const ctx = imgCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            img.src = imgCanvas.toDataURL('image/png');
          } catch (e) {}
        }
      }

      tempContainer.appendChild(pageClone);
      document.body.appendChild(tempContainer);

      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 100));

      const canvas = await html2canvas(tempContainer, {
        scale: 1.5,
        useCORS: true,
        allowTaint: false,
        logging: false,
        backgroundColor: '#ffffff',
        width: tempContainer.scrollWidth,
        height: tempContainer.scrollHeight
      });

      document.body.removeChild(tempContainer);

      const imgData = canvas.toDataURL('image/png');
      
      if (pageIndex > 0) {
        pdf.addPage();
      }
      
      const imgWidth = pageWidth - 16;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      
      pdf.addImage(imgData, 'PNG', 8, 8, imgWidth, imgHeight);
      
      pageIndex++;
    }

    pdf.save(`InVanDon247_VNPost_${safeTrackingFilename()}.pdf`);

    // GHI LOG TẢI PDF
    logToSheet('Tải PDF');

  }catch(error){
    console.error('PDF Error:', error);
    alert('Lỗi tải PDF: ' + error.message);
  }finally{
    pdfBtn.disabled = false;
    pdfBtn.innerHTML = originalText;
  }
}
